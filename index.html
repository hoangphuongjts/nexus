    async function lookupWord(word) {
      const box = $("#dict-def"); if (!box) return;
      box.textContent = "Đang tra…";
      const single = word.trim().split(/\s+/).length === 1;
      try {
        if (single && /^[a-zA-Z][a-zA-Z\-']+$/.test(word.trim())) {
          const res = await fetch("https://api.dictionaryapi.dev/api/v2/entries/en/" + encodeURIComponent(word.trim().toLowerCase()));
          if (res.ok) {
            const data = await res.json();
            const meanings = (data[0] && data[0].meanings) || [];
            const lines = [];
            meanings.slice(0, 3).forEach((m) => { (m.definitions || []).slice(0, 2).forEach((d) => lines.push((m.partOfSpeech ? m.partOfSpeech + ": " : "") + d.definition)); });
            if (lines.length) { box.innerHTML = lines.map(esc).join("<br/>"); return; }
          }
        }
        if (single) {
          const res = await fetch("https://vi.wiktionary.org/api/rest_v1/page/definition/" + encodeURIComponent(word.trim()));
          if (res.ok) {
            const data = await res.json();
            const vi = data.vi || data.en || [];
            const lines = [];
            (Array.isArray(vi) ? vi : []).forEach((sec) => (sec.definitions || []).slice(0, 2).forEach((d) => { const tmp = document.createElement("div"); tmp.innerHTML = d.definition || ""; lines.push(tmp.textContent); }));
            if (lines.length) { box.innerHTML = lines.map(esc).join("<br/>"); return; }
          }
        }
        box.innerHTML = "Chưa tra được nghĩa tự động cho " + (single ? "từ" : "đoạn") + " này — anh dùng nút “Tìm trên web” bên dưới giúp em nhé.";
      } catch (e) { box.textContent = "Chưa tra được (có thể do mạng) — anh dùng nút “Tìm trên web” giúp em nhé."; }
    }

    /* Đọc ↔ Nghe liền mạch: mở mục Nghe tại đúng chương đang đọc. */

    /* ================= Gắn sự kiện theo view ================= */
    function bindView() {

    const _renderBase = render;

    /* ================= Thư viện có sẵn =================
       Kho sách dựng sẵn đi kèm app: danh mục tải từ data/catalog.json trên cùng
       máy chủ với app; bìa và file EPUB lấy đúng URL ghi trong catalog (không tự
       ghép đường dẫn). Khách chưa đăng nhập cũng xem/đọc/nghe được. Cuốn nào đã
       mở thì file nằm trong IndexedDB (kho "files", khóa "book:<id>") để đọc
       offline, và có một bản ghi sách thường trong thư viện để dùng chung trình
       đọc + mục Nghe hiện có. */
    const SHELF_CATALOG_URL = "https://hoangphuongjts.github.io/nexus/data/catalog.json";
    const SHELF = { status: "idle", books: [] };
    const shelfLocalId = (cid) => "shelf-" + cid;
    function shelfCat(cid) { return SHELF.books.find((b) => b.id === cid) || null; }
    function fmtShelfSize(n) {
      n = Number(n) || 0;
      if (!n) return "";
      if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1).replace(".", ",") + " MB";
      if (n >= 1024) return Math.round(n / 1024) + " KB";
      return n + " B";
    }
    /* Tải danh mục 1 lần rồi dùng bản cache trong máy: có cache thì hiện ngay và
       lặng lẽ kiểm tra bản mới ở nền; chưa có cache mới phải tải từ máy chủ. */
    async function fetchShelfCatalog() {
      const res = await fetch(SHELF_CATALOG_URL, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("Danh mục sai định dạng");
      return data.filter((b) => b && b.id && b.title && b.epub);
    }
    async function loadShelfCatalog(force) {
      if (SHELF.status === "loading") return;
      if (SHELF.status === "ready" && !force) return;
      if (!force) {
        const cached = await idb.get("kv", "shelfCatalog:v1");
        if (cached && Array.isArray(cached.books) && cached.books.length) {
          SHELF.books = cached.books; SHELF.status = "ready";
          if (S.view === "shelf") render();
          fetchShelfCatalog().then((books) => {
            if (books.length && JSON.stringify(books) !== JSON.stringify(SHELF.books)) {
              SHELF.books = books;
              idb.put("kv", "shelfCatalog:v1", { at: Date.now(), books });
              if (S.view === "shelf") render();
            }
          }).catch(() => {});
          return;
        }
      }
      SHELF.status = "loading";
      if (S.view === "shelf") render();
      try {
        SHELF.books = await fetchShelfCatalog();
        SHELF.status = "ready";
        idb.put("kv", "shelfCatalog:v1", { at: Date.now(), books: SHELF.books });
      } catch (e) {
        SHELF.status = "error";
      }
      if (S.view === "shelf") render();
    }
    function filteredShelfBooks() {
      let list = SHELF.books.slice();
      if (S.shelfQuery) { const q = normTitle(S.shelfQuery); list = list.filter((b) => normTitle((b.title || "") + " " + (b.author || "")).includes(q)); }
      return list;
    }
    function shelfCoverHTML(b) {
      if (b.cover) return '<img src="' + esc(b.cover) + '" alt="" loading="lazy" /><span class="fmt">EPUB</span>';
      return '<span class="ph" style="background:' + coverGradient(b.title + b.id) + '"><span class="tag">Thư viện có sẵn</span><span class="t">' + esc(b.title) + '</span><span class="a">' + esc(b.author || "") + '</span></span><span class="fmt">EPUB</span>';
    }
    function shelfGridHTML(list) {
      return shelfHTML(list, shelfColumns("library"),
        (b) => '<button class="cover" data-shelf-detail="' + esc(b.id) + '" aria-label="Xem chi tiết: ' + esc(b.title) + '">' + shelfCoverHTML(b) + "</button>",
        (b) => '<span class="book-title">' + esc(b.title) + '</span><span class="book-author">' + esc(b.author || "Chưa rõ tác giả") + "</span>");
    }
    function shelfGridInner() {
      const list = filteredShelfBooks();
      return list.length ? shelfGridHTML(list) : '<section class="empty"><h3>Không thấy cuốn nào khớp</h3><p>Anh thử từ khoá khác nhé.</p></section>';
    }
    function viewShelf() {

      h += '<p style="color:var(--dim);font-size:13.5px;line-height:1.55;margin:2px 0 6px">Kho sách có sẵn ngay trong app — không cần đăng nhập, chọn một cuốn là đọc hoặc nghe ngay. Cuốn đã tải về máy thì mở được cả khi không có mạng.</p>';
      if (SHELF.status === "idle" || SHELF.status === "loading") {
        if (SHELF.status === "idle") loadShelfCatalog();
        h += '<section class="empty"><div style="display:flex;justify-content:center;margin-bottom:12px"><div class="spinner"></div></div><h3>Đang tải danh mục sách…</h3></section>';
        return h;
      }
      if (SHELF.status === "error") {
        h += '<section class="empty"><h3>Chưa tải được Thư viện có sẵn, kiểm tra mạng rồi thử lại</h3><div class="row" style="justify-content:center"><button class="btn primary" data-shelf-retry="1">' + icon("sync", 16) + " Thử lại</button></div></section>";
        return h;
      }
      h += '<div class="toolbar"><div class="search-box">' + icon("search", 17) + '<input id="shelf-q" type="text" placeholder="Tìm theo tên sách, tác giả…" value="' + esc(S.shelfQuery) + '" /></div></div>';

          (have ? '<div style="font-size:12.5px;font-weight:700;color:var(--accent-strong);margin-top:7px">✓ Đã tải về máy — mở được khi không có mạng</div>' : "") +
          "</div></div>" +
        '<div style="display:flex;gap:8px;margin-top:16px">' +

    let shelfBusy = false;
    async function ensureShelfBook(cat) {
      const localId = shelfLocalId(cat.id);
      let book = findBook(localId);
      const have = await idb.get("files", "book:" + localId);
      if (book && have) return book;
      const res = await fetch(cat.epub);
      if (!res.ok) throw new Error("Không tải được file sách (mã " + res.status + ") — anh kiểm tra mạng rồi thử lại nhé.");
      const blob = await res.blob();
      await idb.put("files", "book:" + localId, blob);
      if (!book) {
        book = {
          id: localId, title: cat.title, author: cat.author || "",
          format: "epub", size: cat.size || blob.size, fileName: cat.id + ".epub", cover: cat.cover || "",
          driveFileId: "", collections: [], addedAt: Date.now(), shelf: true, shelfEpub: cat.epub,
        };
        DB.books.push(book); persist("books");
      }
      return book;
    }
    async function shelfOpen(cid, listen) {
      const cat = shelfCat(cid); if (!cat || shelfBusy) return;
      shelfBusy = true;
      const rb = $("#modal-root [data-shelf-read]"); const lb = $("#modal-root [data-shelf-listen]");
      [rb, lb].forEach((b) => { if (b) b.disabled = true; });

      if (target) target.innerHTML = "Đang tải sách…";
      try {
        const book = await ensureShelfBook(cat);
        closeModal();
        if (listen) S.pendingShelfListen = book.id;
        openBook(book.id);
      } catch (e) {
        toast("Chưa tải được sách: " + ((e && e.message) || e), 5600);
        [rb, lb].forEach((b) => { if (b) b.disabled = false; });

    /* ================= Nghe sách / Podcast ================= */
    const A = {
      bookId: "", chapters: null, chIdx: 0, chunks: [], chunkIdx: 0,

    /* Khớp sách Play Sách -> sách đã có file trong app (dùng lại cơ chế khớp tên sẵn có). */

    function afterListenRender() {

      }
      const sel = $("#listen-book");
      if (sel) sel.addEventListener("change", () => { stopAudio(); S.listenBookId = sel.value; A.chapters = null; render(); });
      const jump = $("#listen-read-jump");
      if (jump) jump.addEventListener("click", readFromListenPosition);
      const book = findBook(S.listenBookId);

    async function loadListenChapters(book) {
      const box = $("#listen-chapters"); if (!box) return;
      try {
        const chapters = await extractChapters(book);
        A.chapters = chapters;
        const pos = posOf(book.id) || {};
        let startIdx = 0;
        if (pos.listen && typeof pos.listen.chapterIdx === "number") startIdx = Math.min(chapters.length - 1, pos.listen.chapterIdx);
        else if (pos.listen && typeof pos.listen.chapterFromReader === "number") {
          const hit = chapters.findIndex((c) => c.spineIndex === pos.listen.chapterFromReader);
          startIdx = hit >= 0 ? hit : Math.floor((pos.percent || 0) * chapters.length);
        } else if (pos.percent) startIdx = Math.min(chapters.length - 1, Math.floor(pos.percent * chapters.length));
        A.chIdx = startIdx;
        renderChapterList(book, chapters, startIdx);
        // Lệnh “nghe sách” từ khung chat AI: tự bắt đầu phát giọng tiếng Việt từ vị trí đọc hiện tại.
        if (A.pendingAutoPlay && A.bookId === book.id) {
          A.pendingAutoPlay = false;
          if (!A.voice) A.voice = pickViVoice();
          const ck = (pos.listen && pos.listen.chapterIdx === startIdx) ? (pos.listen.chunkIdx || 0) : 0;
          startDeviceListen(startIdx, ck);
        }
      } catch (e) {
        if (book.format === "cbz") { box.innerHTML = '<section class="empty"><h3>Truyện tranh chỉ đọc bằng mắt nhé</h3><p>“' + esc(book.title) + '” là truyện tranh dạng ảnh nên không có bản nghe — anh mở sách để xem từng trang nhé.</p></section>'; return; }
        box.innerHTML = '<section class="empty"><h3>Chưa chuẩn bị được audio cho sách này</h3><p>' + esc((e && e.message) || e) + "</p></section>";
      }
    }
    function chapterMinutes(text) { return Math.max(1, Math.round(text.length / 820)); }
    function episodeOf(bookId, chIdx) { return DB.episodes.find((e) => e.bookId === bookId && e.chapterIdx === chIdx); }
    function renderChapterList(book, chapters, startIdx) {
      const box = $("#listen-chapters"); if (!box) return;
      const keys = loadKeys();
      const pos = posOf(book.id) || {};
      const listenPos = pos.listen || {};
      box.innerHTML = '<div class="card" style="padding:6px 16px">' + chapters.map((c, i) => {
        const ep = episodeOf(book.id, i);
        const isCur = i === startIdx && (listenPos.chapterIdx === i || pos.listen);
        return '<div class="ep-row"><span class="n">' + (i + 1) + '</span><div class="info"><b>' + esc(c.title) + "</b><span>~" + chapterMinutes(c.text) + " phút nghe" + (isCur ? " · đang nghe dở" : "") + (ep ? " · đã có file podcast" : "") + '</span></div>' +
          '<button class="btn small primary" data-listen-ch="' + i + '">' + icon("play", 14) + " Nghe ngay</button>" +
          (ep ? '<button class="btn small soft" data-ep-play="' + ep.id + '">' + icon("head", 14) + " Nghe file</button>" : "") +
          (keys.openai ? '<button class="btn small" data-ep-make="' + i + '" ' + (A.generating ? "disabled" : "") + ">" + (A.generating === book.id + ":" + i ? "Đang tạo…" : "Tạo file podcast") + "</button>" : "") +
          "</div>";
      }).join("") + "</div>" +
        (keys.openai ? "" : '<p style="font-size:12.5px;color:var(--dim);margin-top:10px">Muốn tạo <b>file podcast</b> lưu lại để nghe offline: dán khóa OpenAI trong mục Cài đặt — còn “Nghe ngay” bằng giọng của máy thì miễn phí, không cần khóa.</p>');
      $$("[data-listen-ch]", box).forEach((el) => el.addEventListener("click", () => startDeviceListen(Number(el.getAttribute("data-listen-ch")), 0)));
      $$("[data-ep-make]", box).forEach((el) => el.addEventListener("click", () => makePodcastEpisode(Number(el.getAttribute("data-ep-make")))));
      $$("[data-ep-play]", box).forEach((el) => el.addEventListener("click", () => playEpisodeFile(el.getAttribute("data-ep-play"))));
    }
    /* Lọc ký tự định dạng (* _ # | < > [ ]) để giọng máy không đọc vấp ký tự lạ. */
    function cleanForSpeech(text) { return String(text || "").replace(/[*_#|<>[\]]/g, " ").replace(/\s+/g, " "); }
    function splitChunks(text, max) {
      const parts = []; const sentences = String(text || "").split(/(?<=[.!?…])\s+/);
      let cur = "";
      sentences.forEach((s) => {
        if ((cur + " " + s).length > max && cur) { parts.push(cur); cur = s; }
        else cur = cur ? cur + " " + s : s;
        while (cur.length > max * 1.6) { parts.push(cur.slice(0, max)); cur = cur.slice(max); }
      });
      if (cur.trim()) parts.push(cur);
      return parts.filter((p) => p.trim().length > 0);
    }
    function pickViVoice() {
      try {
        const voices = speechSynthesis.getVoices();
        return voices.find((v) => /^vi/i.test(v.lang)) || voices.find((v) => /viet/i.test(v.name)) || null;
      } catch (e) { return null; }
    }
    function startDeviceListen(chIdx, chunkIdx) {
      const book = findBook(A.bookId); if (!book || !A.chapters) return;
      stopFileAudio();
      A.mode = "device"; A.chIdx = chIdx;
      A.chunks = splitChunks(cleanForSpeech(A.chapters[chIdx].text), 190);
      A.chunkIdx = Math.min(chunkIdx || 0, Math.max(0, A.chunks.length - 1));
      A.playing = true;
      if (!A.voice) A.voice = pickViVoice();
      showPlayer(book, A.chapters[chIdx].title);
      speakCurrent();
    }
    function speakCurrent() {
      if (!("speechSynthesis" in window)) { toast("Máy này không có giọng đọc sẵn — anh dùng “Tạo file podcast” hoặc thử trình duyệt khác nhé."); return; }
      speechSynthesis.cancel();
      if (A.chunkIdx >= A.chunks.length) { nextChapterListen(); return; }
      if (!A.voice) A.voice = pickViVoice(); // giọng có thể nạp muộn qua onvoiceschanged — chọn lại trước mỗi đoạn
      const u = new SpeechSynthesisUtterance(A.chunks[A.chunkIdx]);
      if (A.voice) u.voice = A.voice;
      u.lang = (A.voice && A.voice.lang) || "vi-VN";
      u.rate = A.rate;
      u.onend = () => {
        if (!A.playing || A.mode !== "device") return;
        A.chunkIdx++; saveListenPos();
        if (A.chunkIdx >= A.chunks.length) {
          if (A.stopAtChapterEnd) { A.stopAtChapterEnd = false; A.playing = false; try { speechSynthesis.cancel(); } catch (e) {} toast("Đã hết chương — app dừng nghe như đã hẹn. Chúc anh thư giãn!"); updatePlayerToggle(); return; }
          nextChapterListen();
        }
        else { speakCurrent(); updatePlayerSub(); }
      };
      u.onerror = () => { if (A.playing && A.mode === "device") { A.chunkIdx++; if (A.chunkIdx < A.chunks.length) speakCurrent(); } };
      speechSynthesis.speak(u);
      updatePlayerSub();
    }
    function nextChapterListen() {
      if (A.chIdx + 1 < (A.chapters || []).length) { startDeviceListen(A.chIdx + 1, 0); }
      else { A.playing = false; toast("Đã nghe hết sách. Hay quá anh!"); updatePlayerToggle(); }
    }
    function saveListenPos() {
      const book = findBook(A.bookId); if (!book || !A.chapters) return;
      const total = A.chapters.reduce((s, c) => s + c.text.length, 0) || 1;
      let before = 0; for (let i = 0; i < A.chIdx; i++) before += A.chapters[i].text.length;
      const within = A.chunks.slice(0, A.chunkIdx).reduce((s, c) => s + c.length, 0);
      const pos = DB.positions[book.id] || (DB.positions[book.id] = {});
      pos.listen = { chapterIdx: A.chIdx, chunkIdx: A.chunkIdx, percent: (before + within) / total, updatedAt: Date.now() };
      pos.updatedAt = Date.now();
      persistDebounced("positions", 600);
    }
    function showPlayer(book, sub) {
      const bar = $("#player-bar"); if (!bar) return;
      bar.classList.remove("hidden");

      updatePlayerSub(sub);
      $$(".rate-chip").forEach((c) => c.classList.toggle("active", Number(c.getAttribute("data-rate")) === A.rate));
      updatePlayerToggle();
      updatePlayerMode();
    }
    function updatePlayerSub(sub) {
      const el = $("#pb-sub"); if (!el) return;
      const ttl = $("#pb-title");
      if (A.mode === "file") { if (ttl) ttl.textContent = "Đang nghe " + (sub || "file podcast") + " • Nghe rảnh tay"; el.textContent = sub || "Đang phát file podcast"; return; }
      const ch = A.chapters && A.chapters[A.chIdx];
      const book = findBook(A.bookId);
      if (ttl && ch) ttl.textContent = "Đang đọc " + ch.title + " • Nghe rảnh tay";
      el.textContent = (book ? book.title + " · " : "") + "đoạn " + (A.chunkIdx + 1) + "/" + A.chunks.length + (A.voice ? " · giọng: " + A.voice.name : " · giọng mặc định của máy");
    }
    /* Dòng trạng thái nghe rảnh tay: tốc độ đọc + hẹn giờ tắt đang chọn, luôn nhìn thấy trong khung nghe. */
    function updatePlayerMode() {
      const el = $("#pb-mode"); if (!el) return;
      const tSel = $("#pb-timer"); const tv = tSel ? tSel.value : "0";
      const tTxt = tv === "chapter" ? "Hết chương này" : (tv && tv !== "0" ? tv + " phút" : "Không hẹn");
      el.textContent = "Tốc độ đọc: " + A.rate + "× · Hẹn giờ tắt: " + tTxt;
    }
    function updatePlayerToggle() { const b = $("#pb-toggle"); if (b) b.innerHTML = icon(A.playing ? "pause" : "play", 20); }
    function bindPlayer() {
      const t = $("#pb-toggle");
      if (!t || t.dataset.bound) return;
      t.dataset.bound = "1";
      t.addEventListener("click", () => {
        if (A.mode === "file" && A.audio) { if (A.audio.paused) { A.audio.play(); A.playing = true; } else { A.audio.pause(); A.playing = false; } updatePlayerToggle(); return; }
        if (!("speechSynthesis" in window)) return;
        if (speechSynthesis.speaking && !speechSynthesis.paused) { speechSynthesis.pause(); A.playing = false; }
        else if (speechSynthesis.paused) { speechSynthesis.resume(); A.playing = true; }
        else if (!A.playing && A.chapters) { A.playing = true; speakCurrent(); }
        updatePlayerToggle();
      });
      $("#pb-stop").addEventListener("click", stopAudio);
      $("#pb-prev-ch").addEventListener("click", () => { if (A.mode === "device" && A.chIdx > 0) startDeviceListen(A.chIdx - 1, 0); });
      $("#pb-next-ch").addEventListener("click", () => { if (A.mode === "device") nextChapterListen(); });
      const ps = $("#pb-prev-sent");
      if (ps) ps.addEventListener("click", () => {
        if (A.mode === "file" && A.audio) { A.audio.currentTime = Math.max(0, A.audio.currentTime - 15); return; }
        if (A.mode === "device" && A.chunkIdx > 0) { A.chunkIdx--; A.playing = true; speakCurrent(); updatePlayerToggle(); }
      });
      const ns = $("#pb-next-sent");
      if (ns) ns.addEventListener("click", () => {
        if (A.mode === "file" && A.audio) { A.audio.currentTime = Math.min(A.audio.duration || 0, A.audio.currentTime + 15); return; }
        if (A.mode === "device") { A.chunkIdx++; A.playing = true; speakCurrent(); updatePlayerToggle(); }
      });
      $$(".rate-chip").forEach((c) => c.addEventListener("click", () => {
        A.rate = Number(c.getAttribute("data-rate"));
        $$(".rate-chip").forEach((x) => x.classList.toggle("active", x === c));
        if (A.mode === "device" && A.playing) speakCurrent();
        if (A.audio) A.audio.playbackRate = A.rate;
        updatePlayerMode();
        toast("Tốc độ nghe: " + A.rate + "×");
      }));
      $("#pb-timer").addEventListener("change", (e) => setSleepTimer(e.target.value));
      updatePlayerMode();
    }
    function setSleepTimer(v) {
      clearInterval(A.timerId); A.timerId = null;
      const lbl = $("#pb-timer-left"); if (lbl) lbl.textContent = "";
      A.stopAtChapterEnd = false;
      if (v === "chapter") {
        A.stopAtChapterEnd = true;
        if (lbl) lbl.textContent = "Sẽ dừng khi hết chương này";
        updatePlayerMode();
        toast("Nghe hết chương này là app tự dừng.");
        return;
      }
      const min = Number(v) || 0;
      updatePlayerMode();
      if (!min) return;
      A.timerLeft = min * 60;
      A.timerId = setInterval(() => {
        A.timerLeft--;
        const l = $("#pb-timer-left"); if (l) l.textContent = "Tắt sau " + Math.floor(A.timerLeft / 60) + ":" + String(A.timerLeft % 60).padStart(2, "0");
        if (A.timerLeft <= 0) { clearInterval(A.timerId); stopAudio(); toast("Đã hết giờ hẹn — app dừng nghe. Chúc anh ngủ ngon!"); }
      }, 1000);
      toast("Sẽ tự dừng nghe sau " + min + " phút.");
    }
    function stopFileAudio() { if (A.audio) { try { A.audio.pause(); } catch (e) {} A.audio = null; } if (A.audioUrl) { URL.revokeObjectURL(A.audioUrl); A.audioUrl = ""; } const el = $("#pb-audio"); if (el) { el.classList.add("hidden"); el.removeAttribute("src"); } }
    function stopAudio() {
      A.playing = false;
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      stopFileAudio(); clearInterval(A.timerId); A.timerId = null;

    async function playEpisodeFile(epId) {
      const ep = DB.episodes.find((e) => e.id === epId); if (!ep) return;
      const book = findBook(ep.bookId); if (!book) return;
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      A.mode = "file"; A.playing = true;
      showPlayer(book, "Tập podcast: " + ep.chapterTitle);
      const audioEl = $("#pb-audio");
      try {
        let blob = ep.localKey ? await idb.get("files", ep.localKey) : null;
        if (!blob && ep.driveFileId) blob = await driveDownload(ep.driveFileId);
        if (!blob) throw new Error("Không tải được file audio");
        stopFileAudio();
        A.audioUrl = URL.createObjectURL(blob);
        if (audioEl) { audioEl.src = A.audioUrl; audioEl.classList.remove("hidden"); audioEl.playbackRate = A.rate; A.audio = audioEl; audioEl.play(); }
      } catch (e) { toast("Chưa phát được file podcast: " + ((e && e.message) || e)); }

    async function makePodcastEpisode(chIdx) {
      const book = findBook(A.bookId); if (!book || !A.chapters) return;
      const keys = loadKeys();
      if (!keys.openai) { toast("Anh dán khóa OpenAI trong mục Cài đặt trước đã nhé."); return; }
      const ch = A.chapters[chIdx];
      A.generating = book.id + ":" + chIdx; renderChapterList(book, A.chapters, A.chIdx);
      try {
        const text = ch.text;
        const pieces = splitChunks(text, 3500); // mỗi đoạn ≤3.500 ký tự (giới hạn OpenAI TTS), gọi tuần tự rồi ghép MP3
        const blobs = [];
        for (const piece of pieces) {
          const res = await fetch("https://api.openai.com/v1/audio/speech", {
            method: "POST", headers: { Authorization: "Bearer " + keys.openai, "Content-Type": "application/json" },
            body: JSON.stringify({ model: "tts-1", voice: "alloy", input: piece, response_format: "mp3" }),
          });
          if (!res.ok) throw new Error("OpenAI TTS lỗi " + res.status);
          blobs.push(await res.blob());
        }
        const mp3 = new Blob(blobs, { type: "audio/mpeg" });
        const ep = { id: uid(), bookId: book.id, chapterIdx: chIdx, chapterTitle: ch.title, createdAt: Date.now(), size: mp3.size, driveFileId: "", localKey: "" };
        if (S.user) {
          if (!hasScope(DRIVE_SCOPE)) { reassureScope(); try { await requestScopes(DRIVE_SCOPE, true); } catch (e) {} }
          try { ep.driveFileId = await driveUpload(book.title + " - " + ch.title + ".mp3", mp3, "audio/mpeg"); idb.put("files", "drive:" + ep.driveFileId, mp3); }
          catch (e) { ep.localKey = "ep:" + ep.id; await idb.put("files", ep.localKey, mp3); }
        } else { ep.localKey = "ep:" + ep.id; await idb.put("files", ep.localKey, mp3); }
        DB.episodes = DB.episodes.filter((e) => !(e.bookId === book.id && e.chapterIdx === chIdx));
        DB.episodes.push(ep); persist("episodes");
        toast("Đã tạo file podcast cho “" + ch.title + "” (" + pieces.length + " đoạn ghép thành 1 file).");
      } catch (e) { toast("Tạo file podcast chưa thành công: " + ((e && e.message) || e), 5000); }
      A.generating = ""; render();
    }
    function readFromListenPosition() {
      const book = findBook(S.listenBookId); if (!book) return;

    /* ================= Tìm sách + AI ================= */
    /* Khóa AI đi theo TÀI KHOẢN: nguồn chính là DB.settings.keys (đồng bộ RTDB users/{uid}/settings/keys khi đăng nhập,
       tách riêng theo từng tài khoản cả trên máy); localStorage chỉ là bản đệm + tương thích bản cũ. */
    function loadKeys() {
      const acc = (DB.settings && DB.settings.keys && DB.settings.keys.ai) || {};
      let loc = {}; try { loc = JSON.parse(localStorage.getItem("hp-api-keys") || "{}"); } catch (e) {}
      return { claude: acc.claude || loc.claude || "", gemini: acc.gemini || loc.gemini || "", openai: acc.openai || loc.openai || "", groq: acc.groq || loc.groq || "" };
    }
    function saveKeys(k) {
      try { localStorage.setItem("hp-api-keys", JSON.stringify(k)); } catch (e) {}
      if (!DB.settings) return;
      DB.settings.keys = DB.settings.keys || {};
      DB.settings.keys.ai = { claude: k.claude || "", gemini: k.gemini || "", openai: k.openai || "", groq: k.groq || "" };

    }
    /* Đẩy khóa đã dán ở bản cũ (localStorage) lên tài khoản khi đăng nhập — chỉ điền vào chỗ tài khoản còn trống. */
    function migrateLegacyKeys() {
      try {
        if (!DB.settings) return;
        let changed = false;
        DB.settings.keys = DB.settings.keys || {};
        const locAi = JSON.parse(localStorage.getItem("hp-api-keys") || "{}");
        const accAi = DB.settings.keys.ai || {};
        ["claude", "gemini", "openai", "groq"].forEach((f) => { if (!accAi[f] && locAi[f]) { accAi[f] = locAi[f]; changed = true; } });
        if (Object.keys(accAi).length) DB.settings.keys.ai = accAi;
        const locTts = JSON.parse(localStorage.getItem("hp-tts-keys-v1") || "{}");
        const accTts = DB.settings.keys.tts || {};
        ["fpt", "gcloud"].forEach((f) => { if (!accTts[f] && locTts[f]) { accTts[f] = locTts[f]; changed = true; } });
        if (Object.keys(accTts).length) DB.settings.keys.tts = Object.assign({}, locTts, accTts);
        if (changed) persist("settings");
      } catch (e) {}
    }

    function uiTheme() { try { return localStorage.getItem("hp-ui-theme") === "dark" ? "dark" : "light"; } catch (e) { return "light"; } }
    function applyUiTheme(t) {

    }
    const PROVIDERS = {
      claude: { name: "Claude", why: "tóm tắt & phân tích nội dung sách", web: (q) => "https://claude.ai/new?q=" + encodeURIComponent(q) },
      gemini: { name: "Gemini", why: "tìm sách mới & gợi ý", web: () => "https://gemini.google.com/app" },
      openai: { name: "ChatGPT", why: "hỏi đáp nhanh & tổng hợp", web: (q) => "https://chatgpt.com/?q=" + encodeURIComponent(q) },
      groq: { name: "Groq", why: "miễn phí, trả lời rất nhanh", web: () => "https://console.groq.com" },
      shared: { name: "AI dùng chung", why: "dùng chung của ứng dụng, không cần khóa riêng", web: () => "" },
      muse: { name: "Muse", why: "hỏi đáp & gợi ý sách trên web Muse (chỉ mở web)", web: () => "https://muse.ai", webOnly: true },
      dola: { name: "Dola", why: "hỏi đáp nhanh trên web Dola (chỉ mở web)", web: () => "https://www.dola.com", webOnly: true },
    };
    function routeAI(q) {
      const s = " " + String(q || "").toLowerCase() + " ";
      if (/\bmuse\b/.test(s)) return "muse";

    /* ---- Streaming SSE cho cả 3 hãng, gọi thẳng từ trình duyệt bằng khóa của người dùng ---- */
    async function readSSE(res, onEvent) {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
          if (line.indexOf("data:") === 0) onEvent(line.slice(5).trim());
        }
      }
    }
    async function streamProvider(p, key, system, msgs, tier, onDelta, signal) {

          method: "POST", signal: signal,
          headers: { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true", "content-type": "application/json" },
          body: JSON.stringify({ model: model, max_tokens: 2200, stream: true, system: system || undefined, messages: msgs.map((m) => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.content })) }),

          method: "POST", signal: signal, headers: { "content-type": "application/json", "x-goog-api-key": key },
          body: JSON.stringify({
            system_instruction: system ? { parts: [{ text: system }] } : undefined,
            contents: msgs.map((m) => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })),
          }),
        });
        if (!res.ok || !res.body) throw new Error("Gemini lỗi " + res.status);
        await readSSE(res, (data) => { try { const j = JSON.parse(data); const parts = (((j.candidates || [])[0] || {}).content || {}).parts || []; parts.forEach((pt) => emit(pt.text || "")); } catch (e) {} });
      } else if (p === "openai" || p === "groq") {
        const res = await fetch(p === "groq" ? "https://api.groq.com/openai/v1/chat/completions" : "https://api.openai.com/v1/chat/completions", {
          method: "POST", signal: signal, headers: { Authorization: "Bearer " + key, "content-type": "application/json" },
          body: JSON.stringify({ model: model, stream: true, max_tokens: 2200, messages: (system ? [{ role: "system", content: system }] : []).concat(msgs) }),
        });

        await readSSE(res, (data) => { if (data === "[DONE]") return; try { const j = JSON.parse(data); const d = (((j.choices || [])[0] || {}).delta || {}).content; if (d) emit(d); } catch (e) {} });
      }

    /* Dịch mã lỗi của AI dùng chung sang tiếng Việt dễ hiểu — không lộ chi tiết kỹ thuật cho người dùng phổ thông. */
    function relayErrorMessage(code, status) {
      if (code === "not_allowed") return "Tài khoản của bạn chưa được chủ ứng dụng cấp phép dùng AI dùng chung.";

    async function streamRelay(system, msgs, tier, onDelta, signal) {
      const token = await relayToken();
      if (!token) { const e = new Error("nokey"); e.noKey = true; throw e; }
      const messages = (system ? [{ role: "system", content: system }] : []).concat(msgs || []);
      const res = await fetch(RELAY_BASE + "/api/chat", {
        method: "POST", signal: signal,
        headers: { Authorization: "Bearer " + token, "content-type": "application/json" },
        body: JSON.stringify({ messages: messages, mode: tier === "strong" ? "deep" : "light" }),
      });
      if (!res.ok || !res.body) {
        let code = "";
        try { const j = await res.json(); if (j && j.error) code = String(j.error); } catch (e) {}
        const err = new Error(relayErrorMessage(code, res.status));

      const AUTO_ORDER = ["gemini", "groq", "claude", "openai"];

      if (!order.length) {
        /* Không có khóa riêng nào: đã đăng nhập Google -> dùng AI dùng chung (streaming như bình thường).
           Chưa đăng nhập -> giữ hành vi cũ (thẻ gợi ý dán khóa). */
        if (relaySignedIn()) {
          let got = "";
          try {
            const text = await streamRelay(opts.system, opts.messages, opts.tier || "light", (partial) => { got = partial; if (opts.onDelta) opts.onDelta(partial, "shared"); }, opts.signal);
            if (text) return { text: text, by: "shared", switched: false, from: null };
            const err = new Error(relayErrorMessage("", 0)); err.relay = true; throw err;
          } catch (e) {
            if (e && e.name === "AbortError") { if (got) return { text: got, by: "shared", aborted: true }; throw e; }
            if (got) return { text: got, by: "shared" };

          }
        }

      let lastErr = null;
      for (let i = 0; i < order.length; i++) {

          const text = await streamProvider(p, keys[p], opts.system, opts.messages, opts.tier || "light", (partial) => { got = partial; if (opts.onDelta) opts.onDelta(partial, p); }, opts.signal);
          if (text) return { text: text, by: p, switched: i > 0, from: order[0] };

        } catch (e) {
          if (e && e.name === "AbortError") { if (got) return { text: got, by: p, aborted: true, switched: i > 0, from: order[0] }; throw e; }
          lastErr = e;
          if (got) return { text: got, by: p, switched: i > 0, from: order[0] };
          if (i + 1 < order.length && opts.onSwitch) opts.onSwitch(PROVIDERS[p].name, PROVIDERS[order[i + 1]].name);
        }
      }
      throw lastErr || new Error("AI chưa trả lời được lúc này");

    function mdLite(text) {
      const lines = String(text || "").split("\n");

      const closeList = () => { if (inList) { h += "</ul>"; inList = false; } };
      lines.forEach((ln) => {
        const t = ln.trim();
        const bolded = esc(t).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        if (/^[•\-\*]\s+/.test(t)) {
          if (!inList) { h += '<ul class="bl-list">'; inList = true; }
          h += "<li>" + bolded.replace(/^[•\-\*]\s+/, "") + "</li>";
        } else { closeList(); if (t) h += '<div class="bl">' + bolded + "</div>"; }
      });
      closeList();
      return h || '<div class="bl"></div>';
    }

    /* ---- Nhập bằng giọng nói (Web Speech API, vi-VN): hiện chữ tạm trong ô, có kết quả cuối thì tự gửi ---- */

      const q = $("#ai-q"); const note = $("#ai-mic-note"); const mic = $("#ai-mic");
      try {
        voiceRec = new SR();
        voiceRec.lang = "vi-VN"; voiceRec.interimResults = true; voiceRec.maxAlternatives = 1;
        let finalText = "";
        voiceRec.onstart = () => { voiceOn = true; if (mic) { mic.innerHTML = '<span aria-hidden="true" style="width:13px;height:13px;border-radius:50%;background:currentColor;display:block"></span>'; mic.style.background = "var(--danger)"; mic.style.color = "#fff"; mic.setAttribute("aria-label", "Đang nghe — bấm để dừng"); } if (note) note.textContent = "Đang nghe… anh nói xong là em gửi luôn nhé (bấm nút micro đỏ để dừng)."; };
        voiceRec.onresult = (ev) => {
          let interim = "";
          for (let i = ev.resultIndex; i < ev.results.length; i++) {
            if (ev.results[i].isFinal) finalText += ev.results[i][0].transcript;
            else interim += ev.results[i][0].transcript;
          }
          if (q) { q.value = (finalText + interim).trim(); S.aiQuestion = q.value; }
        };
        voiceRec.onerror = () => { voiceOn = false; if (note) note.textContent = "Chưa nghe rõ — anh bấm nút micro nói lại giúp em, hoặc gõ chữ nhé."; if (mic) { mic.innerHTML = icon("mic", 22); mic.style.background = ""; mic.style.color = ""; mic.setAttribute("aria-label", "Nhập bằng giọng nói"); } };
        voiceRec.onend = () => {

    /* ================= Agent: điều phối việc trong khung chat ================= */
    function pushUserMsg(text) { const m = { id: uid(), role: "user", text: text, at: Date.now() }; aiThreadPush(m); return m; }

    async function askAI(overrideText) {
      const q = (typeof overrideText === "string" ? overrideText : (($("#ai-q") && $("#ai-q").value) || S.aiQuestion || "")).trim();
      if (!q) { toast("Anh nhập câu hỏi hoặc bấm nút micro nói trước đã nhé."); return; }

      S.aiQuestion = "";

        if (cmd.book) { cmdListen(cmd.book); return; }

        render(); return;
      }
      if (cmd && cmd.type === "open" && cmd.book) { toast("Đang mở “" + cmd.book.title + "”…"); openBook(cmd.book.id); return; }
      /* Lệnh dịch sách: “dịch cuốn này sang tiếng Anh”, “dịch chương 3 sang tiếng Trung”… */
      const trCmd = detectTranslateCommand(q);
      if (trCmd) {
        const book = trCmd.book;
        if (!book) { pushAiMsg({ text: "Anh muốn dịch cuốn nào ạ? Anh chọn một cuốn trong ô “Sách” phía trên, hoặc nhắc tên cuốn trong câu lệnh giúp em nhé." }); render(); return; }
        S.pendingTranslate = { bookId: book.id, lang: trCmd.lang, chapterIdx: trCmd.chapterIdx };
        pushAiMsg({ text: "Em mở “" + book.title + "” và bật bản dịch sang " + transLangName(trCmd.lang) + " ngay đây ạ 🌐" });
        render();

      /* Tin tức */
      if (isNewsIntent(q)) { newsAgent(q); return; }
      /* Sắp xếp thư viện thông minh: phân loại thể loại / dọn trùng / lệnh kệ / tác giả */
      if (/tác giả nào.*(nhiều|nhất)|ai viết nhiều sách nhất|tác giả.*nhiều sách nhất/i.test(q)) { authorTopAgent(); return; }

      if (/sách của\s+.+/i.test(q) && !/(nói về|hay không|tóm tắt|nội dung|review|đánh giá)/i.test(q)) { authorBooksAgent(q); return; }
      if (shelfCommand(q)) return;
      if (/(sắp xếp|phân loại|xếp lại|dọn dẹp)\s*(lại\s*)?(thư viện|sách|kệ)|phân loại.*thể loại/i.test(q)) { organizeAgent(); return; }
      if (/trùng/i.test(q) && /(dọn|tìm|kiểm tra|liệt kê|sách|cuốn|tên)/i.test(q)) { dedupAgent(); return; }
      /* “Tập trước có gì?” cho cuốn đang chọn */
      if (/tập trước|tap truoc|nhắc lại phần đã đọc|nhac lai phan da doc/i.test(q)) {

      }
      /* “Tìm hiểu về…” -> agent bách khoa (không phải lệnh tìm sách) */
      if (/^tìm hiểu/i.test(q) || /^tim hieu/i.test(stripVi(q))) { chatLLM(q); return; }
      /* Gợi ý từ tủ sách / sắp đọc xong (ưu tiên trước tìm sách khi có từ gợi tâm trạng) */
      if (isSuggestIntent(q)) { suggestAgent(q); return; }
      /* Tìm sách diện rộng */

      /* Tóm tắt / hỏi về 1 cuốn cụ thể (có kiểm tra bộ nhớ đệm trước) */
      if (cmd && cmd.type === "summarize" && cmd.book) { S.aiBookId = cmd.book.id; }

    function isNewsIntent(q) { return /tin (mới|tức|nóng)|có tin gì|tin hôm nay|thời sự|chủ đề nóng|đọc báo|tin về|tin tức về/i.test(q || ""); }

        if (res.aborted) patch.text += "\n\n(Đã dừng giữa chừng theo yêu cầu của anh.)";

      Object.values(DB.playBooks || {}).forEach((pb) => {
        const hay = stripVi(pb.title + " " + (pb.author || "") + " " + (pb.description || ""));
        let s = 0; words.forEach((w) => { if (hay.indexOf(w) >= 0) s += w.length; });

      bodyEl.appendChild(nrEl("p", null, "Đang tải nội dung bài…"));
      const sumBox = nrEl("div"); sumBox.id = "nr-sum-box";
      wrap.appendChild(bar);
      wrap.appendChild(nrEl("h1", null, n.title));
      wrap.appendChild(nrEl("div", "nr-meta", n.source + (n.time ? " · " + n.time : "")));
      wrap.appendChild(bodyEl); wrap.appendChild(sumBox);
      root.appendChild(wrap);
      document.body.appendChild(root);
      document.body.style.overflow = "hidden";
      let fullText = n.desc || "";
      bClose.addEventListener("click", () => { stopUnifiedSpeech(); root.remove(); document.body.style.overflow = ""; });
      bListen.addEventListener("click", () => speakTextUnified(fullText || n.title));
      bSum.addEventListener("click", async () => {
        sumBox.textContent = "";
        if (!aiHasAnyKey()) {
          const card = nrEl("div", "card"); card.style.marginTop = "14px";
          card.appendChild(nrEl("h3", null, "🔑 Cần “Chìa khóa AI” để tóm tắt"));
          card.appendChild(nrEl("p", null, "Anh dán khóa Gemini miễn phí trong mục Cài đặt → thẻ Chìa khóa AI là tóm tắt được ngay ạ."));
          const go = nrEl("button", "btn small primary", "Tới mục Cài đặt");
          go.addEventListener("click", () => { root.remove(); document.body.style.overflow = ""; goSettings(); });
          card.appendChild(go);
          sumBox.appendChild(card);
          return;
        }
        const st = nrEl("p", null, "Đang nhờ Annie tóm tắt…"); st.style.color = "#8a7550"; sumBox.appendChild(st);
        try {
          const res = await aiAskLLM({ question: "tóm tắt tin", tier: "light", system: "Bạn tóm tắt tin tức tiếng Việt thành đúng 3 ý chính, mỗi ý một dòng bắt đầu bằng “• ”, ngắn gọn, trung lập.", messages: [{ role: "user", content: "Tóm tắt bài báo sau thành 3 ý:\n" + (fullText || n.title).slice(0, 5000) }] });
          sumBox.textContent = "";
          const box2 = nrEl("div"); box2.style.cssText = "background:#fff8e7;border:1px solid #e4d6ba;border-radius:14px;padding:13px 15px;margin-top:14px";
          box2.appendChild(nrEl("b", null, "🤖 Tóm tắt AI (" + PROVIDERS[res.by].name + "):"));
          mdLiteDOM(box2, res.text);
          sumBox.appendChild(box2);
        } catch (e) { sumBox.textContent = ""; const p = nrEl("p", null, "Chưa tóm tắt được lúc này — anh thử lại sau nhé."); p.style.color = "#8a7550"; sumBox.appendChild(p); }
      });
      try {
        const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(n.link));
        if (!r.ok) throw new Error("fetch fail");
        const html = await r.text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        ["script", "style", "noscript", "iframe", "form", "nav", "header", "footer", "aside"].forEach((t) => $$(t, doc).forEach((el) => el.remove()));
        const art = doc.querySelector("article") || doc.body;
        let best = null, bestLen = 0;
        $$("div, section, article", doc).forEach((el) => { const t = (el.textContent || "").trim().length; if (t > bestLen && el.querySelectorAll("p").length >= 3) { best = el; bestLen = t; } });
        const src = best || art;
        const nodes = [];
        $$("p, h2, h3, img", src).forEach((el) => {
          if (el.tagName === "IMG") { const s = el.getAttribute("src"); if (s && /^https:\/\//i.test(s)) nodes.push({ img: s }); }
          else { const t = (el.textContent || "").replace(/\s+/g, " ").trim(); if (t.length > 25) nodes.push({ text: t }); }
        });
        if (nodes.length < 2) throw new Error("ít nội dung");
        bodyEl.textContent = "";
        nodes.slice(0, 60).forEach((nd) => {
          if (nd.img) { const im = document.createElement("img"); im.src = nd.img; im.alt = ""; im.loading = "lazy"; im.referrerPolicy = "no-referrer"; bodyEl.appendChild(im); }
          else bodyEl.appendChild(nrEl("p", null, nd.text));
        });
        fullText = nodes.map((nd) => nd.text || "").join(" ").slice(0, 9000);
      } catch (e) {
        bodyEl.textContent = "";
        bodyEl.appendChild(nrEl("p", null, n.desc || ""));
        bodyEl.appendChild(nrEl("p", null, "Chưa lấy được toàn văn trong app (trang báo chặn đọc ngoài) — anh bấm “Mở link gốc” ở trên để đọc bản đầy đủ nhé."));
        fullText = n.desc || n.title;
      }
    }

    async function getSuggestions() {
      const box = $("#suggest-box"); if (box) box.innerHTML = '<div style="display:flex;gap:10px;align-items:center;color:var(--dim);font-size:13.5px"><div class="spinner" style="width:22px;height:22px"></div>Đang nhờ Annie gợi ý…</div>';
      const titles = DB.books.slice(0, 12).map((b) => b.title).join("; ");
      const keys = loadKeys();
      let queries = [];
      const prompt = "Dựa trên thư viện sách hiện có (" + (titles || "chưa có sách nào") + "), hãy gợi ý 6 cuốn sách hay nên đọc tiếp. Chỉ trả về danh sách mỗi dòng một tên sách kèm tác giả, không giải thích.";
      const order = ["gemini", "groq", "claude", "openai"];
      for (const p of order) {
        if (!keys[p]) continue;
        try {
          const text = await AI_CALLERS[p](keys[p], prompt);
          queries = text.split("\n").map((l) => l.replace(/^[\d\-\.\)\s•]+/, "").trim()).filter((l) => l.length > 2).slice(0, 6);
          if (queries.length) break;
        } catch (e) {}
      }
      if (!queries.length) queries = [titles ? (DB.books[0].author || DB.books[0].title) : "sách hay nên đọc", "sách phát triển bản thân hay", "sách kinh doanh hay"];
      const results = [];
      for (const qq of queries.slice(0, 6)) {
        try { const r = await searchGoogleBooks(qq, 1); if (r[0] && !results.find((x) => x.googleId === r[0].googleId)) results.push(r[0]); } catch (e) {}
      }
      S.suggestions = results;
      const b2 = $("#suggest-box"); if (b2) b2.innerHTML = suggestionsHTML(results);
    }

    function exportNotes(bookId) {
      const b = findBook(bookId); if (!b) return;
      const lines = ["SỔ TAY TRÍCH DẪN — " + b.title, "Tác giả: " + (b.author || ""), "Xuất ngày: " + new Date().toLocaleString("vi-VN"), ""];
      (DB.highlights[bookId] || []).forEach((x) => lines.push("[Gạch chân] “" + x.text + "”"));
      (DB.notes[bookId] || []).forEach((x) => { if (x.quote) lines.push("[Trích] “" + x.quote + "”"); lines.push("[Ghi chú] " + x.text); });
      (DB.bookmarks[bookId] || []).forEach((x) => lines.push("[Đánh dấu] " + x.label));
      const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "so-tay-" + b.title.replace(/[^\p{L}\p{N}]+/gu, "-").slice(0, 60) + ".txt";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }

    /* ---- Tiền xử lý văn bản đọc: số, ngày tháng, viết tắt tiếng Việt ---- */
    function viNumWords(n) {
      n = Math.floor(Math.abs(n));
      const U = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
      if (n < 10) return U[n];
      const two = (x, full) => {
        const ch = Math.floor(x / 10), dv = x % 10;
        let s = (ch === 1 ? "mười" : U[ch] + " mươi");
        if (dv === 0) return s;
        if (dv === 1) return s + (ch === 1 ? " một" : " mốt");
        if (dv === 5) return s + " lăm";
        return s + " " + U[dv];
      };
      const three = (x, full) => {
        const tr = Math.floor(x / 100), rest = x % 100;
        let s = "";
        if (tr > 0) s = U[tr] + " trăm";
        else if (full) s = "không trăm";
        if (rest === 0) return s;
        if (rest < 10) return s + " lẻ " + U[rest];
        return (s ? s + " " : "") + two(rest, full);
      };
      if (n < 100) return two(n, true);
      if (n < 1000) return three(n, true);
      if (n < 1000000) { const ng = Math.floor(n / 1000), rest = n % 1000; return three(ng, true) + " nghìn" + (rest ? " " + three(rest, true) : ""); }
      if (n < 1000000000) { const tr = Math.floor(n / 1000000), rest = n % 1000000; return three(tr, true) + " triệu" + (rest ? " " + viNumWords(rest) : ""); }
      const ty = Math.floor(n / 1000000000), rest = n % 1000000000;
      return viNumWords(ty) + " tỷ" + (rest ? " " + viNumWords(rest) : "");
    }
    function viSpeakText(text) {
      let t = String(text || "");
      const ABBR = [["TP.HCM", "thành phố Hồ Chí Minh"], ["TP.", "thành phố"], ["PGS.", "phó giáo sư"], ["GS.", "giáo sư"], ["TS.", "tiến sĩ"], ["ThS.", "thạc sĩ"], ["BS.", "bác sĩ"], ["NXB", "nhà xuất bản"], ["tr.", "trang"], ["ĐH", "đại học"], ["Q.", "quận"], ["P.", "phường"], ["VN", "Việt Nam"]];
      ABBR.forEach(([a, b]) => { t = t.split(a).join(" " + b + " "); });
      t = t.replace(/(\d{1,2})\/(\d{1,2})\/(\d{4})/g, (m, d, mo, y) => "ngày " + viNumWords(Number(d)) + " tháng " + viNumWords(Number(mo)) + " năm " + viNumWords(Number(y)));
      t = t.replace(/(\d{1,2})\/(\d{1,2})(?![\/\d])/g, (m, d, mo) => "ngày " + viNumWords(Number(d)) + " tháng " + viNumWords(Number(mo)));

      t = t.replace(/(\d+),(\d+)(?!\d)/g, (m, a, b) => viNumWords(Number(a)) + " phẩy " + String(b).split("").map((ch) => viNumWords(Number(ch))).join(" "));
      t = t.replace(/\d{1,3}(?:\.\d{3})+/g, (m) => viNumWords(Number(m.replace(/\./g, ""))));
      t = t.replace(/(?<![\d.,\/])\d{1,7}(?![\d.,\/])/g, (m) => viNumWords(Number(m)));
      return t.replace(/\s+/g, " ").trim();

        if (!d || !d.async) throw new Error("FPT.AI chưa trả về file giọng — kiểm tra lại khóa giúp em.");
        for (let i = 0; i < 14; i++) {

        const voice = slot === 2 ? cfg.gVoice2 : cfg.gVoice;

        });

    function makeQuoteCard(bookId, hlId) {
      const b = findBook(bookId); if (!b) return;

      const cv = document.createElement("canvas"); cv.width = 1080; cv.height = 1350;
      const g = cv.getContext("2d");
      const grad = g.createLinearGradient(0, 0, 0, 1350);
      grad.addColorStop(0, "#f8eed3"); grad.addColorStop(1, "#eedcae");
      g.fillStyle = grad; g.fillRect(0, 0, 1080, 1350);
      g.strokeStyle = "#b96a00"; g.lineWidth = 3; g.strokeRect(46, 46, 988, 1258);
      g.strokeStyle = "rgba(185,106,0,.45)"; g.lineWidth = 1.5; g.strokeRect(62, 62, 956, 1226);
      g.fillStyle = "#7c4a03"; g.textAlign = "center";
      g.font = "800 64px Georgia, 'Times New Roman', serif";
      g.fillText("NX", 540, 190);
      g.font = "600 25px Georgia, serif"; g.fillStyle = "#a07c3a";
      g.fillText("N E X U S   A I   B O O K S   L I B R A R Y", 540, 240);
      g.font = "italic 300 120px Georgia, serif"; g.fillStyle = "rgba(185,106,0,.35)";
      g.fillText("“", 540, 400);
      const words = String(hl.text || "").split(/\s+/);
      const lines = []; let cur = "";
      g.font = "italic 47px Georgia, 'Times New Roman', serif";
      words.forEach((w) => { const test = cur ? cur + " " + w : w; if (g.measureText(test).width > 830 && cur) { lines.push(cur); cur = w; } else cur = test; });
      if (cur) lines.push(cur);
      g.fillStyle = "#3a2a12";
      const startY = 520 - Math.min(120, (lines.length - 3) * 30);
      lines.slice(0, 12).forEach((ln, i) => g.fillText(ln, 540, startY + i * 68));
      const baseY = 1130;
      g.font = "700 36px Georgia, serif"; g.fillStyle = "#5d3c10";

      cv.toBlob((blob) => {
        if (!blob) { toast("Chưa tạo được ảnh thẻ lúc này."); return; }
        const url = URL.createObjectURL(blob);
        openModal('<h3>🎴 Thẻ trích dẫn</h3><img src="' + url + '" alt="Thẻ trích dẫn" style="width:100%;border-radius:14px;box-shadow:var(--shadow)" /><div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap"><a class="btn primary" href="' + url + '" download="the-trich-dan-nx.png">⬇ Tải ảnh về máy</a><button class="btn" data-close-modal="1">Đóng</button></div>');

    /* ================= Tải sách miễn phí về thư viện (qua đúng đường ống thêm sách) ================= */
    async function dlAddToLibrary(url, title, btn) {
      if (btn) { btn.disabled = true; btn.textContent = "⏳ Đang tải…"; }
      try {
        let blob = null;
        try { const r = await fetch(url); if (r.ok) blob = await r.blob(); } catch (e) {}
        if (!blob) { const r2 = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(url)); if (r2.ok) blob = await r2.blob(); }
        if (!blob) throw new Error("Không tải được file");
        if (blob.size > MAX_FILE_BYTES) throw new Error("File nặng hơn 25 MB");
        const isEpub = /\.epub/i.test(url) || (blob.type || "").indexOf("epub") >= 0;
        const ext = isEpub ? "epub" : "txt";
        const safe = String(title || "Sach mien phi").replace(/[\\/:*?"<>|]/g, "").slice(0, 80);
        const file = new File([blob], safe + "." + ext, { type: isEpub ? "application/epub+zip" : "text/plain" });
        await addBookFiles([file]);
        if (btn) btn.textContent = "✓ Đã thêm vào thư viện";
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = "📥 Tải & thêm vào thư viện"; }

      }
    }

    function findCollectionByName(name) {

    function shelfCommand(q) {
      let m = q.match(/đổi tên kệ\s+(.+?)\s+thành\s+(.+)/i);

        else pushAiMsg({ text: "Em chưa tìm thấy kệ “" + m[1].trim() + "” — anh kiểm tra lại tên kệ giúp em nhé." });
        S.aiBusy = false; render(); scrollChatBottom(); return true;
      }
      m = q.match(/tạo kệ\s+(?:của\s+)?tác giả\s+(.+)/i);
      if (m) {
        const g = findAuthorGroup(cleanShelfName(m[1]));
        const colName = "Tác giả " + (g ? g.name : m[1].trim());
        let col = findCollectionByName(colName);
        if (!col) { col = { id: uid(), name: colName }; DB.collections.push(col); persist("collections"); }
        let added = 0;
        if (g) g.books.forEach((b) => { b.collections = b.collections || []; if (!b.collections.includes(col.id)) { b.collections.push(col.id); added++; } });
        if (added) persist("books");

        let added = 0;

    /* ================= THƯ VIỆN THEO TÁC GIẢ ================= */
    function authorNamesOf(raw) { return String(raw || "").split(/,|;|&|\s+và\s+|\s+and\s+/i).map((s) => s.trim()).filter(Boolean); }
    function authorDisplayName(variants) {
      let best = "", bestScore = -1;
      variants.forEach((n, name) => { const score = n * 2 + (/[àáâãèéêìíòóôõùúýăđơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/i.test(name) ? 5 : 0) + name.length / 100; if (score > bestScore) { bestScore = score; best = name; } });
      return best;
    }
    function authorGroups() {
      const merges = DB.authorMerges || {};
      const groups = new Map();
      const pushTo = (key, nm, entry) => {
        if (!groups.has(key)) groups.set(key, { key, names: new Map(), books: [], playBooks: [] });
        const g = groups.get(key);
        if (nm) g.names.set(nm, (g.names.get(nm) || 0) + 1);
        if (entry.libId) { if (!g.books.find((b) => b.id === entry.libId)) g.books.push(entry.ref); }
        else if (entry.googleId) { if (!g.playBooks.find((p) => p.googleId === entry.googleId)) g.playBooks.push(entry.ref); }
      };
      const addEntry = (rawAuthor, entry) => {
        const names = authorNamesOf(rawAuthor);
        if (!names.length) { pushTo("__unknown", "", entry); return; }
        names.forEach((nm) => { let key = normTitle(nm); if (merges[key]) key = merges[key]; pushTo(key, nm, entry); });
      };
      DB.books.forEach((b) => addEntry(b.author, { libId: b.id, ref: b }));
      Object.values(DB.playBooks || {}).forEach((pb) => { if (pb.localId) return; addEntry(pb.author, { googleId: pb.googleId, ref: pb }); });
      const pins = DB.authorPins || [];
      const arr = Array.from(groups.values()).map((g) => ({ key: g.key, name: g.key === "__unknown" ? "Chưa rõ tác giả" : authorDisplayName(g.names), n: g.books.length + g.playBooks.length, books: g.books, playBooks: g.playBooks, pinned: pins.includes(g.key) }));
      arr.sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || (a.key === "__unknown" ? 1 : b.key === "__unknown" ? -1 : b.n - a.n));
      return arr;
    }
    function findAuthorGroup(name) {
      const k = normTitle(name);
      const gs = authorGroups();
      return gs.find((g) => g.key === k) || gs.find((g) => normTitle(g.name) === k) || (k.length >= 4 ? gs.find((g) => normTitle(g.name).includes(k) || k.includes(normTitle(g.name))) : null);
    }

    async function aiAuthorMergePass(upd) {
      if (!aiHasAnyKey()) return 0;
      const keys = new Set();
      const collect = (raw) => authorNamesOf(raw).forEach((nm) => { const k = normTitle(nm); if (k) keys.add(k); });
      DB.books.forEach((b) => collect(b.author));
      Object.values(DB.playBooks || {}).forEach((pb) => collect(pb.author));
      const arr = Array.from(keys);
      const pairs = [];
      for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++) {
        const a = arr[i], b = arr[j]; const ta = a.split(" "), tb = b.split(" ");
        const subset = ta.every((t) => tb.includes(t)) || tb.every((t) => ta.includes(t));
        const sameEnds = ta[0] === tb[0] && ta[ta.length - 1] === tb[tb.length - 1];
        if ((subset && Math.abs(ta.length - tb.length) <= 1) || (sameEnds && Math.abs(ta.length - tb.length) === 1)) pairs.push([a, b]);
      }
      const fresh = pairs.filter((p) => aiCacheGet("authmerge:" + p[0] + "|" + p[1]) == null).slice(0, 12);
      if (!fresh.length) return 0;
      if (upd) upd("✍️ Đang nhờ AI kiểm tra " + fresh.length + " cặp tên tác giả gần giống nhau…");
      try {
        const res = await aiAskLLM({ question: "gộp tác giả", tier: "light", system: "Bạn kiểm tra tên tác giả có phải cùng một người không.", messages: [{ role: "user", content: "Mỗi dòng gồm 2 cách viết tên tác giả (đã bỏ dấu). Trả lời mỗi dòng đúng dạng: số|yes nếu là CÙNG một người, số|no nếu là hai người khác nhau.\n" + fresh.map((p, i) => (i + 1) + ". " + p[0] + " <> " + p[1]).join("\n") }] });
        let merged = 0;
        DB.authorMerges = DB.authorMerges || {};
        res.text.split("\n").forEach((line) => { const m = line.match(/(\d+)\s*[|.]\s*(yes|no)/i); if (!m) return; const p = fresh[Number(m[1]) - 1]; if (!p) return; const same = /yes/i.test(m[2]); aiCacheSet("authmerge:" + p[0] + "|" + p[1], same ? "yes" : "no", { same }); if (same) { const canon = p[0].length >= p[1].length ? p[0] : p[1]; const other = canon === p[0] ? p[1] : p[0]; if (!DB.authorMerges[other]) { DB.authorMerges[other] = canon; merged++; } } });
        if (merged) persist("authorMerges");
        return merged;
      } catch (e) { return 0; }
    }

    function selectedBookLabel() {

    function aiBookEntries() {
      const localOf = listenPlayLocalOf();
      const entries = DB.books.map((b) => ({ kind: "lib", id: b.id, title: b.title, author: b.author || "", tag: "Đã có file trong app" }));
      Object.values(DB.playBooks || {}).forEach((pb) => { if (!localOf(pb)) entries.push({ kind: "play", id: pb.googleId, title: pb.title, author: pb.author || "", tag: "Play Sách · chưa có file" }); });
      entries.sort((a, b) => a.title.localeCompare(b.title, "vi"));

    function openBookPicker() {
      const entries = aiBookEntries();
      openModal('<h3>📖 Chọn sách để trao đổi</h3>' +
        '<div class="search-box" style="margin-bottom:8px">' + icon("search", 17) + '<input id="bp-q" type="text" placeholder="Tìm theo tên sách, tác giả… (' + entries.length + ' cuốn trong thư viện)" /></div>' +
        '<div id="bp-list" style="max-height:52vh;overflow-y:auto"></div>' +

        const f = matched.slice(0, 60);

          (f.length ? f.map((e) => '<button class="menu-item" data-bp-pick="' + e.kind + ":" + esc(e.id) + '" style="text-align:left"><span style="flex:1;min-width:0"><b style="display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">' + esc(e.title) + '</b><span style="font-size:12px;color:var(--dim)">' + esc(e.author || "Chưa rõ tác giả") + " · " + e.tag + "</span></span></button>").join("") : '<p style="color:var(--dim);font-size:13.5px;padding:8px 2px">Không thấy sách khớp — anh thử từ khoá khác nhé.</p>') +
          (matched.length > 60 ? '<p style="font-size:12px;color:var(--dim);padding:6px 2px">Đang hiện 60/' + matched.length + " cuốn khớp — gõ thêm để thu hẹp.</p>" : "");

    async function init() {
      await idb.open();
      await loadLocal();
      render();
      // GIS nạp bất đồng bộ: chờ thư viện Google sẵn sàng rồi mới vẽ nút + bật One Tap.
      let gisTries = 0;
      const gisTimer = setInterval(() => {
        gisTries++;
        if (initGisId()) { mountGisButtons(); clearInterval(gisTimer); }
        else if (gisTries > 50) clearInterval(gisTimer);
      }, 300);
      try {
        if (window.firebase && firebase.auth && firebase.database) {
          fbApp = firebase.initializeApp(FIREBASE_CONFIG);
          fbAuth = firebase.auth();
          fbDb = firebase.database();
          fbAuth.onAuthStateChanged(async (user) => {
            if (user) {
              try { if (gisIdAvailable()) google.accounts.id.cancel(); } catch (e) {}
              const wasGuest = !S.user;
              S.user = user;
              if (wasGuest) { await loadLocal(); }
              startCloudSync();
              setTimeout(migrateLegacyKeys, 1500); // đẩy khóa bản cũ từ máy lên tài khoản (chỉ điền chỗ trống)
              if (!tokenValid()) { refreshGToken(false).catch(() => { S.tokenState = "expired"; render(); }); }
              else checkScopes();
              render();
            } else {
              if (S.user) { stopCloudSync(); S.user = null; try { localStorage.removeItem("hp-api-keys"); localStorage.removeItem("hp-tts-keys-v1"); } catch (e) {} await loadLocal(); }
              render();
            }
          });
        }
      } catch (e) { /* Firebase không tải được → chế độ khách */ }
      const fi = $("#file-input");
      fi.addEventListener("change", () => { addBookFiles(fi.files); fi.value = ""; });
      let rzT; window.addEventListener("resize", () => { clearTimeout(rzT); rzT = setTimeout(() => { if (!R.open) render(); }, 250); });
      if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { A.voice = pickViVoice(); }; }
      // Ghi phút NGHE theo ngày địa phương vào cùng sổ phút đọc (mục 20).
      A.lastListenTick = Date.now();
      setInterval(() => {
        const now = Date.now();
        if (A.playing && !document.hidden) {
          const mins = (now - (A.lastListenTick || now)) / 60000;
          if (mins > 0 && mins < 1) { DB.stats.readLog[localDayKey()] = (DB.stats.readLog[localDayKey()] || 0) + mins; persistDebounced("stats", 4000); }
        }
        A.lastListenTick = now;
      }, 20000);
      // LỖI ENTER (bản live): handler keydown gắn trên node textarea của LẦN render đó —
      // app vẽ lại toàn bộ view khi trạng thái đổi (token/cloud/gợi ý…) nên node bị thay,
      // listener mất theo, trong khi nút “Hỏi Annie” được bindView gắn lại mỗi lần render nên vẫn chạy.
      // Khắc phục dứt điểm: thêm listener UỶ QUYỀN ở document (gắn 1 lần, không mất khi render lại),
      // gọi đúng hàm askAI() mà nút bấm dùng; handler trực tiếp trên ô vẫn giữ làm lớp đầu.
      document.addEventListener("keydown", (e) => {
        const t = e.target;
        if (t && t.id === "ai-q" && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          if (!S.aiBusy) askAI();
        }
      });
    }
    document.addEventListener("DOMContentLoaded", init);
