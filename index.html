    /* Lọc ký tự định dạng (* _ # | < > [ ]) để giọng máy không đọc vấp ký tự lạ. */
    function cleanForSpeech(text) { return String(text || "").replace(/[*_#|<>[\]]/g, " ").replace(/\s+/g, " "); }
    function splitChunks(text, max) {
      const parts = []; const sentences = String(text || "").split(/(?<=[.!?…])\s+/);
      let cur = "";
      sentences.forEach((s) => {
        if ((cur + " " + s).length > max && cur) { parts.push(cur); cur = s; }
        else cur = cur ? cur + " " + s : s;
        while (cur.length > max * 1.6) { parts.push(cur.slice(0, max)); cur = cur.slice(max); }
      });
      if (cur.trim()) parts.push(cur);
      return parts.filter((p) => p.trim().length > 0);
    }
    function pickViVoice() {
      try {
        const voices = speechSynthesis.getVoices();
        return voices.find((v) => /^vi/i.test(v.lang)) || voices.find((v) => /viet/i.test(v.name)) || null;
      } catch (e) { return null; }
    }
    function startDeviceListen(chIdx, chunkIdx) {
      const book = findBook(A.bookId); if (!book || !A.chapters) return;
      stopFileAudio();
      A.mode = "device"; A.chIdx = chIdx;
      A.chunks = splitChunks(cleanForSpeech(A.chapters[chIdx].text), 190);
      A.chunkIdx = Math.min(chunkIdx || 0, Math.max(0, A.chunks.length - 1));
      A.playing = true;
      if (!A.voice) A.voice = pickViVoice();
      showPlayer(book, A.chapters[chIdx].title);
      speakCurrent();
    }
    function speakCurrent() {
      if (!("speechSynthesis" in window)) { toast("Máy này không có giọng đọc sẵn — anh dùng “Tạo file podcast” hoặc thử trình duyệt khác nhé."); return; }
      speechSynthesis.cancel();
      if (A.chunkIdx >= A.chunks.length) { nextChapterListen(); return; }
      if (!A.voice) A.voice = pickViVoice(); // giọng có thể nạp muộn qua onvoiceschanged — chọn lại trước mỗi đoạn
      const u = new SpeechSynthesisUtterance(A.chunks[A.chunkIdx]);
      if (A.voice) u.voice = A.voice;
      u.lang = (A.voice && A.voice.lang) || "vi-VN";
      u.rate = A.rate;
      u.onend = () => {
        if (!A.playing || A.mode !== "device") return;
        A.chunkIdx++; saveListenPos();
        if (A.chunkIdx >= A.chunks.length) {
          if (A.stopAtChapterEnd) { A.stopAtChapterEnd = false; A.playing = false; try { speechSynthesis.cancel(); } catch (e) {} toast("Đã hết chương — app dừng nghe như đã hẹn. Chúc anh thư giãn!"); updatePlayerToggle(); return; }
          nextChapterListen();
        }
        else { speakCurrent(); updatePlayerSub(); }
      };
      u.onerror = () => { if (A.playing && A.mode === "device") { A.chunkIdx++; if (A.chunkIdx < A.chunks.length) speakCurrent(); } };
      speechSynthesis.speak(u);
      updatePlayerSub();
    }
    function nextChapterListen() {
      if (A.chIdx + 1 < (A.chapters || []).length) { startDeviceListen(A.chIdx + 1, 0); }
      else { A.playing = false; toast("Đã nghe hết sách. Hay quá anh!"); updatePlayerToggle(); }
    }
    function saveListenPos() {
      const book = findBook(A.bookId); if (!book || !A.chapters) return;
      const total = A.chapters.reduce((s, c) => s + c.text.length, 0) || 1;
      let before = 0; for (let i = 0; i < A.chIdx; i++) before += A.chapters[i].text.length;
      const within = A.chunks.slice(0, A.chunkIdx).reduce((s, c) => s + c.length, 0);
      const pos = DB.positions[book.id] || (DB.positions[book.id] = {});
      pos.listen = { chapterIdx: A.chIdx, chunkIdx: A.chunkIdx, percent: (before + within) / total, updatedAt: Date.now() };
      pos.updatedAt = Date.now();
      persistDebounced("positions", 600);
    }
    function showPlayer(book, sub) {
      const bar = $("#player-bar"); if (!bar) return;

      updatePlayerMode();
    }
    function updatePlayerSub(sub) {
      const el = $("#pb-sub"); if (!el) return;
      const ttl = $("#pb-title");
      if (A.mode === "file") { if (ttl) ttl.textContent = "Đang nghe " + (sub || "file podcast") + " • Nghe rảnh tay"; el.textContent = sub || "Đang phát file podcast"; return; }
      const ch = A.chapters && A.chapters[A.chIdx];
      const book = findBook(A.bookId);

    /* Dòng trạng thái nghe rảnh tay: tốc độ đọc + hẹn giờ tắt đang chọn, luôn nhìn thấy trong khung nghe. */
    function updatePlayerMode() {
      const el = $("#pb-mode"); if (!el) return;
      const tSel = $("#pb-timer"); const tv = tSel ? tSel.value : "0";
      const tTxt = tv === "chapter" ? "Hết chương này" : (tv && tv !== "0" ? tv + " phút" : "Không hẹn");
      el.textContent = "Tốc độ đọc: " + A.rate + "× · Hẹn giờ tắt: " + tTxt;
    }
    function updatePlayerToggle() { const b = $("#pb-toggle"); if (b) b.innerHTML = icon(A.playing ? "pause" : "play", 20); }
    function bindPlayer() {
      const t = $("#pb-toggle");
      if (!t || t.dataset.bound) return;
      t.dataset.bound = "1";
      t.addEventListener("click", () => {
        if (A.mode === "file" && A.audio) { if (A.audio.paused) { A.audio.play(); A.playing = true; } else { A.audio.pause(); A.playing = false; } updatePlayerToggle(); return; }
        if (!("speechSynthesis" in window)) return;
        if (speechSynthesis.speaking && !speechSynthesis.paused) { speechSynthesis.pause(); A.playing = false; }
        else if (speechSynthesis.paused) { speechSynthesis.resume(); A.playing = true; }
        else if (!A.playing && A.chapters) { A.playing = true; speakCurrent(); }
        updatePlayerToggle();
      });
      $("#pb-stop").addEventListener("click", stopAudio);
      $("#pb-prev-ch").addEventListener("click", () => { if (A.mode === "device" && A.chIdx > 0) startDeviceListen(A.chIdx - 1, 0); });
      $("#pb-next-ch").addEventListener("click", () => { if (A.mode === "device") nextChapterListen(); });
      const ps = $("#pb-prev-sent");
      if (ps) ps.addEventListener("click", () => {
        if (A.mode === "file" && A.audio) { A.audio.currentTime = Math.max(0, A.audio.currentTime - 15); return; }
        if (A.mode === "device" && A.chunkIdx > 0) { A.chunkIdx--; A.playing = true; speakCurrent(); updatePlayerToggle(); }
      });
      const ns = $("#pb-next-sent");
      if (ns) ns.addEventListener("click", () => {
        if (A.mode === "file" && A.audio) { A.audio.currentTime = Math.min(A.audio.duration || 0, A.audio.currentTime + 15); return; }
        if (A.mode === "device") { A.chunkIdx++; A.playing = true; speakCurrent(); updatePlayerToggle(); }
      });
      $("#pb-rate").addEventListener("change", (e) => { A.rate = Number(e.target.value); if (A.mode === "device" && A.playing) speakCurrent(); if (A.audio) A.audio.playbackRate = A.rate; updatePlayerMode(); toast("Tốc độ nghe: " + A.rate + "×"); });

    }
    function setSleepTimer(v) {
      clearInterval(A.timerId); A.timerId = null;
      const lbl = $("#pb-timer-left"); if (lbl) lbl.textContent = "";
      A.stopAtChapterEnd = false;
      if (v === "chapter") {
        A.stopAtChapterEnd = true;
        if (lbl) lbl.textContent = "Sẽ dừng khi hết chương này";
        updatePlayerMode();
        toast("Nghe hết chương này là app tự dừng.");
        return;
      }
      const min = Number(v) || 0;
      updatePlayerMode();
      if (!min) return;
      A.timerLeft = min * 60;
      A.timerId = setInterval(() => {
        A.timerLeft--;
        const l = $("#pb-timer-left"); if (l) l.textContent = "Tắt sau " + Math.floor(A.timerLeft / 60) + ":" + String(A.timerLeft % 60).padStart(2, "0");
        if (A.timerLeft <= 0) { clearInterval(A.timerId); stopAudio(); toast("Đã hết giờ hẹn — app dừng nghe. Chúc anh ngủ ngon!"); }

    function stopFileAudio() { if (A.audio) { try { A.audio.pause(); } catch (e) {} A.audio = null; } if (A.audioUrl) { URL.revokeObjectURL(A.audioUrl); A.audioUrl = ""; } const el = $("#pb-audio"); if (el) { el.classList.add("hidden"); el.removeAttribute("src"); } }
    function stopAudio() {

    }
    async function playEpisodeFile(epId) {
      const ep = DB.episodes.find((e) => e.id === epId); if (!ep) return;
      const book = findBook(ep.bookId); if (!book) return;
      if ("speechSynthesis" in window) speechSynthesis.cancel();
      A.mode = "file"; A.playing = true;
      showPlayer(book, "Tập podcast: " + ep.chapterTitle);
      const audioEl = $("#pb-audio");
      try {
        let blob = ep.localKey ? await idb.get("files", ep.localKey) : null;
        if (!blob && ep.driveFileId) blob = await driveDownload(ep.driveFileId);
        if (!blob) throw new Error("Không tải được file audio");
        stopFileAudio();
        A.audioUrl = URL.createObjectURL(blob);
        if (audioEl) { audioEl.src = A.audioUrl; audioEl.classList.remove("hidden"); audioEl.playbackRate = A.rate; A.audio = audioEl; audioEl.play(); }
      } catch (e) { toast("Chưa phát được file podcast: " + ((e && e.message) || e)); }
      updatePlayerToggle();
    }
    async function makePodcastEpisode(chIdx) {
      const book = findBook(A.bookId); if (!book || !A.chapters) return;
      const keys = loadKeys();
      if (!keys.openai) { toast("Anh dán khóa OpenAI trong mục Cài đặt trước đã nhé."); return; }
      const ch = A.chapters[chIdx];
      A.generating = book.id + ":" + chIdx; renderChapterList(book, A.chapters, A.chIdx);
      try {
        const text = ch.text;
        const pieces = splitChunks(text, 3500); // mỗi đoạn ≤3.500 ký tự (giới hạn OpenAI TTS), gọi tuần tự rồi ghép MP3
        const blobs = [];
        for (const piece of pieces) {
          const res = await fetch("https://api.openai.com/v1/audio/speech", {
            method: "POST", headers: { Authorization: "Bearer " + keys.openai, "Content-Type": "application/json" },
            body: JSON.stringify({ model: "tts-1", voice: "alloy", input: piece, response_format: "mp3" }),
          });
          if (!res.ok) throw new Error("OpenAI TTS lỗi " + res.status);
          blobs.push(await res.blob());
        }
        const mp3 = new Blob(blobs, { type: "audio/mpeg" });
        const ep = { id: uid(), bookId: book.id, chapterIdx: chIdx, chapterTitle: ch.title, createdAt: Date.now(), size: mp3.size, driveFileId: "", localKey: "" };
        if (S.user) {
          if (!hasScope(DRIVE_SCOPE)) { reassureScope(); try { await requestScopes(DRIVE_SCOPE, true); } catch (e) {} }
          try { ep.driveFileId = await driveUpload(book.title + " - " + ch.title + ".mp3", mp3, "audio/mpeg"); idb.put("files", "drive:" + ep.driveFileId, mp3); }
          catch (e) { ep.localKey = "ep:" + ep.id; await idb.put("files", ep.localKey, mp3); }
        } else { ep.localKey = "ep:" + ep.id; await idb.put("files", ep.localKey, mp3); }
        DB.episodes = DB.episodes.filter((e) => !(e.bookId === book.id && e.chapterIdx === chIdx));
        DB.episodes.push(ep); persist("episodes");
        toast("Đã tạo file podcast cho “" + ch.title + "” (" + pieces.length + " đoạn ghép thành 1 file).");
      } catch (e) { toast("Tạo file podcast chưa thành công: " + ((e && e.message) || e), 5000); }
      A.generating = ""; render();
    }
    function readFromListenPosition() {
      const book = findBook(S.listenBookId); if (!book) return;
      const pos = DB.positions[book.id];
      if (pos && pos.listen && typeof pos.listen.percent === "number") {
        pos.percent = pos.listen.percent; pos.listenJump = true; delete pos.cfi; delete pos.page;
        persistDebounced("positions", 200);
        toast("Đã đồng bộ vị trí: mở sách tại đúng chỗ anh đang nghe.");
      }
      openBook(book.id);
    }

    /* ================= Tìm sách + AI ================= */
    function loadKeys() { try { return Object.assign({ claude: "", gemini: "", openai: "" }, JSON.parse(localStorage.getItem("hp-api-keys") || "{}")); } catch (e) { return { claude: "", gemini: "", openai: "" }; } }
    function saveKeys(k) { try { localStorage.setItem("hp-api-keys", JSON.stringify(k)); } catch (e) {} }
    function uiTheme() { try { return localStorage.getItem("hp-ui-theme") === "dark" ? "dark" : "light"; } catch (e) { return "light"; } }
    function applyUiTheme(t) {
      if (t === "dark") document.documentElement.setAttribute("data-theme", "dark");
      else document.documentElement.removeAttribute("data-theme");
      try { localStorage.setItem("hp-ui-theme", t); } catch (e) {}
    }
    const PROVIDERS = {
      claude: { name: "Claude", why: "tóm tắt & phân tích nội dung sách", web: (q) => "https://claude.ai/new?q=" + encodeURIComponent(q) },
      gemini: { name: "Gemini", why: "tìm sách mới & gợi ý", web: () => "https://gemini.google.com/app" },
      openai: { name: "ChatGPT", why: "hỏi đáp nhanh & tổng hợp", web: (q) => "https://chatgpt.com/?q=" + encodeURIComponent(q) },
      muse: { name: "Muse", why: "hỏi đáp & gợi ý sách trên web Muse (chỉ mở web)", web: () => "https://muse.ai", webOnly: true },
      dola: { name: "Dola", why: "hỏi đáp nhanh trên web Dola (chỉ mở web)", web: () => "https://www.dola.com", webOnly: true },
    };
    function routeAI(q) {
      const s = " " + String(q || "").toLowerCase() + " ";
      if (/\bmuse\b/.test(s)) return "muse";
      if (/\bdola\b/.test(s)) return "dola";
      if (/tóm tắt|tom tat|phân tích|phan tich|nội dung|nhân vật|nhan vat|giải thích|giai thich|trao đổi|trao doi|bàn về|ban ve|ý nghĩa|y nghia|đánh giá cuốn|danh gia cuon|review/.test(s)) return "claude";
      if (/tìm sách|tim sach|gợi ý|goi y|đề xuất|de xuat|sách nào|sach nao|sách về|sach ve|nên đọc|nen doc|sách hay|sach hay|recommend/.test(s)) return "gemini";
      return "openai";
    }
    /* Dropdown chọn hãng: để "auto" thì app tự phân công theo câu hỏi. */
    function effectiveProvider(q) {
      const sel = S.aiProviderSel || "auto";
      if (sel !== "auto" && PROVIDERS[sel]) return sel;
      return routeAI(q || "");
    }
    function aiWebButtonsHTML(q, chosen) {
      const all = [chosen].concat(["claude", "gemini", "openai", "muse", "dola"]).filter((v, i, a) => a.indexOf(v) === i);
      return all.map((p) => {
        if (PROVIDERS[p].webOnly) return '<button class="btn soft" data-webonly="' + p + '">Hỏi ' + PROVIDERS[p].name + "</button>";
        return '<a class="btn soft" target="_blank" rel="noreferrer" href="' + esc(PROVIDERS[p].web(q)) + '">Hỏi ' + PROVIDERS[p].name + "</a>";
      }).join("");
    }
    async function openWebOnly(p) {
      const prov = PROVIDERS[p]; if (!prov) return;
      const q = (S.aiQuestion || "").trim();
      if (q) {
        try { await navigator.clipboard.writeText(q); toast("Đã sao chép câu hỏi — mở " + prov.name + " xong anh dán vào là hỏi được ngay."); }
        catch (e) { toast("Mở " + prov.name + " — anh sao chép câu hỏi ở ô trên rồi dán vào nhé."); }
      }
      window.open(prov.web(q), "_blank", "noopener");
    }
    /* ---- Lệnh điều khiển bằng tiếng Việt trong khung chat ---- */
    function stripVi(s) { return String(s || "").normalize("NFC").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "d"); }
    function findBookMentioned(q) {
      const nq = " " + stripVi(q) + " ";
      let best = null, bestLen = 0;
      DB.books.forEach((b) => {
        const t = stripVi(b.title).trim();
        if (t && nq.indexOf(t) >= 0 && t.length > bestLen) { best = b; bestLen = t.length; }
      });
      return best;
    }
    function resolveCommandBook(q) {
      return findBookMentioned(q) || (S.aiBookId ? findBook(S.aiBookId) : null) || inProgressBooks()[0] || null;
    }
    function detectCommand(q) {
      const s = stripVi(q);
      const mentioned = findBookMentioned(q);
      if (/nghe sach|doc audio|doc cho (toi )?nghe|doc thanh tieng|phat sach|nghe cuon|doc sach .*nghe|doc cuon .*nghe/.test(s)) return { type: "listen", book: resolveCommandBook(q) };
      if (/^nghe\s/.test(s.trim()) && mentioned) return { type: "listen", book: mentioned };
      if (/^(tim sach|tim)\s+/.test(s.trim())) { const qq = q.replace(/^\s*(tìm\s+sách|tim\s+sach|tìm|tim)\s+/i, "").trim(); return { type: "search", query: qq || q }; }
      if (/tom tat/.test(s)) return { type: "summarize", book: findBookMentioned(q) || (S.aiBookId ? findBook(S.aiBookId) : null) };
      if (/(^mo\s+(sach|cuon))|mo cuon|mo sach|doc cuon|doc sach/.test(s.trim())) {
        const b = findBookMentioned(q) || (S.aiBookId ? findBook(S.aiBookId) : null);
        if (b) return { type: "open", book: b };
      }
      return null;
    }
    /* Nút hỏi AI có sẵn: chạy đúng luồng như khi gõ tay câu tóm tắt/hỏi về cuốn đó. */
    function runAiQuick(bookId, kind) {
      const b = findBook(bookId); if (!b) return;
      S.aiBookId = bookId;
      S.aiQuestion = kind === "summary" ? ("Tóm tắt cuốn " + b.title) : ("Cuốn " + b.title + " nói về điều gì?");
      S.view = "ai";
      render(); window.scrollTo(0, 0);
      if (!S.aiBusy) askAI();
    }
    function cmdListen(book) {
      S.aiFallback = ""; S.aiAnswer = "";
      S.aiListenConfirm = { bookId: book.id, title: book.title };
      S.view = "listen"; S.listenBookId = book.id;
      A.pendingAutoPlay = true;
      render(); window.scrollTo(0, 0);
      toast("Đang đọc “" + book.title + "” bằng giọng tiếng Việt…");
    }
    function stopListenFromChat() {
      stopAudio();
      S.aiListenConfirm = null;
      toast("Đã dừng đọc sách.");
      render();
    }
    async function searchGoogleBooks(q, max) {
      const res = await fetch("https://www.googleapis.com/books/v1/volumes?q=" + encodeURIComponent(q) + "&maxResults=" + (max || 10) + "&printType=books");
      if (!res.ok) throw new Error("Google Books lỗi " + res.status);
      const data = await res.json();
      return (data.items || []).map((v) => {
        const info = v.volumeInfo || {};
        const thumb = (info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)) || "";
        return { googleId: v.id, title: (info.title || "Sách không tên"), author: (info.authors || []).join(", "), coverUrl: thumb.replace(/^http:\/\//, "https://"), infoLink: info.infoLink || "", year: (info.publishedDate || "").slice(0, 4) };
      });
    }
    async function callClaude(key, prompt) {
      const res = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true", "content-type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-5", max_tokens: 1600, messages: [{ role: "user", content: prompt }] }),
      });
      if (!res.ok) throw new Error("Claude lỗi " + res.status);
      const d = await res.json();
      return (d.content || []).map((c) => c.text || "").join("\n").trim();
    }
    async function callGemini(key, prompt) {
      const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent", {
        method: "POST", headers: { "content-type": "application/json", "x-goog-api-key": key },
        body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }),
      });
      if (!res.ok) throw new Error("Gemini lỗi " + res.status);
      const d = await res.json();
      const parts = (((d.candidates || [])[0] || {}).content || {}).parts || [];
      return parts.map((p) => p.text || "").join("\n").trim();
    }
    async function callOpenAI(key, prompt) {
      const res = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST", headers: { Authorization: "Bearer " + key, "content-type": "application/json" },
        body: JSON.stringify({ model: "gpt-4o-mini", messages: [{ role: "user", content: prompt }], max_tokens: 1500 }),
      });
      if (!res.ok) throw new Error("ChatGPT lỗi " + res.status);
      const d = await res.json();
      return (((d.choices || [])[0] || {}).message || {}).content || "";
    }
    const AI_CALLERS = { claude: callClaude, gemini: callGemini, openai: callOpenAI };
    function viewAI() {
      const keys = loadKeys();
      const sel = S.aiProviderSel || "auto";
      const chosen = effectiveProvider(S.aiQuestion || "");
      let h = '<div class="shelf-head" style="margin-top:2px"><h2>Hỏi AI về sách</h2><span class="count">Claude · Gemini · ChatGPT · Muse · Dola</span></div>';

      if (S.aiListenConfirm) {

      }

      }
      h += '<div class="card"><div class="field" style="margin-bottom:9px"><label>Câu hỏi của anh</label><textarea id="ai-q" rows="3" placeholder="Ví dụ: Tóm tắt cuốn Đắc Nhân Tâm · Gợi ý sách về thói quen tốt · Nghe sách Đắc Nhân Tâm…">' + esc(S.aiQuestion || "") + '</textarea><div class="hint">Enter để gửi · Shift+Enter để xuống dòng</div></div>' +
        '<div class="field" style="margin-bottom:10px"><label>Chọn AI</label><select class="select" id="ai-provider" style="width:100%;border-radius:13px">' +
        '<option value="auto"' + (sel === "auto" ? " selected" : "") + '>Tự động (app tự phân công)</option>' +
        '<option value="claude"' + (sel === "claude" ? " selected" : "") + '>Claude</option>' +
        '<option value="gemini"' + (sel === "gemini" ? " selected" : "") + '>Gemini</option>' +
        '<option value="openai"' + (sel === "openai" ? " selected" : "") + '>ChatGPT</option>' +
        '<option value="muse"' + (sel === "muse" ? " selected" : "") + '>Muse (mở web)</option>' +
        '<option value="dola"' + (sel === "dola" ? " selected" : "") + '>Dola (mở web)</option>' +
        "</select></div>" +
        '<div class="field" style="margin-bottom:10px"><label>Trao đổi về một cuốn trong thư viện (không bắt buộc)</label><select class="select" id="ai-book" style="width:100%;border-radius:13px"><option value="">— Không chọn —</option>' +
        DB.books.map((b) => '<option value="' + b.id + '"' + (S.aiBookId === b.id ? " selected" : "") + ">" + esc(b.title) + "</option>").join("") + "</select></div>" +
        '<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><button class="btn primary" id="ai-ask" style="min-height:52px;padding:12px 26px;font-size:15.5px" ' + (S.aiBusy ? "disabled" : "") + ">" + icon("spark", 16) + (S.aiBusy ? " Đang hỏi…" : " Hỏi AI") + "</button>" +
        '<span id="ai-route-note" class="provider-tag">' + icon("spark", 13) + " " + esc(PROVIDERS[chosen].name) + " — " + esc(PROVIDERS[chosen].why) + "</span></div>" +
        (!keys.claude && !keys.gemini && !keys.openai ? '<p class="hint" style="font-size:12.5px;color:var(--dim);margin:10px 0 0">Chưa có khóa API nào: app vẫn tìm sách thật trên Google Books và có nút mở sẵn câu hỏi sang trang web của AI. Dán khóa trong mục Cài đặt để AI trả lời ngay trong app.</p>' : "") +
        "</div>";
      h += '<div id="ai-answer-wrap" style="margin-top:14px">' + (S.aiAnswer ? '<div class="provider-tag" style="margin-bottom:8px">' + esc(S.aiAnswerBy || "") + '</div><div class="ai-answer">' + esc(S.aiAnswer) + "</div>" : "") + '<div id="ai-fallback">' + (S.aiFallback || "") + "</div></div>";
      h += '<div id="ai-books">' + (S.aiBooks ? booksResultHTML(S.aiBooks) : "") + "</div>";
      return h;
    }
    function booksResultHTML(list) {
      if (!list) return "";
      if (!list.length) return '<div class="shelf-head"><h2>Sách thật trên Google Books</h2></div><p style="color:var(--dim);font-size:13.5px">Chưa tìm thấy sách khớp — anh thử từ khoá ngắn hơn nhé.</p>';
      return '<div class="shelf-head"><h2>Sách thật trên Google Books</h2><span class="count">' + list.length + ' cuốn</span></div>' +
        shelfHTML(list, shelfColumns("play"),
          (b) => '<a class="cover" target="_blank" rel="noreferrer" href="' + esc(b.infoLink || "#") + '">' + playCoverHTML(b) + "</a>",
          (b) => '<span class="book-title">' + esc(b.title) + '</span><span class="book-author">' + esc(b.author || "Chưa rõ tác giả") + (b.year ? " · " + b.year : "") + "</span>");
    }
    function updateRouteChip() {
      const note = $("#ai-route-note"); if (!note) return;
      const p = effectiveProvider(S.aiQuestion || "");
      S.aiRoute = p;
      note.innerHTML = icon("spark", 13) + " " + esc(PROVIDERS[p].name) + " — " + esc(PROVIDERS[p].why);
    }
    function afterAIRender() {
      const q = $("#ai-q");
      if (q) {
        q.addEventListener("input", () => { S.aiQuestion = q.value; updateRouteChip(); });
        q.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!S.aiBusy) askAI(); }
        });
      }
      const pv = $("#ai-provider"); if (pv) pv.addEventListener("change", () => { S.aiProviderSel = pv.value || "auto"; updateRouteChip(); });
      const bk = $("#ai-book"); if (bk) bk.addEventListener("change", () => { S.aiBookId = bk.value || ""; });
      const ask = $("#ai-ask"); if (ask) ask.addEventListener("click", askAI);
      $$("[data-ai-quick]").forEach((el) => el.addEventListener("click", () => { const parts = el.getAttribute("data-ai-quick").split(":"); runAiQuick(parts.slice(1).join(":"), parts[0]); }));
      $$("[data-webonly]").forEach((el) => el.addEventListener("click", () => openWebOnly(el.getAttribute("data-webonly"))));
      $$("[data-ai-listen-pick]").forEach((el) => el.addEventListener("click", () => { const b = findBook(el.getAttribute("data-ai-listen-pick")); if (b) cmdListen(b); }));
      const cp = $("#ai-copy");
      if (cp) cp.addEventListener("click", async () => { try { await navigator.clipboard.writeText((S.aiQuestion || "").trim()); toast("Đã sao chép câu hỏi."); } catch (e) { toast("Chưa sao chép được — anh giữ tay để copy thủ công nhé."); } });
    }
    async function askAI() {
      const q = ($("#ai-q") && $("#ai-q").value || "").trim();
      if (!q) { toast("Anh nhập câu hỏi trước đã nhé."); return; }
      S.aiQuestion = q;
      // Lệnh điều khiển tiếng Việt: thực thi ngay, không chỉ trả lời chữ.
      const cmd = detectCommand(q);
      if (cmd && cmd.type === "listen") {
        if (cmd.book) { cmdListen(cmd.book); return; }
        const picks = inProgressBooks();
        S.aiFallback = '<div class="card"><h3>Anh muốn nghe cuốn nào?</h3><p>Em chưa rõ anh muốn nghe cuốn nào — anh chọn nhanh một cuốn đang đọc dở nhé:</p><div style="display:flex;gap:8px;flex-wrap:wrap">' +
          (picks.length ? picks.slice(0, 6).map((b) => '<button class="btn soft" data-ai-listen-pick="' + b.id + '">' + icon("head", 15) + " " + esc(b.title) + "</button>").join("") : DB.books.slice(0, 6).map((b) => '<button class="btn soft" data-ai-listen-pick="' + b.id + '">' + icon("head", 15) + " " + esc(b.title) + "</button>").join("")) +
          "</div>" + (DB.books.length ? "" : '<p style="margin-top:8px">Thư viện chưa có cuốn nào — anh thêm sách trước nhé.</p>') + "</div>";
        render();
        return;
      }
      if (cmd && cmd.type === "open" && cmd.book) { toast("Đang mở “" + cmd.book.title + "”…"); openBook(cmd.book.id); return; }
      if (cmd && cmd.type === "search") {
        // Lệnh “tìm sách X”: chạy ngay trên Google Books, KHÔNG cần khóa API.
        S.aiBusy = true; S.aiAnswer = ""; S.aiFallback = ""; render();
        try {
          const list = await searchGoogleBooks(cmd.query, 10);
          S.aiBooks = list;
          S.aiFallback = '<div class="card"><h3>Kết quả tìm sách</h3><p>Em tìm ngay trên Google Books cho anh — lệnh tìm sách chạy ngay trong app, không cần khóa AI. Kết quả ở ngay bên dưới ạ.</p></div>';
        } catch (e) {
          S.aiBooks = [];
          S.aiFallback = '<div class="card"><h3>Chưa tìm được lúc này</h3><p>Kết nối tới Google Books đang trục trặc — anh thử lại sau ít phút nhé.</p></div>';
        }
        S.aiBusy = false; render();
        return;
      }
      if (cmd && cmd.type === "summarize" && cmd.book) { S.aiBookId = cmd.book.id; }
      S.aiBusy = true; S.aiAnswer = ""; S.aiFallback = ""; render();
      const chosen = effectiveProvider(q);
      S.aiRoute = chosen;
      const keys = loadKeys();
      // Tìm sách thật chạy kèm luôn.
      const bookCtx = S.aiBookId ? findBook(S.aiBookId) : null;
      let searchQ = q.replace(/^(tóm tắt|tom tat|tìm sách|tim sach|gợi ý|goi y|sách về|sach ve)\s+/i, "");
      if (bookCtx && chosen === "claude") searchQ = bookCtx.title;
      searchGoogleBooks(searchQ, 10).then((list) => { S.aiBooks = list; const box = $("#ai-books"); if (box) box.innerHTML = booksResultHTML(list); }).catch(() => { S.aiBooks = []; });
      // Chuẩn bị ngữ cảnh sách (nếu chọn cuốn cụ thể).
      let context = "";
      if (bookCtx) {
        context = "\n\nCuốn sách đang trao đổi: “" + bookCtx.title + "” của " + (bookCtx.author || "chưa rõ tác giả") + ".";
        try {
          const chapters = await extractChapters(bookCtx);
          const pos = posOf(bookCtx.id) || {};
          const idx = pos.listen && typeof pos.listen.chapterIdx === "number" ? pos.listen.chapterIdx : 0;
          const ch = chapters[Math.min(idx, chapters.length - 1)];
          if (ch) context += "\nTrích nội dung chương “" + ch.title + "” (để tham khảo, không chép lại nguyên văn dài):\n" + ch.text.slice(0, 6000);
        } catch (e) {}
      }
      // Muse / Dola: chỉ mở web (không có khóa API) — gợi ý đúng nút của hãng đó.
      if (PROVIDERS[chosen].webOnly) {
        S.aiBusy = false;
        S.aiFallback = '<div class="card"><h3>Hỏi ' + PROVIDERS[chosen].name + ' trên trang web của hãng</h3><p>' + ((S.aiProviderSel && S.aiProviderSel !== "auto") ? "Anh đã chọn đích danh " : "Câu hỏi nhắc đích danh ") + '<b>' + PROVIDERS[chosen].name + '</b> — hãng này chưa có khóa API cho người dùng phổ thông nên app chưa trả lời thay ngay trong app được. Anh bấm nút <b>Hỏi ' + PROVIDERS[chosen].name + '</b>: app sao chép sẵn câu hỏi rồi mở trang ' + PROVIDERS[chosen].name + ', anh dán vào là hỏi ngay. Sách thật từ Google Books vẫn hiện ở dưới.</p><div style="display:flex;gap:8px;flex-wrap:wrap">' +
          aiWebButtonsHTML(q, chosen) +
          '<button class="btn" id="ai-copy">Sao chép câu hỏi</button></div></div>';
        render();
        return;

    async function getSuggestions() {

      const titles = DB.books.slice(0, 12).map((b) => b.title).join("; ");
      const keys = loadKeys();
      let queries = [];
      const prompt = "Dựa trên thư viện sách hiện có (" + (titles || "chưa có sách nào") + "), hãy gợi ý 6 cuốn sách hay nên đọc tiếp. Chỉ trả về danh sách mỗi dòng một tên sách kèm tác giả, không giải thích.";
      const order = ["gemini", "claude", "openai"];
      for (const p of order) {
        if (!keys[p]) continue;
        try {
          const text = await AI_CALLERS[p](keys[p], prompt);
          queries = text.split("\n").map((l) => l.replace(/^[\d\-\.\)\s•]+/, "").trim()).filter((l) => l.length > 2).slice(0, 6);
          if (queries.length) break;
        } catch (e) {}
      }
      if (!queries.length) queries = [titles ? (DB.books[0].author || DB.books[0].title) : "sách hay nên đọc", "sách phát triển bản thân hay", "sách kinh doanh hay"];
      const results = [];
      for (const qq of queries.slice(0, 6)) {
        try { const r = await searchGoogleBooks(qq, 1); if (r[0] && !results.find((x) => x.googleId === r[0].googleId)) results.push(r[0]); } catch (e) {}
      }
      S.suggestions = results;
      const b2 = $("#suggest-box"); if (b2) b2.innerHTML = suggestionsHTML(results);

    function exportNotes(bookId) {
      const b = findBook(bookId); if (!b) return;
      const lines = ["SỔ TAY TRÍCH DẪN — " + b.title, "Tác giả: " + (b.author || ""), "Xuất ngày: " + new Date().toLocaleString("vi-VN"), ""];
      (DB.highlights[bookId] || []).forEach((x) => lines.push("[Gạch chân] “" + x.text + "”"));
      (DB.notes[bookId] || []).forEach((x) => { if (x.quote) lines.push("[Trích] “" + x.quote + "”"); lines.push("[Ghi chú] " + x.text); });
      (DB.bookmarks[bookId] || []).forEach((x) => lines.push("[Đánh dấu] " + x.label));
      const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob); a.download = "so-tay-" + b.title.replace(/[^\p{L}\p{N}]+/gu, "-").slice(0, 60) + ".txt";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }

      let gisTries = 0;

        gisTries++;
        if (initGisId()) { mountGisButtons(); clearInterval(gisTimer); }
        else if (gisTries > 50) clearInterval(gisTimer);

            if (user) {
              try { if (gisIdAvailable()) google.accounts.id.cancel(); } catch (e) {}
              const wasGuest = !S.user;

              if (wasGuest) { await loadLocal(); }
              startCloudSync();

              else checkScopes();

      if ("speechSynthesis" in window) { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => { A.voice = pickViVoice(); }; }
      // Ghi phút NGHE theo ngày địa phương vào cùng sổ phút đọc (mục 20).
      A.lastListenTick = Date.now();
      setInterval(() => {
        const now = Date.now();
        if (A.playing && !document.hidden) {
          const mins = (now - (A.lastListenTick || now)) / 60000;
          if (mins > 0 && mins < 1) { DB.stats.readLog[localDayKey()] = (DB.stats.readLog[localDayKey()] || 0) + mins; persistDebounced("stats", 4000); }
        }
        A.lastListenTick = now;
      }, 20000);
      // LỖI ENTER (bản live): handler keydown gắn trên node textarea của LẦN render đó —
      // app vẽ lại toàn bộ view khi trạng thái đổi (token/cloud/gợi ý…) nên node bị thay,
      // listener mất theo, trong khi nút “Hỏi AI” được bindView gắn lại mỗi lần render nên vẫn chạy.
      // Khắc phục dứt điểm: thêm listener UỶ QUYỀN ở document (gắn 1 lần, không mất khi render lại),
      // gọi đúng hàm askAI() mà nút bấm dùng; handler trực tiếp trên ô vẫn giữ làm lớp đầu.
      document.addEventListener("keydown", (e) => {
        const t = e.target;
        if (t && t.id === "ai-q" && e.key === "Enter" && !e.shiftKey && !e.isComposing) {
          e.preventDefault();
          if (!S.aiBusy) askAI();
        }
      });
    }
    document.addEventListener("DOMContentLoaded", init);

            '<div style="font-weight:700;font-size:16px;margin-bottom:8px">📲 Cài đặt ứng dụng</div>' +
            '<p style="margin:0 0 16px;line-height:1.6;font-size:14.5px">Để cài app: Android — mở menu ⋮ của Chrome, chọn \'Cài đặt ứng dụng\' hoặc \'Thêm vào Màn hình chính\'. iPhone — mở app bằng Safari, bấm nút Chia sẻ rồi chọn \'Thêm vào Màn hình chính\'.</p>' +
            '<button type="button" id="hp-install-help-close" style="background:#b96a00;color:#fff8ec;border:0;border-radius:9px;padding:10px 18px;font-size:14.5px;font-weight:600;cursor:pointer;width:100%">Đã hiểu</button></div>';
          document.body.appendChild(box);
          var close = function () { box.remove(); };
          box.querySelector("#hp-install-help-close").addEventListener("click", close);
          box.addEventListener("click", function (ev) { if (ev.target === box) close(); });
        }
        window.hpInstallClick = function () {
          if (hpDeferredPrompt) {
            var p = hpDeferredPrompt;
            hpDeferredPrompt = null;
            try {
              p.prompt();
              if (p.userChoice && p.userChoice.then) p.userChoice.then(function () {}, function () {});
            } catch (err) {}
          } else {
            hpShowInstallHelp();
          }
        };
      })();
    </script>
  </body>
</html>
