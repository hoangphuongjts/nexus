        if (res.status === 403) throw new Error("Google chưa cấp quyền đọc Play Sách cho phiên này — anh đăng nhập lại và đồng ý quyền sách giúp em.");
        if (!res.ok) throw new Error("Google Books trả lỗi " + res.status);
        const data = await res.json();
        const items = data.items || [];
        volumes.push.apply(volumes, items);
        start += items.length;
        const st = $("#play-status");
        if (st) st.innerHTML = "Đang tải tủ sách từ " + esc(email || "tài khoản Google") + "... (Đã tìm thấy " + volumes.length + ' cuốn)<br/><span style="color:var(--faint)">Dữ liệu gốc trên Google của bạn được giữ nguyên 100%</span>';
        if (items.length < PAGE) break;
        if (volumes.length >= CAP) break;
        const total = data.totalItems || 0;
        if (total > 0 && volumes.length >= total) break;
        await new Promise((r) => setTimeout(r, 150)); // nghỉ ~150ms giữa các trang phân trang
      }
      return volumes;
    }
    function mergePlayVolumes(email, volumes) {

        if (email) sources.add(email);
        DB.playBooks[v.id] = {
          googleId: v.id,
          title: (info.title || "").trim() || "Sách không tên",
          author: (info.authors || []).join(", "),

          readerLink: (v.accessInfo && v.accessInfo.webReaderLink) || (prior ? prior.readerLink || "" : ""),
          infoLink: info.infoLink || "",
          description: String(info.description || (prior ? prior.description || "" : "")).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 900),
          categories: Array.isArray(info.categories) && info.categories.length ? info.categories.slice(0, 4) : (prior && prior.categories ? prior.categories : []),
          genre: prior && prior.genre ? prior.genre : "",

    /* ================= Thêm sách / phân tích metadata ================= */
    async function downscaleCover(blob) {
      try {
        const bmp = await createImageBitmap(blob);
        const maxW = 360; const scale = Math.min(1, maxW / bmp.width);
        const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
        cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
        return cv.toDataURL("image/jpeg", 0.82);
      } catch (e) { return ""; }
    }
    async function blobToDataURL(blob) { return new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(""); r.readAsDataURL(blob); }); }
    async function parseEpubMeta(buf, fileName) {
      const meta = { title: "", author: "", cover: "" };
      if (!window.JSZip) return meta;
      try {
        const zip = await JSZip.loadAsync(buf);
        const contFile = zip.file("META-INF/container.xml");
        if (!contFile) return meta;
        const cont = await contFile.async("string");
        const m = cont.match(/full-path="([^"]+)"/);
        const opfPath = m ? m[1] : "OEBPS/content.opf";
        const opfFile = zip.file(opfPath);
        if (!opfFile) return meta;
        const opf = await opfFile.async("string");
        const doc = new DOMParser().parseFromString(opf, "text/xml");
        const pick = (tag) => { const el = doc.getElementsByTagName("dc:" + tag)[0] || doc.getElementsByTagName(tag)[0]; return el ? (el.textContent || "").trim() : ""; };
        meta.title = pick("title"); meta.author = pick("creator");
        const base = opfPath.includes("/") ? opfPath.slice(0, opfPath.lastIndexOf("/") + 1) : "";
        let coverHref = "";
        const items = doc.getElementsByTagName("item");
        for (let i = 0; i < items.length; i++) { const it = items[i]; if ((it.getAttribute("properties") || "").includes("cover-image")) { coverHref = it.getAttribute("href") || ""; break; } }
        if (!coverHref) {
          const metas = doc.getElementsByTagName("meta");
          for (let i = 0; i < metas.length; i++) if (metas[i].getAttribute("name") === "cover") {
            const cid = metas[i].getAttribute("content");
            for (let j = 0; j < items.length; j++) if (items[j].getAttribute("id") === cid) { coverHref = items[j].getAttribute("href") || ""; break; }
          }
        }
        if (coverHref) {
          const cf = zip.file(base + decodeURIComponent(coverHref)) || zip.file(coverHref);
          if (cf) { const blob = await cf.async("blob"); meta.cover = await downscaleCover(blob) || (await blobToDataURL(blob)); }
        }
      } catch (e) { /* dùng tên file làm dự phòng */ }
      return meta;
    }
    async function parsePdfMeta(buf) {
      const meta = { title: "", author: "", cover: "" };
      if (!window.pdfjsLib) return meta;
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
        const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
        const md = await pdf.getMetadata().catch(() => null);
        if (md && md.info) { meta.title = (md.info.Title || "").trim(); meta.author = (md.info.Author || "").trim(); }
        if (pdf.numPages > 0) {
          const page = await pdf.getPage(1);
          const vp = page.getViewport({ scale: 0.55 });
          const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
          await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
          meta.cover = cv.toDataURL("image/jpeg", 0.82);
        }
        pdf.destroy();
      } catch (e) {}
      return meta;
    }
    /* ---- Metadata + kiểm chứng nhanh cho các định dạng mới ---- */
    const FORMAT_MIME = {
      epub: "application/epub+zip", pdf: "application/pdf", txt: "text/plain",
      docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      fb2: "application/x-fictionbook+xml", cbz: "application/vnd.comicbook+zip",
      md: "text/markdown", html: "text/html",
    };
    function decodeTxtBuffer(buf) {
      const u8 = new Uint8Array(buf);
      if (u8.length >= 2 && u8[0] === 0xff && u8[1] === 0xfe) return new TextDecoder("utf-16le").decode(buf);
      if (u8.length >= 2 && u8[0] === 0xfe && u8[1] === 0xff) return new TextDecoder("utf-16be").decode(buf);
      const t = new TextDecoder("utf-8").decode(buf);
      const bad = (t.match(/�/g) || []).length;
      if (bad > 20 && bad / Math.max(1, t.length) > 0.01) {
        const t2 = new TextDecoder("utf-16le").decode(buf);
        if ((t2.match(/�/g) || []).length < bad) return t2;
      }
      return t;
    }
    function decodeXmlBuffer(buf) {
      const head = new TextDecoder("ascii").decode(new Uint8Array(buf).slice(0, 300));
      const m = head.match(/encoding=["']([^"']+)["']/i);
      const enc = (m && m[1]) || "utf-8";
      try { return new TextDecoder(enc).decode(buf); } catch (e) { return new TextDecoder("utf-8").decode(buf); }
    }
    async function assertZipBuf(buf) {
      if (!window.JSZip) throw new Error("nozip");
      return JSZip.loadAsync(buf.slice(0));
    }
    async function parseDocxMeta(buf) {
      const meta = { title: "", author: "", cover: "" };
      try {
        const zip = await assertZipBuf(buf);
        const f = zip.file("docProps/core.xml");
        if (f) {
          const xml = await f.async("string");
          const doc = new DOMParser().parseFromString(xml, "text/xml");
          const pick = (tag) => { const el = doc.getElementsByTagName("dc:" + tag)[0] || doc.getElementsByTagName(tag)[0]; return el ? (el.textContent || "").trim() : ""; };
          meta.title = pick("title"); meta.author = pick("creator");
        }
      } catch (e) {}
      return meta;
    }
    async function parseFb2Meta(buf) {
      const text = decodeXmlBuffer(buf);
      if (text.indexOf("<FictionBook") < 0) throw new Error("notfb2");
      const doc = new DOMParser().parseFromString(text, "text/xml");
      if (doc.getElementsByTagName("parsererror").length) throw new Error("badfb2");
      const meta = { title: "", author: "", cover: "" };
      const bt = doc.getElementsByTagName("book-title")[0];
      if (bt) meta.title = (bt.textContent || "").trim();
      const authorEl = doc.getElementsByTagName("author")[0];
      if (authorEl) {
        const fn = authorEl.getElementsByTagName("first-name")[0];
        const ln = authorEl.getElementsByTagName("last-name")[0];
        meta.author = ((fn ? fn.textContent : "") + " " + (ln ? ln.textContent : "")).trim();
      }
      return meta;
    }
    /* Thêm sách theo ĐỢT: file khóa DRM / hỏng / ngoài danh sách bị bỏ qua nhẹ nhàng,
       không làm hỏng cả đợt. Thêm 1 file → báo 1 câu ngắn; thêm nhiều file → 1 dòng tổng kết. */
    async function addBookFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      const multi = files.length > 1;
      let added = 0, skipped = 0;
      const skip = (msg) => { skipped++; if (!multi) toast(msg, 5600); };
      for (const file of files) {
        const lower = file.name.toLowerCase();
        const extM = lower.match(/\.([a-z0-9]+)$/);
        const ext = extM ? extM[1] : "";
        if (ext === "acsm" || ext === "azw" || ext === "azw4" || ext === "kfx") { skip("“" + file.name + "” bị khóa bản quyền của hãng bán sách nên app bỏ qua nhé."); continue; }
        if (ext === "mobi" || ext === "azw3") { skip("Định dạng này sẽ được hỗ trợ ở bản sau"); continue; }
        const format = ["epub", "pdf", "txt", "docx", "fb2", "cbz", "md", "html"].indexOf(ext === "htm" ? "html" : ext) >= 0 ? (ext === "htm" ? "html" : ext) : "";
        if (!format) { skip("“" + file.name + "” không thuộc định dạng sách được hỗ trợ nên app bỏ qua nhé."); continue; }
        if (file.size > MAX_FILE_BYTES) { skip("File “" + file.name + "” nặng hơn 25 MB nên chưa thêm được."); continue; }
        try {
          const buf = await file.arrayBuffer();
          let meta = { title: "", author: "", cover: "" };
          if (format === "epub") { await assertZipBuf(buf); meta = await parseEpubMeta(buf, file.name); }
          else if (format === "pdf") {
            const h = new TextDecoder("ascii").decode(new Uint8Array(buf).slice(0, 5));
            if (h.indexOf("%PDF") !== 0) throw new Error("notpdf");
            meta = await parsePdfMeta(buf);
          }
          else if (format === "docx") { const zip = await assertZipBuf(buf); if (!zip.file("word/document.xml")) throw new Error("notdocx"); meta = await parseDocxMeta(buf); }
          else if (format === "fb2") { meta = await parseFb2Meta(buf); }
          else if (format === "cbz") {
            const zip = await assertZipBuf(buf);
            let imgs = 0; zip.forEach((p, en) => { if (!en.dir && /\.(jpe?g|png|gif|webp)$/i.test(p)) imgs++; });
            if (!imgs) throw new Error("nocbzimg");
          }
          else if (format === "txt") { decodeTxtBuffer(buf); }
          else if (format === "md") { decodeTxtBuffer(buf); }
          else if (format === "html") { const rawH = decodeTxtBuffer(buf); if (!/<(html|body|p|div|h1|article)[\s>]/i.test(rawH)) throw new Error("nothtml"); const td = new DOMParser().parseFromString(rawH, "text/html"); if (td.title) meta.title = td.title.trim().slice(0, 140); }
          const book = {
            id: uid(), title: meta.title || file.name.replace(/\.(epub|pdf|txt|docx|fb2|cbz)$/i, ""), author: meta.author || "",
            format, size: file.size, fileName: file.name, cover: meta.cover || "",
            driveFileId: "", collections: [], addedAt: Date.now(),
          };
          const blob = new Blob([buf], { type: FORMAT_MIME[format] || "application/octet-stream" });
          if (S.user) {
            // Điểm cần quyền Drive: Thêm sách CHỈ xin scope Drive — không gộp quyền Play Sách.
            if (!hasScope(DRIVE_SCOPE)) { reassureScope(); try { await requestScopes(DRIVE_SCOPE, true); } catch (e) { /* driveUpload sẽ báo lỗi và app lưu tạm trên máy */ } }
            try {
              book.driveFileId = await driveUpload(file.name, blob, blob.type);
              idb.put("files", "drive:" + book.driveFileId, blob);
            } catch (e) {
              await idb.put("files", "book:" + book.id, blob);
              if (!multi) toast("Chưa tải được lên Drive (em đã lưu tạm trên máy này): " + ((e && e.message) || e), 5000);
            }
          } else {
            await idb.put("files", "book:" + book.id, blob);
          }
          DB.books.push(book); persist("books");
          added++;
          if (!multi) toast("Đã thêm sách “" + book.title + "”. " + driveStatusShort(book), 5600);
        } catch (e) { skip("“" + file.name + "” bị hỏng hoặc bị khóa nên app bỏ qua nhé."); }
      }
      if (multi) toast("Đã thêm " + added + " cuốn" + (skipped ? " · Bỏ qua " + skipped + " cuốn bị khóa/không hỗ trợ" : ""), 5600);
      const linkedNow = linkPlayBooks();
      render();
      if (pendingPlayLink) {
        const gid = pendingPlayLink; pendingPlayLink = "";
        const pb = DB.playBooks[gid];
        if (pb && pb.localId) { S.listenBookId = pb.localId; render(); const lb = findBook(pb.localId); toast("Đã nối “" + pb.title + "” với file trong app — đọc và nghe ngay trong app được rồi anh. " + (lb ? driveStatusShort(lb) : ""), 5600); playDetail(gid); }
        else if (pb && added) { toast("Đã thêm file, nhưng tên sách chưa khớp với cuốn Play Sách này nên chưa tự nối được — anh thử đặt lại tên file cho giống tên sách giúp em.", 5600); playDetail(gid); }
      } else if (linkedNow && added) {
        toast("Đã tự nối " + linkedNow + " cuốn Play Sách với file có sẵn trong app.");
      }
    }
    /* ai14: TỰ CHỮA LÀNH cho sách thuộc Thư viện có sẵn — file EPUB của kệ là công khai,
       nên khi bản lưu trên máy bị mất (xoá bộ nhớ đệm, đổi máy, bản ghi sách đồng bộ sang
       máy khác mà file thì không…) thì tải lại từ URL kệ thay vì báo “Không tìm thấy file”.
       Khớp mục catalog theo thứ tự: shelfEpub ghi sẵn trên bản ghi sách -> shelfId ->
       id dạng “shelf-<mã catalog>” -> tên sách chuẩn hoá. File tải về lưu ĐÚNG khóa
       fileKeyOf(book) để lần mở sau khớp ngay từ bước đầu tiên. */
    async function shelfHealBlob(book) {
      try {
        let url = book.shelfEpub || "";
        if (!url) {
          const findInCat = () => {
            let cat = null;
            if (book.shelfId) cat = shelfCat(book.shelfId);
            if (!cat && String(book.id || "").indexOf("shelf-") === 0) cat = shelfCat(String(book.id).slice(6));
            if (!cat) { const t = normTitle(book.title || ""); if (t) cat = SHELF.books.find((b) => normTitle(b.title) === t) || null; }
            return cat;
          };
          let cat = findInCat();
          if (!cat && SHELF.status !== "ready") { try { await loadShelfCatalog(); } catch (e) {} cat = findInCat(); }
          if (cat && cat.epub) url = cat.epub;
        }
        if (!url) return null;
        const res = await fetch(url);
        if (!res.ok) return null;
        const blob = await res.blob();
        if (!blob || !blob.size) return null;
        await idb.put("files", fileKeyOf(book), blob);
        return blob;
      } catch (e) { return null; }
    }
    async function getBookBlob(book) {
      const key = fileKeyOf(book);
      let blob = await idb.get("files", key);
      if (blob) return blob;
      /* ai14: chưa thấy file local -> thử tự tải lại từ Thư viện có sẵn trước;
         chỉ khi đường này cũng thất bại mới tới Drive / thông báo lỗi như cũ. */
      blob = await shelfHealBlob(book);
      if (blob) return blob;
      if (book.driveFileId) { blob = await driveDownload(book.driveFileId); if (blob) return blob; }
      const alt = await idb.get("files", "book:" + book.id);
      if (alt) return alt;
      throw new Error("Không tìm thấy file sách trên máy này" + (S.user ? " và tải từ Drive cũng chưa được" : "") + ".");
    }
    function findBook(id) { return DB.books.find((b) => b.id === id); }

    /* ================= Menu sách / modal ================= */
    /* ---- ai13: NÚT BACK CỦA ANDROID — mỗi lớp phủ (trình đọc / popup Annie / mục lục &
       cài đặt đọc / hộp thoại / trình đọc tin) đẩy 1 trạng thái history; bấm Back vật lý thì
       ĐÓNG LỚP TRÊN CÙNG thay vì rời khỏi app. Đóng lớp bằng nút trong app thì gỡ đúng trạng
       thái lịch sử tương ứng (qua history.back() bị nuốt 1 lần) để không có Back “ma”. ---- */
    /* ai15: mỗi lớp ghi kèm MÃ ĐỊNH DANH (tok) vào chính history.state nó đẩy. Đóng lớp
       bằng nút trong app CHỈ được history.back() khi chắc chắn tuyệt đối state hiện tại
       là của chính lớp đó (lớp nằm trên cùng + tok khớp history.state); mọi trường hợp
       còn lại đóng thuần bằng DOM/state nội bộ, KHÔNG đụng vào history. Bản ai14 gọi
       back() chỉ theo số đếm lớp — khi số đếm lệch (pushState bị chặn, đóng chồng lớp,
       đóng lớp không nằm trên cùng…) là back() lùi khỏi app: bấm “Đóng sách” văng ra
       chrome://newtab mất luôn app. Nay lệch cỡ nào cũng không rời khỏi app được. */
    const HP_LAYERS = []; /* phần tử: { name, tok } — tok = 0 nghĩa là không đẩy được state */
    let HP_IGNORE_POP = 0;
    let HP_TOK_SEQ = 0;
    let HP_CLOSING = false; /* đang đóng lớp do Back vật lý: history đã lùi sẵn, cấm back() thêm */
    function hpLayerPush(name) {
      if (HP_LAYERS.length && HP_LAYERS[HP_LAYERS.length - 1].name === name) return;
      let tok = 0;
      try { tok = ++HP_TOK_SEQ; history.pushState({ hpLayer: name, hpTok: tok }, ""); }
      catch (e) { tok = 0; }
      HP_LAYERS.push({ name: name, tok: tok });
    }
    function hpLayerPop(name) {
      let i = -1;
      for (let k = HP_LAYERS.length - 1; k >= 0; k--) { if (HP_LAYERS[k].name === name) { i = k; break; } }
      if (i < 0) return;
      const entry = HP_LAYERS[i];
      const wasTop = i === HP_LAYERS.length - 1;
      HP_LAYERS.splice(i, 1);
      if (HP_CLOSING) return;
      if (!wasTop || !entry.tok) return; /* không chắc chắn tuyệt đối -> đóng thuần nội bộ */
      let cur = null;
      try { cur = history.state; } catch (e) {}
      if (!cur || cur.hpTok !== entry.tok) return;
      HP_IGNORE_POP++;
      try { history.back(); } catch (e) { HP_IGNORE_POP--; }
      /* ai20: chống kẹt cờ — nếu sau ~800ms vẫn chưa có popstate nào tiêu thụ đúng

    /* ================= Trích xuất chương: TXT / DOCX / FB2 ================= */
    function isTextFormat(f) { return f === "txt" || f === "docx" || f === "fb2" || f === "md" || f === "html"; }
    function htmlToPlain(html) { const d = document.createElement("div"); d.innerHTML = html || ""; return (d.textContent || "").replace(/\s+/g, " ").trim(); }
    function textToHtml(text) {
      return String(text || "").split(/\n{2,}/).map((p) => p.trim()).filter(Boolean)
        .map((p) => "<p>" + esc(p).replace(/\n/g, "<br/>") + "</p>").join("");
    }
    /* Tự động làm sạch định dạng (CHỈ tác động bản hiển thị, không sửa file gốc):
       bỏ số trang đứng riêng + dòng đầu/chân trang lặp (tên sách/tác giả), gộp dòng bị ngắt giữa câu,
       sửa khoảng trắng thừa trước dấu câu. */
    function cleanTextFormat(text, book) {
      const lines = String(text || "").split(/\n/);
      const titleN = normTitle(book ? book.title : ""), authorN = normTitle(book ? (book.author || "") : "");
      const freq = {};
      lines.forEach((ln) => { const t = ln.trim(); if (t && t.length <= 70) freq[t] = (freq[t] || 0) + 1; });
      const kept = [];
      lines.forEach((ln) => {
        const t = ln.trim();
        if (t) {
          if (/^\d{1,4}$/.test(t)) return;
          const tn = normTitle(t);
          if (tn && (tn === titleN || (authorN && tn === authorN))) return;
          if (t.length <= 70 && freq[t] >= 5 && !/[.!?…]$/.test(t)) return;
        }
        kept.push(ln);
      });
      const out = [];
      kept.forEach((ln) => {
        const t = ln.replace(/\s+/g, " ").trim();
        if (!t) { out.push(""); return; }
        const prev = out[out.length - 1];
        if (prev && !/[.!?…:;”"']$/.test(prev) && !/^(chương|chapter|hồi|phần|quyển|tập|mục)\b/i.test(t) && prev.length < 1200) out[out.length - 1] = prev + " " + t;
        else out.push(t);
      });
      return out.join("\n").replace(/[ \t]+([.,;:!?…])/g, "$1").replace(/\n{3,}/g, "\n\n").trim();
    }
    function displayChapterHTML(ch) {
      const st = DB.settings;
      if (st.cleanFormat && isTextFormat(R.mode) && (ch.text || ch.html)) {
        let raw = ch.text || "";
        if (ch.html) {
          const stripped = ch.html.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|h[1-6]|div|li)>/gi, "\n\n").replace(/<[^>]+>/g, "");
          const ta = document.createElement("textarea"); ta.innerHTML = stripped; raw = ta.value;
        }
        const cleaned = cleanTextFormat(raw, R.book);
        return cleaned.split(/\n{2,}/).map((p) => p.trim()).filter(Boolean).map((p) => {
          const one = p.replace(/\n/g, " ");
          if (one.length <= 90 && /^(chương|chapter|hồi|phần|quyển|tập|mục)\b/i.test(one)) return '<h3 style="font-size:1.12em;line-height:1.4;margin:1.1em 0 .5em">' + esc(one.charAt(0).toUpperCase() + one.slice(1)) + "</h3>";
          return "<p>" + esc(one) + "</p>";
        }).join("");
      }
      return ch.html || textToHtml(ch.text);
    }
    /* Chia văn bản dài thành các phần đều nhau ~15.000–20.000 ký tự, cắt ở ranh giới đoạn/câu. */
    function chunkPlainText(text, size) {
      size = size || 17000;
      const paras = String(text || "").split(/\n{2,}/);
      const out = []; let cur = "";
      const push = () => { if (cur.trim()) out.push(cur.trim()); cur = ""; };
      paras.forEach((p) => {
        p = p.trim(); if (!p) return;
        if (cur && cur.length + p.length + 2 > size) push();
        while (p.length > size * 1.4) {
          let cut = p.lastIndexOf(". ", size); if (cut < size * 0.5) cut = p.lastIndexOf(" ", size); if (cut < size * 0.5) cut = size;
          out.push((cur ? cur + "\n\n" : "") + p.slice(0, cut + 1).trim()); cur = ""; p = p.slice(cut + 1).trim();
        }
        cur = cur ? cur + "\n\n" + p : p;
      });
      push();
      return out;
    }
    function chaptersFromText(text, fallbackPrefix) {
      const lines = String(text || "").split(/\r?\n/);
      const headRe = /^(chương|chapter|hồi|phần|quyển|tập|mục)\b/i;
      const heads = [];
      lines.forEach((ln, i) => { const t = ln.trim(); if (t.length >= 3 && t.length <= 90 && headRe.test(t)) heads.push(i); });
      let chapters = [];
      if (heads.length >= 2) {
        const pre = lines.slice(0, heads[0]).join("\n").trim();
        if (pre.length > 300) chapters.push({ title: "Mở đầu", text: pre, html: textToHtml(pre) });
        heads.forEach((hi, k) => {
          const title = lines[hi].trim();
          const body = lines.slice(hi + 1, k + 1 < heads.length ? heads[k + 1] : lines.length).join("\n").trim();
          if (body.length < 30) return;
          if (body.length > 42000) chunkPlainText(body, 19000).forEach((part, j) => chapters.push({ title: title + (j ? " (tiếp " + (j + 1) + ")" : ""), text: part.replace(/\s+/g, " ").trim(), html: textToHtml(part) }));
          else chapters.push({ title, text: body.replace(/\s+/g, " ").trim(), html: textToHtml(body) });
        });
      }
      if (!chapters.length) {
        chapters = chunkPlainText(text, 17000).map((part, i) => ({ title: (fallbackPrefix || "Phần") + " " + (i + 1), text: part.replace(/\s+/g, " ").trim(), html: textToHtml(part) }));
      }
      return chapters.filter((c) => c.text && c.text.length >= 30);
    }
    async function extractTxtChapters(buf) {
      const text = decodeTxtBuffer(buf).replace(/^\uFEFF/, "");
      return chaptersFromText(text, "Phần");
    }
    function docxFallbackHtml(xmlText) {
      const doc = new DOMParser().parseFromString(xmlText, "text/xml");
      const paras = doc.getElementsByTagName("w:p");
      let html = "";
      const runText = (r) => {
        let t = ""; const ts = r.getElementsByTagName("w:t");
        for (let i = 0; i < ts.length; i++) t += ts[i].textContent;
        const rpr = r.getElementsByTagName("w:rPr")[0];
        const isB = rpr && rpr.getElementsByTagName("w:b").length && !/val="false"/.test(new XMLSerializer().serializeToString(rpr.getElementsByTagName("w:b")[0]));
        const isI = rpr && rpr.getElementsByTagName("w:i").length && !/val="false"/.test(new XMLSerializer().serializeToString(rpr.getElementsByTagName("w:i")[0]));
        t = esc(t);
        if (isB) t = "<strong>" + t + "</strong>";
        if (isI) t = "<em>" + t + "</em>";
        return t;
      };
      for (let i = 0; i < paras.length; i++) {
        const p = paras[i];
        let style = "";
        const ps = p.getElementsByTagName("w:pStyle")[0];
        if (ps) style = ps.getAttribute("w:val") || "";
        let inner = ""; const runs = p.getElementsByTagName("w:r");
        for (let j = 0; j < runs.length; j++) inner += runText(runs[j]);
        if (!inner.trim()) continue;
        if (/Heading1|heading 1/i.test(style)) html += "<h1>" + inner + "</h1>";
        else if (/Heading2|heading 2/i.test(style)) html += "<h2>" + inner + "</h2>";
        else html += "<p>" + inner + "</p>";
      }
      return html;
    }
    async function extractDocxChapters(buf) {
      let html = "";
      if (window.mammoth) {
        try { const r = await mammoth.convertToHtml({ arrayBuffer: buf.slice(0) }); html = r.value || ""; } catch (e) { html = ""; }
      }
      if (!html) {
        const zip = await assertZipBuf(buf);
        const f = zip.file("word/document.xml");
        if (!f) throw new Error("notdocx");
        html = docxFallbackHtml(await f.async("string"));
      }
      const holder = document.createElement("div"); holder.innerHTML = html;
      let chapters = []; let cur = { title: "", html: "" };
      const push = () => {
        const t = htmlToPlain(cur.html);
        if (t.length >= 30) chapters.push({ title: cur.title || ("Phần " + (chapters.length + 1)), text: t, html: cur.html });
        cur = { title: "", html: "" };
      };
      Array.from(holder.childNodes).forEach((node) => {
        const tag = node.nodeType === 1 ? node.tagName : "";
        if (tag === "H1" || tag === "H2") { push(); cur.title = (node.textContent || "").trim(); }
        else cur.html += node.nodeType === 1 ? node.outerHTML : esc(node.textContent || "");
      });
      push();
      if (!chapters.length) {
        const t = htmlToPlain(html);
        if (t.length >= 30) chapters = chunkPlainText(t, 17000).map((part, i) => ({ title: "Phần " + (i + 1), text: part, html: textToHtml(part) }));
      }
      return chapters.map((c) => c.text.length > 42000
        ? chunkPlainText(c.text, 19000).map((part, j) => ({ title: c.title + (j ? " (tiếp " + (j + 1) + ")" : ""), text: part, html: textToHtml(part) }))
        : [c]).flat();
    }
    function fb2NodeHtml(node) {
      if (node.nodeType === 3) return esc(node.textContent || "");
      if (node.nodeType !== 1) return "";
      const tag = node.tagName.toLowerCase();
      const kids = () => Array.from(node.childNodes).map(fb2NodeHtml).join("");
      if (tag === "emphasis") return "<em>" + kids() + "</em>";
      if (tag === "strong") return "<strong>" + kids() + "</strong>";
      if (tag === "a") return kids();
      if (tag === "empty-line") return "<br/>";
      if (tag === "p" || tag === "v") return "<p>" + kids() + "</p>";
      if (tag === "subtitle") return '<p style="font-weight:700">' + kids() + "</p>";
      if (tag === "image") return "";
      return kids();
    }
    async function extractFb2Chapters(buf) {
      const text = decodeXmlBuffer(buf);
      if (text.indexOf("<FictionBook") < 0) throw new Error("notfb2");
      const doc = new DOMParser().parseFromString(text, "text/xml");
      if (doc.getElementsByTagName("parsererror").length) throw new Error("badfb2");
      const body = doc.getElementsByTagName("body")[0];
      if (!body) throw new Error("nofb2body");
      const sections = [];
      const collect = (parent, depth) => {
        Array.from(parent.childNodes).forEach((n) => {
          if (n.nodeType === 1 && n.tagName.toLowerCase() === "section") { sections.push(n); if (depth < 1) collect(n, depth + 1); }
        });
      };
      collect(body, 0);
      const topSections = sections.filter((s) => { let p = s.parentNode; while (p && p !== body) { if (p.nodeType === 1 && p.tagName.toLowerCase() === "section") return false; p = p.parentNode; } return true; });
      const useSections = topSections.length ? topSections : sections;
      let chapters = [];
      const sectionToChapter = (sec, idx) => {
        let title = "";
        let html = "";
        Array.from(sec.childNodes).forEach((n) => {
          if (n.nodeType !== 1) return;
          const tag = n.tagName.toLowerCase();
          if (tag === "title" && !title) { title = (n.textContent || "").replace(/\s+/g, " ").trim(); return; }
          if (tag === "section") { html += Array.from(n.childNodes).map(fb2NodeHtml).join(""); return; }
          html += fb2NodeHtml(n);
        });
        const t = htmlToPlain(html);
        if (t.length >= 30) chapters.push({ title: title || ("Phần " + (idx + 1)), text: t, html });
      };
      if (useSections.length) useSections.forEach(sectionToChapter);
      else {
        const html = Array.from(body.childNodes).map(fb2NodeHtml).join("");
        const t = htmlToPlain(html);
        if (t.length >= 30) chapters = chunkPlainText(t, 17000).map((part, i) => ({ title: "Phần " + (i + 1), text: part, html: textToHtml(part) }));
      }
      return chapters;
    }
    async function extractTextChapters(book, buf) {
      if (book.format === "txt") return extractTxtChapters(buf);
      if (book.format === "docx") return extractDocxChapters(buf);
      if (book.format === "fb2") return extractFb2Chapters(buf);
      if (book.format === "md") return extractMdChapters(buf);
      if (book.format === "html") return extractHtmlChapters(buf);
      return [];
    }
    /* Sách từ file Markdown (xuất từ app ghi chú): tách chương theo # / ##, bóc ký hiệu markdown thừa. */
    function mdToSections(md) {
      const lines = String(md || "").replace(/\r\n?/g, "\n").split("\n");
      const sections = []; let cur = { title: "", lines: [] };
      const push = () => { const t = cur.lines.join("\n").trim(); if (t.length >= 30 || cur.title) sections.push({ title: cur.title || "Mở đầu", text: t }); };
      lines.forEach((ln) => {

        if (m) { push(); cur = { title: m[2].replace(/[*_`#]/g, "").trim(), lines: [] }; }
        else cur.lines.push(ln.replace(/^\s*[-*+]\s+/, "• ").replace(/\*\*([^*]+)\*\*/g, "$1").replace(/\*([^*]+)\*/g, "$1").replace(/`([^`]+)`/g, "$1").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1"));

    /* Sách từ file HTML: lấy chữ + tiêu đề h1/h2 thành chương, bỏ thẻ và định dạng thừa. */

      const raw = decodeTxtBuffer(buf).replace(/^\uFEFF/, "");
      const doc = new DOMParser().parseFromString(raw, "text/html");
      ["script", "style", "noscript", "iframe", "form", "nav", "header", "footer"].forEach((t) => $$(t, doc).forEach((el) => el.remove()));
      const body = doc.body; if (!body) return [];
      const sections = []; let cur = { title: (doc.title || "Mở đầu").trim(), lines: [] };
      const push = () => { const t = cur.lines.join("\n").trim(); if (t.length >= 30) sections.push({ title: cur.title || "Mở đầu", text: t }); };
      const walk = (node) => {
        (node.childNodes || []).forEach((n) => {
          if (n.nodeType === 3) { const t = (n.textContent || "").trim(); if (t) cur.lines.push(t); return; }

    /* ================= Trích xuất văn bản theo chương ================= */
    const textCache = {};
    async function extractChapters(book) {
      if (textCache[book.id]) return textCache[book.id];
      const cached = await idb.get("kv", "texts:" + book.id);
      if (cached && Array.isArray(cached) && cached.length) { textCache[book.id] = cached; return cached; }
      const blob = await getBookBlob(book);
      const buf = await blob.arrayBuffer();
      let chapters = [];
      if (book.format === "cbz") {
        throw new Error("Truyện tranh chỉ đọc bằng mắt nhé");

        if (!window.ePub) throw new Error("Chưa tải được thư viện đọc EPUB — anh kiểm tra mạng rồi mở lại.");

          } catch (e) { /* bỏ qua mục lỗi */ }

      } else if (book.format === "pdf") {
        if (!window.pdfjsLib) throw new Error("Chưa tải được thư viện đọc PDF — anh kiểm tra mạng rồi mở lại.");
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";

      textCache[book.id] = chapters;
      idb.put("kv", "texts:" + book.id, chapters.map((c) => ({ title: c.title, text: c.text, html: c.html, spineIndex: c.spineIndex, pageStart: c.pageStart })));

    }

    function updateEpubPositionUI() {

      const total = R.epubLocTotal || 0, idx = R.epubLocIdx;
      if (total > 0 && typeof idx === "number" && idx >= 0) {

    function updateReaderStatus() {

         (hàm hợp nhất idx/total từ locations). Đây là điểm phân nhánh duy nhất;

      let s = "";

        const total = R.textChapters ? R.textChapters.length : 0;

      } else if (R.mode === "cbz") {

        s = R.cbzTotal ? "Trang " + R.cbzPage + " / " + R.cbzTotal + " · " + Math.round(R.curPercent * 100) + "%" : Math.round(R.curPercent * 100) + "%";
      } else {

        s = R.pdfTotal ? "Trang " + R.pdfPage + " / " + R.pdfTotal + " · " + Math.round(R.curPercent * 100) + "%" : Math.round(R.curPercent * 100) + "%";
      }
      el.textContent = s.replace(/&[^;]+;/g, (m) => { const d = document.createElement("span"); d.innerHTML = m; return d.textContent; });

      if (sl && document.activeElement !== sl) { sl.min = "0"; sl.max = "1000"; sl.value = String(Math.round((R.curPercent || 0) * 1000)); }

    /* Kindle Time-to-Read: ước tính từ tốc độ đọc thật (ký tự/phút) đã học được. */
    function etaText() {
      const wpm = DB.settings.wpm || 0;
      if (!wpm || !R.book) return "";
      if (R.mode === "epub" && R.eBook && R.eBook.locations && R.eBook.locations.total) {
        const totalChars = R.eBook.locations.total * 1024;
        const remainBook = Math.max(0, (1 - R.curPercent) * totalChars) / wpm;
        const parts = [];
        const disp = R.pageInChapter.match(/Trang (\d+)\/(\d+)/);
        if (disp) { const remainCh = (Number(disp[2]) - Number(disp[1])) * 1024 / wpm; if (remainCh >= 1) parts.push("~" + Math.round(remainCh) + " phút hết chương"); }
        if (remainBook >= 1) parts.push("~" + (remainBook >= 90 ? (remainBook / 60).toFixed(1).replace(".0", "") + " giờ" : Math.round(remainBook) + " phút") + " hết sách");
        return parts.join(" · ");
      }
      if (isTextMode() && R.textTotal) {
        const remain = Math.max(0, (1 - R.curPercent) * R.textTotal) / wpm;
        if (remain >= 1) return "~" + (remain >= 90 ? (remain / 60).toFixed(1).replace(".0", "") + " giờ" : Math.round(remain) + " phút") + " hết sách";
        return "";
      }
      if (R.mode === "pdf" && R.pdfTotal) {
        const remainPages = R.pdfTotal - R.pdfPage;
        const secPerPage = 45;
        const mins = remainPages * secPerPage / 60;
        if (mins >= 1) return "~" + Math.round(mins) + " phút hết sách";
      }
      return "";
    }
    /* ---- PDF ---- */
    async function openPdf(buf) {
      if (!window.pdfjsLib) throw new Error("Chưa tải được thư viện đọc PDF (pdf.js) — anh kiểm tra mạng rồi mở lại sách.");
      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
      R.pdfDoc = pdf; R.pdfTotal = pdf.numPages;
      const pos = posOf(R.book.id);
      R.pdfPage = pos && pos.page ? Math.min(pdf.numPages, Math.max(1, pos.page)) : 1;
      R.pdfScrollMode = isContScroll();
      const stage = $("#r-stage");
      if (R.pdfScrollMode) {
        stage.innerHTML = '<div class="pdf-scroll" id="r-pdf-scroll"></div>';
        const wrap = $("#r-pdf-scroll");
        /* ai29: Cuộn liên tục — TẮT lớp vùng chạm phủ phía trên (nguyên nhân PDF không
           cuộn được: lớp này hứng hết thao tác chạm trước vùng cuộn). Chạm nhẹ vẫn
           bật/tắt thanh công cụ; bắt đầu cuộn thì thanh tự ẩn. */
        ["r-tap-l", "r-tap-c", "r-tap-r"].forEach((id) => { const z = document.getElementById(id); if (z) z.style.pointerEvents = "none"; });
        wrap.addEventListener("click", () => { if (Date.now() - (R._swipeAt || 0) < 300) return; if (R._moreOpen) return closeMoreMenu(); toggleReaderUI(); });
        wrap.addEventListener("scroll", () => { if (R.uiVisible) readerUiHide(); }, { passive: true });
        /* Chế độ cuộn cũng thu vừa khung: bề rộng hiển thị gán cứng theo khung trừ đệm 2 bên,
           bản vẽ nhân tỉ lệ điểm ảnh cho nét — trang không tràn/cắt mép ở mọi bề rộng. */
        const availW = Math.max(240, Math.min(wrap.clientWidth - 28, 860));
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        for (let p = 1; p <= pdf.numPages; p++) {
          const cv = document.createElement("canvas"); cv.dataset.page = p; wrap.appendChild(cv);
          const page = await pdf.getPage(p);
          const base = page.getViewport({ scale: 1 });
          const vp = page.getViewport({ scale: (availW / base.width) * dpr });
          cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
          cv.style.cssText = "display:block;width:" + availW + "px;max-width:100%;height:auto;margin:0 auto";
          await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
          cv.style.marginBottom = "14px";
        }
        wrap.addEventListener("scroll", debounce(() => {
          const cvs = $$("canvas", wrap);
          const mid = wrap.scrollTop + wrap.clientHeight / 3;
          let cur = 1;
          cvs.forEach((c) => { if (c.offsetTop <= mid) cur = Number(c.dataset.page); });
          if (cur !== R.pdfPage) { R.pdfPage = cur; R.curPercent = cur / R.pdfTotal; updateReaderStatus(); savePositionDebounced(); }
        }, 120));
        setTimeout(() => { const t = $('canvas[data-page="' + R.pdfPage + '"]', wrap); if (t) wrap.scrollTop = t.offsetTop - 12; }, 60);
        R.curPercent = R.pdfPage / R.pdfTotal;
        updateReaderStatus();
      } else {
        stage.innerHTML = '<div id="r-pdf-one" style="position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;overflow:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:' + (isPageLayout() ? "76px 24px 104px" : "16px 20px 96px") + '"></div>';
        /* ai29: TẮT lớp vùng chạm phủ trên trang PDF lật trang để ngón tay kéo cuộn
           TRỰC TIẾP trên trang (cuộn mượt trong trang cao); chạm nhẹ theo 3 vùng
           trái/giữa/phải do click ngay trên trang đảm nhiệm như sách chữ. */
        ["r-tap-l", "r-tap-c", "r-tap-r"].forEach((id) => { const z = document.getElementById(id); if (z) z.style.pointerEvents = "none"; });
        const _one = $("#r-pdf-one");
        if (_one) {
          _one.addEventListener("scroll", () => { if (R.uiVisible) readerUiHide(); }, { passive: true });
          _one.addEventListener("click", (e) => {
            if (Date.now() - (R._swipeAt || 0) < 500) return;
            if (R._pdfTopAtTouch >= 0 && Math.abs(_one.scrollTop - R._pdfTopAtTouch) > 4) return; /* vừa kéo cuộn xong — không tính là chạm */
            if (R._moreOpen) return closeMoreMenu();
            if (R.settingsOpen) return closeReaderSheet();
            const sel = window.getSelection ? String(window.getSelection() || "").trim() : "";
            if (sel) return;
            const x = e.clientX / (_one.clientWidth || window.innerWidth);
            if (x < 0.26) readerPrev(); else if (x > 0.74) readerNext(); else toggleReaderUI();
          });
        }
        await renderPdfPage(R.pdfPage);
      }
    }
    async function renderPdfPage(p) {
      const wrap = $("#r-pdf-one"); if (!wrap || !R.pdfDoc) return;
      R.pdfPage = Math.min(R.pdfTotal, Math.max(1, p));
      /* ai15: hiện số trang mới NGAY trong cùng thao tác chuyển trang, không chờ vẽ
         xong trang mới nhảy số (ai14 chậm một nhịp so với nội dung) */
      R.curPercent = R.pdfTotal ? R.pdfPage / R.pdfTotal : 0;
      updateReaderStatus();
      const page = await R.pdfDoc.getPage(R.pdfPage);
      /* ai12 (bổ sung theo ảnh máy thật): trang PDF phải THU VỪA TRỌN bề rộng khung đọc với
         lề trắng rõ 2 bên, KHÔNG cắt nội dung trang (kể cả trang bìa nhiều chữ sát mép).
         Lỗi cũ: canvas chỉ phó mặc cho max-width:100% — mà canvas là flex item nên bề rộng
         tối thiểu tự động của nó tính theo cỡ vẽ gốc (đã nhân hệ số nét), vượt qua max-width
         và tràn/cắt 2 mép. Nay GÁN CỨNG bề rộng hiển thị (CSS px) theo khung trừ đệm 2 bên,
         bản vẽ chỉ nhân thêm tỉ lệ điểm ảnh cho nét rồi thu về đúng bề rộng đó. */
      const availW = Math.max(240, Math.min(wrap.clientWidth - (isPageLayout() ? 50 : 42), isPageLayout() ? 640 : 860));
      const base = page.getViewport({ scale: 1 });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const vp = page.getViewport({ scale: (availW / base.width) * dpr });
      let cv = $("canvas", wrap);
      if (!cv) { cv = document.createElement("canvas"); wrap.appendChild(cv); }
      cv.width = Math.round(vp.width); cv.height = Math.round(vp.height);
      cv.style.cssText = "display:block;flex:none;width:" + availW + "px;max-width:100%;height:auto;box-shadow:0 8px 30px rgba(0,0,0,.3);border-radius:4px;background:#fff";
      wrap.scrollTop = 0;
      await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
      R.curPercent = R.pdfPage / R.pdfTotal;
      updateReaderStatus(); savePositionDebounced();
    }
    /* ---- Sách chữ TXT / DOCX / FB2: đọc theo chương, cuộn dọc trong chương ---- */

      R.textTotal = chapters.reduce((s, c) => s + c.text.length, 0) || 1;
      R.totalPages = chapters.length;
      const pos = posOf(R.book.id);
      let idx = 0;
      if (pos && typeof pos.chapterIdx === "number" && pos.chapterIdx < chapters.length) idx = pos.chapterIdx;
      else if (pos && typeof pos.percent === "number") idx = Math.min(chapters.length - 1, Math.floor(pos.percent * chapters.length));
      renderTextChapter(idx, pos && typeof pos.chapterFrac === "number" ? pos.chapterFrac : 0);
    }

    /* ---- Truyện tranh CBZ: từng trang ảnh, sắp theo tên tự nhiên ---- */
    async function openCbz(buf) {

      const zip = await JSZip.loadAsync(buf.slice(0));
      const names = [];
      zip.forEach((p, en) => { if (!en.dir && /\.(jpe?g|png|gif|webp)$/i.test(p) && p.indexOf("__MACOSX") < 0) names.push(p); });
      names.sort((a, b) => a.localeCompare(b, undefined, { numeric: true, sensitivity: "base" }));
      if (!names.length) throw new Error("File CBZ này không có trang ảnh nào đọc được.");
      R.cbzUrls = [];
      for (const n of names) { const b = await zip.file(n).async("blob"); R.cbzUrls.push(URL.createObjectURL(b)); }
      R.cbzTotal = names.length;
      const pos = posOf(R.book.id);
      R.cbzPage = pos && pos.page ? Math.min(R.cbzTotal, Math.max(1, pos.page)) : (pos && typeof pos.percent === "number" ? Math.min(R.cbzTotal, Math.max(1, Math.round(pos.percent * R.cbzTotal))) : 1);

    /* ================= Thư viện có sẵn =================
       Kho sách dựng sẵn đi kèm app: danh mục tải từ data/catalog.json trên cùng
       máy chủ với app; bìa và file EPUB lấy đúng URL ghi trong catalog (không tự
       ghép đường dẫn). Khách chưa đăng nhập cũng xem/đọc/nghe được. Cuốn nào đã
       mở thì file nằm trong IndexedDB (kho "files", khóa "book:<id>") để đọc
       offline, và có một bản ghi sách thường trong thư viện để dùng chung trình
       đọc + mục Nghe hiện có. */
    const SHELF_CATALOG_URL = "https://hoangphuongjts.github.io/nexus/data/catalog.json";
    const SHELF = { status: "idle", books: [] };
    const shelfLocalId = (cid) => "shelf-" + cid;
    function shelfCat(cid) { return SHELF.books.find((b) => b.id === cid) || null; }
    function fmtShelfSize(n) {
      n = Number(n) || 0;
      if (!n) return "";
      if (n >= 1024 * 1024) return (n / (1024 * 1024)).toFixed(1).replace(".", ",") + " MB";
      if (n >= 1024) return Math.round(n / 1024) + " KB";
      return n + " B";
    }
    /* Tải danh mục 1 lần rồi dùng bản cache trong máy: có cache thì hiện ngay và
       lặng lẽ kiểm tra bản mới ở nền; chưa có cache mới phải tải từ máy chủ. */
    async function fetchShelfCatalog() {
      const res = await fetch(SHELF_CATALOG_URL, { cache: "no-cache" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      if (!Array.isArray(data)) throw new Error("Danh mục sai định dạng");
      return data.filter((b) => b && b.id && b.title && b.epub);
    }
    /* ai13: loadShelfCatalog trả về PROMISE dùng chung — nơi nào cần chờ catalog tải XONG
       thật (ví dụ gợi ý sách) chỉ việc await, không phải thăm dò trạng thái theo nhịp đoán. */
    let SHELF_PROMISE = null;
    async function loadShelfCatalog(force) {
      if (SHELF.status === "ready" && !force) return;
      if (SHELF_PROMISE) return SHELF_PROMISE;
      SHELF_PROMISE = (async () => { try { await _loadShelfCatalogOnce(force); } finally { SHELF_PROMISE = null; } })();
      return SHELF_PROMISE;
    }
    async function _loadShelfCatalogOnce(force) {
      if (SHELF.status === "loading") return;
      if (SHELF.status === "ready" && !force) return;
      if (!force) {
        const cached = await idb.get("kv", "shelfCatalog:v1");
        if (cached && Array.isArray(cached.books) && cached.books.length) {
          SHELF.books = cached.books; SHELF.status = "ready";
          if (S.view === "library") render();
          fetchShelfCatalog().then((books) => {
            if (books.length && JSON.stringify(books) !== JSON.stringify(SHELF.books)) {
              SHELF.books = books;
              idb.put("kv", "shelfCatalog:v1", { at: Date.now(), books });
              if (S.view === "library") render();
            }
          }).catch(() => {});
          return;
        }
      }
      SHELF.status = "loading";
      if (S.view === "library") render();
      try {
        SHELF.books = await fetchShelfCatalog();
        SHELF.status = "ready";
        idb.put("kv", "shelfCatalog:v1", { at: Date.now(), books: SHELF.books });
      } catch (e) {
        SHELF.status = "error";
      }
      if (S.view === "library") render();
    }
    function filteredShelfBooks() {
      let list = SHELF.books.slice();
      if (S.shelfQuery) { const q = normTitle(S.shelfQuery); list = list.filter((b) => normTitle((b.title || "") + " " + (b.author || "")).includes(q)); }
      return list;
    }

    }

    function viewShelf() { return shelfSectionHTML(); }
    function bindShelfGrid() {

    async function shelfDetail(cid) {

    let shelfBusy = false;
    async function ensureShelfBook(cat) {
      const localId = shelfLocalId(cat.id);

      if (book && have) return book;
      const res = await fetch(cat.epub);
      if (!res.ok) throw new Error("Không tải được file sách (mã " + res.status + ") — anh kiểm tra mạng rồi thử lại nhé.");
      const blob = await res.blob();
      await idb.put("files", "book:" + localId, blob);

          id: localId, title: cat.title, author: cat.author || "",
          format: "epub", size: cat.size || blob.size, fileName: cat.id + ".epub", cover: cat.cover || "",
          driveFileId: "", collections: [], addedAt: Date.now(), shelf: true, shelfEpub: cat.epub,
        };

      A.voice = pickViVoice() || A.voice; // luôn chọn lại: giọng nạp muộn + tôn trọng giọng anh vừa chọn ở ô Giọng đọc
      const u = new SpeechSynthesisUtterance(A.chunks[A.chunkIdx]);
      if (A.voice && isViVoice(A.voice)) { u.voice = A.voice; u.lang = A.voice.lang || "vi-VN"; }
      else if (A.voice && chosenDeviceVoice()) { u.voice = A.voice; u.lang = "vi-VN"; }
      else { u.lang = "vi-VN"; /* không gán giọng tiếng Anh mặc định — để trình duyệt tự chọn giọng theo lang vi-VN */ }
      u.rate = A.rate;
      /* ai17: theo dõi utterance này có THẬT SỰ bắt đầu phát hay không (onstart) —
         nền cho bộ đếm lỗi + watchdog bên dưới. */
      const seq = (A._spkSeq = (A._spkSeq || 0) + 1);
      let started = false;
      u.onstart = () => { started = true; A._anyChunkOk = true; A._consecErr = 0; hidePlayerError(); };
      u.onend = () => {
        if (!A.playing || A.mode !== "device") return;
        A._consecErr = 0;
        A.chunkIdx++; saveListenPos();
        if (A.chunkIdx >= A.chunks.length) {
          if (A.stopAtChapterEnd) { A.stopAtChapterEnd = false; A.playing = false; try { speechSynthesis.cancel(); } catch (e) {} toast("Đã hết chương — app dừng nghe như đã hẹn. Chúc anh thư giãn!"); updatePlayerToggle(); return; }
          nextChapterListen();
        }
        else { speakCurrent(); updatePlayerSub(); }
      };
      /* ai17: KHÔNG nuốt lỗi im lặng nữa — đếm lỗi; lỗi ngay đoạn đầu (chưa đoạn nào
         phát được trong phiên nghe này) hoặc lỗi LIÊN TIẾP 2 lần → dừng phát sạch +
         báo rõ trong player. Lỗi “interrupted/canceled” do chính app cancel() gây ra
         khi chuyển đoạn thì bỏ qua, không tính. */
      u.onerror = (ev) => {
        if (!A.playing || A.mode !== "device") return;
        if (ev && (ev.error === "interrupted" || ev.error === "canceled")) return;
        A._consecErr = (A._consecErr || 0) + 1;
        if (!A._anyChunkOk || A._consecErr >= 2) { audiobookFailStop(); return; }
        A.chunkIdx++;
        if (A.chunkIdx < A.chunks.length) speakCurrent();
        else nextChapterListen();
      };
      try { speechSynthesis.speak(u); }
      catch (e) { audiobookFailStop(); return; }
      /* ai17: watchdog ~3 giây — bấm phát mà utterance không hề onstart và engine
         cũng không động đậy (không speaking/pending/paused) → coi như phát không
         được, đi cùng đường thông báo như lỗi ở trên. */
      setTimeout(() => {
        if (seq !== A._spkSeq || started || !A.playing || A.mode !== "device") return;
        if (!("speechSynthesis" in window)) return;
        if (!speechSynthesis.speaking && !speechSynthesis.pending && !speechSynthesis.paused) audiobookFailStop();
      }, 3000);
      updatePlayerSub();
    }
    function nextChapterListen() {
      if (A.chIdx + 1 < (A.chapters || []).length) { startDeviceListen(A.chIdx + 1, 0); }
      else { A.playing = false; toast("Đã nghe hết sách. Hay quá anh!"); updatePlayerToggle(); }
    }
    function saveListenPos() {
      const book = findBook(A.bookId); if (!book || !A.chapters) return;
      const total = A.chapters.reduce((s, c) => s + c.text.length, 0) || 1;
      let before = 0; for (let i = 0; i < A.chIdx; i++) before += A.chapters[i].text.length;
      const within = A.chunks.slice(0, A.chunkIdx).reduce((s, c) => s + c.length, 0);
      const pos = DB.positions[book.id] || (DB.positions[book.id] = {});
      pos.listen = { chapterIdx: A.chIdx, chunkIdx: A.chunkIdx, percent: (before + within) / total, updatedAt: Date.now() };
      pos.updatedAt = Date.now();
      persistDebounced("positions", 600);
    }
    /* ai13: Media Session cho trình phát Audiobook chính — metadata tên sách/chương +
       handlers play/pause/seekbackward/seekforward (+ chuyển chương) cho tai nghe/màn hình khoá. */
    function listenMediaSession() {
      try {
        if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined") return;
        const book = findBook(A.bookId);
        const ch = A.chapters && A.chapters[A.chIdx];
        navigator.mediaSession.metadata = new MediaMetadata({
          title: ch ? ch.title : (book ? book.title : "Audiobook"),
          artist: book ? (book.author || "") : "",
          album: book ? book.title : "Nexus AI Books",
        });
        const click = (id) => { const el = document.getElementById(id); if (el) el.click(); };
        navigator.mediaSession.setActionHandler("play", () => click("pb-toggle"));
        navigator.mediaSession.setActionHandler("pause", () => click("pb-toggle"));
        navigator.mediaSession.setActionHandler("seekbackward", () => click("pb-prev-sent"));
        navigator.mediaSession.setActionHandler("seekforward", () => click("pb-next-sent"));
        navigator.mediaSession.setActionHandler("previoustrack", () => click("pb-prev-ch"));

    /* Dòng trạng thái nghe rảnh tay: tốc độ đọc + hẹn giờ tắt đang chọn, luôn nhìn thấy trong khung nghe. */

      const t = $("#pb-toggle");

    function setSleepTimer(v) {

    async function makePodcastEpisode(chIdx) {
      const book = findBook(A.bookId); if (!book || !A.chapters) return;
      const keys = loadKeys();
      if (!keys.openai) { toast("Anh dán khóa OpenAI trong mục Cài đặt trước đã nhé."); return; }
      const ch = A.chapters[chIdx];
      A.generating = book.id + ":" + chIdx; renderChapterList(book, A.chapters, A.chIdx);
      try {
        const text = ch.text;
        const pieces = splitChunks(text, 3500); // mỗi đoạn ≤3.500 ký tự (giới hạn OpenAI TTS), gọi tuần tự rồi ghép MP3
        const blobs = [];
        for (const piece of pieces) {
          const res = await fetch("https://api.openai.com/v1/audio/speech", {
            method: "POST", headers: { Authorization: "Bearer " + keys.openai, "Content-Type": "application/json" },
            body: JSON.stringify({ model: "tts-1", voice: "alloy", input: piece, response_format: "mp3" }),
          });
          if (!res.ok) throw new Error("OpenAI TTS lỗi " + res.status);
          blobs.push(await res.blob());
        }
        const mp3 = new Blob(blobs, { type: "audio/mpeg" });
        const ep = { id: uid(), bookId: book.id, chapterIdx: chIdx, chapterTitle: ch.title, createdAt: Date.now(), size: mp3.size, driveFileId: "", localKey: "" };
        if (S.user) {
          if (!hasScope(DRIVE_SCOPE)) { reassureScope(); try { await requestScopes(DRIVE_SCOPE, true); } catch (e) {} }
          try { ep.driveFileId = await driveUpload(book.title + " - " + ch.title + ".mp3", mp3, "audio/mpeg"); idb.put("files", "drive:" + ep.driveFileId, mp3); }
          catch (e) { ep.localKey = "ep:" + ep.id; await idb.put("files", ep.localKey, mp3); }
        } else { ep.localKey = "ep:" + ep.id; await idb.put("files", ep.localKey, mp3); }
        DB.episodes = DB.episodes.filter((e) => !(e.bookId === book.id && e.chapterIdx === chIdx));
        DB.episodes.push(ep); persist("episodes");
        toast("Đã tạo file podcast cho “" + ch.title + "” (" + pieces.length + " đoạn ghép thành 1 file).");
      } catch (e) { toast("Tạo file podcast chưa thành công: " + ((e && e.message) || e), 5000); }

    }

    const PROVIDERS = {

    /* ---- Lệnh điều khiển bằng tiếng Việt trong khung chat ---- */
    function stripVi(s) { return String(s || "").normalize("NFC").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/đ/g, "d").replace(/Đ/g, "d"); }
    function findBookMentioned(q) {
      const nq = " " + stripVi(q) + " ";
      let best = null, bestLen = 0;
      DB.books.forEach((b) => {
        const t = stripVi(b.title).trim();
        if (t && nq.indexOf(t) >= 0 && t.length > bestLen) { best = b; bestLen = t.length; }
      });
      return best;

    function resolveCommandBook(q) {

    function detectCommand(q) {

    function aiCacheLoad() { try { return JSON.parse(localStorage.getItem(AI_CACHE_KEY) || "{}"); } catch (e) { return {}; } }
    function aiCacheGet(fp) { if (!fp) return null; const c = aiCacheLoad(); const hit = c[fp]; return hit && hit.text ? hit : null; }

    /* ---- Streaming SSE cho cả 3 hãng, gọi thẳng từ trình duyệt bằng khóa của người dùng ---- */
    async function readSSE(res, onEvent) {
      const reader = res.body.getReader();
      const dec = new TextDecoder();
      let buf = "";
      for (;;) {
        const r = await reader.read();
        if (r.done) break;
        buf += dec.decode(r.value, { stream: true });
        let idx;
        while ((idx = buf.indexOf("\n")) >= 0) {
          const line = buf.slice(0, idx).trim(); buf = buf.slice(idx + 1);
          if (line.indexOf("data:") === 0) onEvent(line.slice(5).trim());
        }
      }
    }
    /* ---- ai14: MỐC THỜI GIAN CỨNG cho mọi lần gọi AI ----
       Trước ai14, streamProvider/streamRelay dùng thẳng signal được truyền vào (thường
       là undefined) nên một kết nối đứng yên = treo vĩnh viễn (vụ “sắp xếp thư viện”
       đứng ở “Đang quét…” hơn 10 phút). Nay mỗi lần gọi được bọc 1 AbortController
       riêng: quá 45 giây thì tự hủy với lỗi TimeoutError (không phải AbortError nên
       aiAskLLM coi là lỗi hãng và tự chuyển hãng khác như lỗi thường); signal của
       người dùng (nút Dừng) vẫn được chuyển tiếp nguyên vẹn. */
    const AI_CALL_TIMEOUT_MS = 45000;
    function aiTimeoutSignal(parentSignal, ms) {
      const ctrl = new AbortController();
      const limit = ms || AI_CALL_TIMEOUT_MS;
      /* ai28: ghi lại RIÊNG việc mốc chờ đã nổ (timedOut) thay vì chỉ trông vào tên lỗi:
         trên iOS/WebKit, fetch bị abort bằng lý do tự đặt vẫn thường văng ra lỗi tên
         “AbortError” — nếu chỉ nhìn tên lỗi thì hết giờ bị hiểu nhầm là anh bấm Dừng. */
      let timedOut = false;
      if (parentSignal) {
        if (parentSignal.aborted) { try { ctrl.abort(); } catch (e) {} }
        else if (parentSignal.addEventListener) parentSignal.addEventListener("abort", () => { try { ctrl.abort(); } catch (e) {} }, { once: true });
      }
      const timer = setTimeout(() => {
        timedOut = true;
        const err = new Error("AI quá lâu không trả lời (quá " + Math.round(limit / 1000) + " giây) — em đã tự ngắt lần gọi này.");
        err.name = "TimeoutError";
        try { ctrl.abort(err); } catch (e) { try { ctrl.abort(); } catch (e2) {} }
      }, limit);
      return { signal: ctrl.signal, clear: () => clearTimeout(timer), timedOut: () => timedOut, limitMs: limit };
    }
    /* ai28: nếu mốc chờ đã nổ thì LUÔN ném lại đúng lỗi TimeoutError, bất kể fetch
       văng ra tên lỗi gì — hết giờ là lỗi “AI bận/chậm”, không bao giờ là “đã dừng”. */
    function aiRethrowTimeout(_to, e) {
      if (_to.timedOut()) {
        const err = new Error("AI quá lâu không trả lời (quá " + Math.round(_to.limitMs / 1000) + " giây) — em đã tự ngắt lần gọi này.");
        err.name = "TimeoutError";
        throw err;
      }
      throw e;
    }
    async function streamProvider(p, key, system, msgs, tier, onDelta, signal) {
      const _to = aiTimeoutSignal(signal);
      try { return await streamProviderCall(p, key, system, msgs, tier, onDelta, _to.signal); }
      catch (e) { aiRethrowTimeout(_to, e); }
      finally { _to.clear(); }
    }
    async function streamProviderCall(p, key, system, msgs, tier, onDelta, signal) {
      const model = (AI_MODELS[p] || {})[tier] || (AI_MODELS[p] || {}).light;
      let full = "";
      const emit = (d) => { if (d) { full += d; onDelta(full); } };
      if (p === "claude") {
        const res = await fetch("https://api.anthropic.com/v1/messages", {
          method: "POST", signal: signal,
          headers: { "x-api-key": key, "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true", "content-type": "application/json" },
          body: JSON.stringify({ model: model, max_tokens: 2200, stream: true, system: system || undefined, messages: msgs.map((m) => ({ role: m.role === "assistant" ? "assistant" : "user", content: m.content })) }),
        });
        if (!res.ok || !res.body) throw new Error("Claude lỗi " + res.status);
        await readSSE(res, (data) => { try { const j = JSON.parse(data); if (j.type === "content_block_delta" && j.delta && j.delta.text) emit(j.delta.text); } catch (e) {} });
      } else if (p === "gemini") {
        const res = await fetch("https://generativelanguage.googleapis.com/v1beta/models/" + model + ":streamGenerateContent?alt=sse", {
          method: "POST", signal: signal, headers: { "content-type": "application/json", "x-goog-api-key": key },
          body: JSON.stringify({
            system_instruction: system ? { parts: [{ text: system }] } : undefined,
            contents: msgs.map((m) => ({ role: m.role === "assistant" ? "model" : "user", parts: [{ text: m.content }] })),
          }),
        });
        if (!res.ok || !res.body) throw new Error("Gemini lỗi " + res.status);
        await readSSE(res, (data) => { try { const j = JSON.parse(data); const parts = (((j.candidates || [])[0] || {}).content || {}).parts || []; parts.forEach((pt) => emit(pt.text || "")); } catch (e) {} });
      } else if (p === "openai" || p === "groq") {
        const res = await fetch(p === "groq" ? "https://api.groq.com/openai/v1/chat/completions" : "https://api.openai.com/v1/chat/completions", {
          method: "POST", signal: signal, headers: { Authorization: "Bearer " + key, "content-type": "application/json" },
          body: JSON.stringify({ model: model, stream: true, max_tokens: 2200, messages: (system ? [{ role: "system", content: system }] : []).concat(msgs) }),
        });
        if (!res.ok || !res.body) throw new Error((p === "groq" ? "Groq" : "ChatGPT") + " lỗi " + res.status);
        await readSSE(res, (data) => { if (data === "[DONE]") return; try { const j = JSON.parse(data); const d = (((j.choices || [])[0] || {}).delta || {}).content; if (d) emit(d); } catch (e) {} });
      }
      return full.trim();
    }
    /* ================= AI DÙNG CHUNG (bản ai7) =================

    const RELAY_BASE = "https://nexus-relay-pi.vercel.app";

    function relaySignedIn() { return !!(S.user && typeof S.user.getIdToken === "function"); }

    /* Dịch mã lỗi của AI dùng chung sang tiếng Việt dễ hiểu — không lộ chi tiết kỹ thuật cho người dùng phổ thông. */
    function relayErrorMessage(code, status) {
      if (code === "not_allowed") return "Tài khoản của bạn chưa được chủ ứng dụng cấp phép dùng AI dùng chung.";
      if (code === "disabled") return "Tính năng AI dùng chung đang tạm tắt.";
      if (code === "daily_limit" || status === 429) return "Hôm nay tài khoản đã dùng hết lượt AI dùng chung, mai quay lại nhé.";
      return "AI dùng chung đang bận hoặc chưa sẵn sàng — anh thử lại sau ít phút nhé.";
    }
    async function streamRelay(system, msgs, tier, onDelta, signal) {
      /* ai14: không được truyền signal riêng thì vẫn dùng signal mặc định kèm mốc 45 giây */
      const _to = aiTimeoutSignal(signal);
      try { return await streamRelayCall(system, msgs, tier, onDelta, _to.signal); }
      catch (e) { aiRethrowTimeout(_to, e); }
      finally { _to.clear(); }
    }
    async function streamRelayCall(system, msgs, tier, onDelta, signal) {
      const token = await relayToken();
      if (!token) { const e = new Error("nokey"); e.noKey = true; throw e; }
      const messages = (system ? [{ role: "system", content: system }] : []).concat(msgs || []);
      const res = await fetch(RELAY_BASE + "/api/chat", {
        method: "POST", signal: signal,
        headers: { Authorization: "Bearer " + token, "content-type": "application/json" },
        body: JSON.stringify({ messages: messages, mode: tier === "strong" ? "deep" : "light" }),
      });
      if (!res.ok || !res.body) {
        let code = "";
        try { const j = await res.json(); if (j && j.error) code = String(j.error); } catch (e) {}
        const err = new Error(relayErrorMessage(code, res.status));
        err.relay = true; err.relayCode = code;
        throw err;
      }
      let full = "";
      await readSSE(res, (data) => {
        if (data === "[DONE]") return;
        try { const j = JSON.parse(data); if (j && j.t) { full += j.t; onDelta(full); } } catch (e) {}
      });
      return full.trim();
    }

       onSwitch(fromName, toName) để khung chat báo nhỏ; ném lỗi {noKey:true} / {webOnly:p} cho UI xử lý riêng. */
    async function aiAskLLM(opts) {
      /* ai28: “anh bấm Dừng” chỉ đúng khi nơi gọi truyền isUserStop và cờ đang bật.
         Mọi AbortError còn lại là lỗi kết nối/hủy nội bộ — xử lý như lỗi hãng thường. */
      const userStopped = () => { try { return !!(opts.isUserStop && opts.isUserStop()); } catch (e) { return false; } };
      const keys = loadKeys();
      const sel = S.aiProviderSel || "auto";
      const chosen = opts.provider || (sel !== "auto" && PROVIDERS[sel] ? sel : routeAI(opts.question || ""));
      if (PROVIDERS[chosen] && PROVIDERS[chosen].webOnly) { const e = new Error("webonly"); e.webOnly = chosen; throw e; }
      /* Tự động: ưu tiên Gemini (khóa miễn phí chính) -> Groq (dự phòng rất nhanh) -> Claude -> ChatGPT.
         Chọn tay 1 hãng thì hãng đó đứng đầu, lỗi/model không tồn tại thì tự lùi xuống các hãng còn lại. */
      const AUTO_ORDER = ["gemini", "groq", "claude", "openai"];
      let order = AUTO_ORDER.filter((p) => keys[p]);
      if (chosen && PROVIDERS[chosen] && !PROVIDERS[chosen].webOnly && keys[chosen]) order = [chosen].concat(order.filter((p) => p !== chosen));
      if (!order.length) {
        /* Không có khóa riêng nào: đã đăng nhập Google -> dùng AI dùng chung (streaming như bình thường).
           Chưa đăng nhập -> giữ hành vi cũ (thẻ gợi ý dán khóa). */
        if (relaySignedIn()) {
          let got = "";
          try {
            const text = await streamRelay(opts.system, opts.messages, opts.tier || "light", (partial) => { got = partial; if (opts.onDelta) opts.onDelta(partial, "shared"); }, opts.signal);
            if (text) return { text: text, by: "shared", switched: false, from: null };
            const err = new Error(relayErrorMessage("", 0)); err.relay = true; throw err;
          } catch (e) {
            if (e && e.name === "AbortError") {
              /* ai28: có chữ dở dang thì trả phần đó; chỉ gắn cờ aborted khi ĐÚNG anh bấm Dừng.
                 Không phải anh dừng mà cũng không có chữ nào -> lỗi kết nối thật của AI dùng chung. */
              if (got) return { text: got, by: "shared", aborted: userStopped() };
              if (userStopped()) throw e;
              const ne = new Error("Kết nối tới AI dùng chung bị ngắt giữa chừng — anh thử lại giúp em nhé."); ne.relay = true; throw ne;
            }
            if (got) return { text: got, by: "shared" };
            throw e;
          }
        }
        const e = new Error("nokey"); e.noKey = true; throw e;
      }
      let lastErr = null;
      for (let i = 0; i < order.length; i++) {
        const p = order[i];
        let got = "";
        try {
          const text = await streamProvider(p, keys[p], opts.system, opts.messages, opts.tier || "light", (partial) => { got = partial; if (opts.onDelta) opts.onDelta(partial, p); }, opts.signal);
          if (text) return { text: text, by: p, switched: i > 0, from: order[0] };
          throw new Error(PROVIDERS[p].name + " trả về rỗng");
        } catch (e) {
          if (e && e.name === "AbortError" && !userStopped()) {
            /* ai28: KHÔNG phải anh bấm Dừng (kết nối bị ngắt / hủy nội bộ / hãng đóng stream):
               có chữ dở dang thì trả phần đó như câu trả lời thường; chưa có chữ thì coi là
               lỗi của hãng này để tự chuyển hãng khác — tuyệt đối không ném lên thành “đã dừng”. */
            if (got) return { text: got, by: p, switched: i > 0, from: order[0] };
            lastErr = new Error(PROVIDERS[p].name + " bị ngắt kết nối giữa chừng");
            if (i + 1 < order.length && opts.onSwitch) opts.onSwitch(PROVIDERS[p].name, PROVIDERS[order[i + 1]].name);
            continue;
          }
          if (e && e.name === "AbortError") { if (got) return { text: got, by: p, aborted: true, switched: i > 0, from: order[0] }; throw e; }
          lastErr = e;
          if (got) return { text: got, by: p, switched: i > 0, from: order[0] };
          if (i + 1 < order.length && opts.onSwitch) opts.onSwitch(PROVIDERS[p].name, PROVIDERS[order[i + 1]].name);
        }
      }
      throw lastErr || new Error("AI chưa trả lời được lúc này");
    }

    function mdLite(text) {

      const closeList = () => { if (inList) { h += "</ul>"; inList = false; } };
      lines.forEach((ln) => {
        const t = ln.trim();
        const bolded = esc(t).replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
        if (/^[•\-\*]\s+/.test(t)) {
          if (!inList) { h += '<ul class="bl-list">'; inList = true; }
          h += "<li>" + bolded.replace(/^[•\-\*]\s+/, "") + "</li>";
        } else { closeList(); if (t) h += '<div class="bl">' + bolded + "</div>"; }
      });
      closeList();
      return h || '<div class="bl"></div>';

            method: "POST", headers: { "content-type": "application/json", "x-goog-api-key": key },

    function isNewsIntent(q) { return /tin (mới|tức|nóng)|có tin gì|tin hôm nay|thời sự|chủ đề nóng|đọc báo|tin về|tin tức về/i.test(q || ""); }

    /* ---- Tìm trong tủ sách theo chủ đề (khớp tên / tác giả / mô tả Play Sách) ---- */
    function libSearchTopic(topic, max) {
      const words = stripVi(topic).split(/[^a-z0-9]+/).filter((w) => w.length >= 3 && ["sach", "cuon", "tim", "hieu", "giup", "ve", "cua", "cho", "toi"].indexOf(w) < 0);
      const scored = [];
      DB.books.forEach((b) => {
        const hay = stripVi(b.title + " " + (b.author || ""));
        let s = 0; words.forEach((w) => { if (hay.indexOf(w) >= 0) s += w.length; });
        if (s > 0) scored.push({ b: b, s: s });
      });
      Object.values(DB.playBooks || {}).forEach((pb) => {
        const hay = stripVi(pb.title + " " + (pb.author || "") + " " + (pb.description || ""));
        let s = 0; words.forEach((w) => { if (hay.indexOf(w) >= 0) s += w.length; });
        if (s > 0 && !scored.find((x) => x.b.id === pb.localId)) scored.push({ b: { id: pb.localId || "", title: pb.title, author: pb.author, cover: pb.coverUrl }, s: s, playOnly: !pb.localId });
      });
      return scored.sort((a, b) => b.s - a.s).slice(0, max || 4).map((x) => ({ title: x.b.title, author: x.b.author, cover: x.b.cover, libId: x.playOnly ? "" : x.b.id, reason: x.playOnly ? "Có trên Play Sách của anh — mở mục Play Sách để lấy file về đọc trong app" : "" }));
    }
    /* ================= Tìm sách diện rộng: Google Books + Open Library + Gutendex ================= */
    async function searchGBFull(q, max) {

      if (!res.ok) throw new Error("Google Books lỗi " + res.status);
      const data = await res.json();
      return (data.items || []).map((v) => {
        const info = v.volumeInfo || {}, sale = v.saleInfo || {}, acc = v.accessInfo || {};
        const thumb = (info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)) || "";
        const card = { title: info.title || "Sách không tên", author: (info.authors || []).join(", "), year: (info.publishedDate || "").slice(0, 4), cover: thumb.replace(/^http:\/\//, "https://"), desc: String(info.description || "").replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 300), buy: [], free: null, dl: [], src: "gb" };
        if (sale.saleability === "FOR_SALE" && sale.buyLink) card.buy.push({ label: "Mua trên Google Play Sách", url: sale.buyLink });
        if (acc.viewability === "ALL_PAGES") {
          card.free = { label: "Đọc trên Google Books", url: info.infoLink || "" };
          const dl = (acc.epub && acc.epub.downloadLink) || (acc.pdf && acc.pdf.downloadLink);
          if (dl) card.dl.push({ label: (acc.epub && acc.epub.downloadLink) ? "EPUB" : "PDF", url: dl });
        }
        return card;
      });
    }
    async function searchOpenLibrary(q, max) {

        else if (ia && d.ebook_access === "borrowable") card.buy.push({ label: "Mượn ở Internet Archive", url: "https://archive.org/details/" + ia });

    async function searchGutendex(q, max) {
      const res = await fetch("https://gutendex.com/books?search=" + encodeURIComponent(q));

    function mergeBookCards(lists) {
      const out = []; const seen = {};
      lists.forEach((list) => (list || []).forEach((c) => {
        const key = normTitle(c.title) + "|" + normTitle((c.author || "").split(",")[0]);
        if (seen[key]) {
          const o = seen[key];
          if (!o.cover && c.cover) o.cover = c.cover;
          if (!o.desc && c.desc) o.desc = c.desc;
          if (!o.free && c.free) o.free = c.free;
          (c.buy || []).forEach((b) => { if (!o.buy.find((x) => x.url === b.url)) o.buy.push(b); });
          (c.dl || []).forEach((d) => { if (!o.dl.find((x) => x.url === d.url)) o.dl.push(d); });
          if (c.pub) o.pub = true;
        } else { seen[key] = c; out.push(c); }
      }));

          const res = await aiAskLLM({ question: "tóm tắt tin", tier: "light", system: "Bạn tóm tắt tin tức tiếng Việt thành đúng 3 ý chính, mỗi ý một dòng bắt đầu bằng “• ”, ngắn gọn, trung lập.", messages: [{ role: "user", content: "Tóm tắt bài báo sau thành 3 ý:\n" + (fullText || n.title).slice(0, 5000) }] });

          const box2 = nrEl("div"); box2.style.cssText = "background:#fff8e7;border:1px solid #e4d6ba;border-radius:14px;padding:13px 15px;margin-top:14px";

      });
      try {
        const r = await fetch("https://api.allorigins.win/raw?url=" + encodeURIComponent(n.link));
        if (!r.ok) throw new Error("fetch fail");
        const html = await r.text();
        const doc = new DOMParser().parseFromString(html, "text/html");
        ["script", "style", "noscript", "iframe", "form", "nav", "header", "footer", "aside"].forEach((t) => $$(t, doc).forEach((el) => el.remove()));
        const art = doc.querySelector("article") || doc.body;
        let best = null, bestLen = 0;
        $$("div, section, article", doc).forEach((el) => { const t = (el.textContent || "").trim().length; if (t > bestLen && el.querySelectorAll("p").length >= 3) { best = el; bestLen = t; } });
        const src = best || art;
        const nodes = [];
        $$("p, h2, h3, img", src).forEach((el) => {
          if (el.tagName === "IMG") { const s = el.getAttribute("src"); if (s && /^https:\/\//i.test(s)) nodes.push({ img: s }); }
          else { const t = (el.textContent || "").replace(/\s+/g, " ").trim(); if (t.length > 25) nodes.push({ text: t }); }
        });
        if (nodes.length < 2) throw new Error("ít nội dung");
        bodyEl.textContent = "";
        nodes.slice(0, 60).forEach((nd) => {
          if (nd.img) { const im = document.createElement("img"); im.src = nd.img; im.alt = ""; im.loading = "lazy"; im.referrerPolicy = "no-referrer"; bodyEl.appendChild(im); }
          else bodyEl.appendChild(nrEl("p", null, nd.text));
        });
        fullText = nodes.map((nd) => nd.text || "").join(" ").slice(0, 9000);
      } catch (e) {
        bodyEl.textContent = "";
        bodyEl.appendChild(nrEl("p", null, n.desc || ""));
        bodyEl.appendChild(nrEl("p", null, "Chưa lấy được toàn văn trong app (trang báo chặn đọc ngoài) — anh bấm “Mở link gốc” ở trên để đọc bản đầy đủ nhé."));
        fullText = n.desc || n.title;
      }
    }

    async function getSuggestions() {
      const box = $("#suggest-box"); if (box) box.innerHTML = '<div style="display:flex;gap:10px;align-items:center;color:var(--dim);font-size:13.5px"><div class="spinner" style="width:22px;height:22px"></div>Đang nhờ Annie gợi ý…</div>';
      /* Tủ riêng ít hơn 3 cuốn (tài khoản mới): lấy thêm dữ kiện từ Thư viện có sẵn để gợi ý không trống */
      if (DB.books.length < 3 && SHELF.status !== "ready") {
        try { await loadShelfCatalog(); } catch (e) {}
        for (let w = 0; w < 10 && SHELF.status === "loading"; w++) await new Promise((r) => setTimeout(r, 300));
      }
      const shelfSeed = (DB.books.length < 3 && SHELF.status === "ready") ? SHELF.books.slice(0, 12) : [];
      const titles = DB.books.slice(0, 12).map((b) => b.title).concat(shelfSeed.map((b) => b.title)).join("; ");
      const keys = loadKeys();
      let queries = [];
      const prompt = "Dựa trên thư viện sách hiện có (" + (titles || "chưa có sách nào") + "), hãy gợi ý 6 cuốn sách hay nên đọc tiếp. Chỉ trả về danh sách mỗi dòng một tên sách kèm tác giả, không giải thích.";
      const order = ["gemini", "groq", "claude", "openai"];
      for (const p of order) {
        if (!keys[p]) continue;
        try {
          const text = await AI_CALLERS[p](keys[p], prompt);
          queries = text.split("\n").map((l) => l.replace(/^[\d\-\.\)\s•]+/, "").trim()).filter((l) => l.length > 2).slice(0, 6);
          if (queries.length) break;
        } catch (e) {}
      }
      if (!queries.length) queries = [titles ? ((DB.books[0] || shelfSeed[0] || {}).author || (DB.books[0] || shelfSeed[0] || {}).title || "sách hay nên đọc") : "sách hay nên đọc", "sách phát triển bản thân hay", "sách kinh doanh hay"];
      /* Chưa có khóa AI riêng (người được mời): dùng luôn tên sách trong Thư viện có sẵn làm truy vấn
         để kết quả gợi ý luôn có sách thật kèm bìa, không bao giờ trống. */
      if (!aiHasAnyKey() && shelfSeed.length) queries = shelfSeed.slice(0, 6).map((b) => b.title + (b.author ? " " + b.author : ""));
      const results = [];
      for (const qq of queries.slice(0, 6)) {
        try { const r = await searchGoogleBooks(qq, 1); if (r[0] && !results.find((x) => x.googleId === r[0].googleId)) results.push(r[0]); } catch (e) {}
      }
      S.suggestions = results;
      const b2 = $("#suggest-box"); if (b2) b2.innerHTML = suggestionsHTML(results);
    }

    function exportNotes(bookId) {
      const b = findBook(bookId); if (!b) return;
      const lines = ["SỔ TAY TRÍCH DẪN — " + b.title, "Tác giả: " + (b.author || ""), "Xuất ngày: " + new Date().toLocaleString("vi-VN"), ""];
      (DB.highlights[bookId] || []).forEach((x) => lines.push("[Gạch chân] “" + x.text + "”"));
      (DB.notes[bookId] || []).forEach((x) => { if (x.quote) lines.push("[Trích] “" + x.quote + "”"); lines.push("[Ghi chú] " + x.text); });
      (DB.bookmarks[bookId] || []).forEach((x) => lines.push("[Đánh dấu] " + x.label));
      const blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
      const a = document.createElement("a");

      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    }

    function viNumWords(n) {

      const U = ["không", "một", "hai", "ba", "bốn", "năm", "sáu", "bảy", "tám", "chín"];
      if (n < 10) return U[n];

        const ch = Math.floor(x / 10), dv = x % 10;
        let s = (ch === 1 ? "mười" : U[ch] + " mươi");
        if (dv === 0) return s;
        if (dv === 1) return s + (ch === 1 ? " một" : " mốt");
        if (dv === 5) return s + " lăm";
        return s + " " + U[dv];
      };
      const three = (x, full) => {
        const tr = Math.floor(x / 100), rest = x % 100;
        let s = "";

        else if (full) s = "không trăm";
        if (rest === 0) return s;
        if (rest < 10) return s + " lẻ " + U[rest];
        return (s ? s + " " : "") + two(rest, full);

      if (n < 1000) return three(n, true);
      if (n < 1000000) { const ng = Math.floor(n / 1000), rest = n % 1000; return three(ng, true) + " nghìn" + (rest ? " " + three(rest, true) : ""); }
