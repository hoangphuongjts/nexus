       (sau dấu hai chấm, trong ngoặc kép, hoặc sau “sang <ngôn ngữ>”). Trả { text, lang } hoặc null.
       Nếu câu lệnh nhắc rõ tới một CUỐN SÁCH / chương sách -> null để luồng dịch sách xử lý. */
    function detectSentenceTranslate(q) {
      const raw = String(q || "").trim();
      const s = stripVi(raw);
      if (!/(^|\s)dich(\s|$)/.test(" " + s + " ")) return null;
      if (/dich (hay|co hay|tot)|ban dich/.test(s)) return null;
      const langMap = [["tieng trung", "zh"], ["trung", "zh"], ["tieng anh", "en"], ["anh", "en"], ["english", "en"], ["tieng nhat", "ja"], ["nhat", "ja"], ["tieng han", "ko"], ["han quoc", "ko"], ["tieng phap", "fr"], ["phap", "fr"], ["tieng duc", "de"], ["duc", "de"], ["tay ban nha", "es"], ["tieng nga", "ru"], ["nga", "ru"], ["tieng thai", "th"], ["thai", "th"], ["tieng viet", "vi"], ["viet", "vi"]];
      let lang = "";
      langMap.forEach(([k, v]) => { if (!lang && new RegExp("(sang|to)\\s+" + k + "\\b").test(s)) lang = v; });
      let payload = "";
      const ci = raw.search(/[:：]/);
      if (ci > 0 && stripVi(raw.slice(0, ci)).indexOf("dich") >= 0) payload = raw.slice(ci + 1).trim();
      if (!payload) { const qm = raw.match(/[“"]([^”"]{2,})[”"]/); if (qm) payload = qm[1].trim(); }
      if (!payload) {
        const m2 = raw.match(/sang\s+(?:tiếng\s+)?(?:Anh|Trung|Nhật|Hàn|Pháp|Đức|Nga|Thái|Việt|English)\s+(.+)$/i);
        if (m2 && m2[1] && m2[1].trim().length >= 8) payload = m2[1].trim();
      }
      if (!payload || payload.length < 2) return null;
      /* Payload chính là chỉ dẫn sách (“chương 3”, “cuốn này”...) hoặc nhắc tên sách -> không phải dịch câu */
      if (/^(chương|cuốn|sách|trang|phần)\b/i.test(payload)) return null;
      if (/\b(cuon nay|sach nay|chuong nay|chuong \d+|trang \d+)\b/.test(stripVi(payload))) return null;
      if (findBookMentioned(raw)) return null;
      if (!lang) lang = detectLang(payload) === "vi" ? "en" : "vi";
      return { text: payload, lang: lang };
    }

    async function playPodcastLines() {

      const mark = () => { $$(".pod-line").forEach((el, i) => el.classList.toggle("on", i === POD.idx)); const el = document.getElementById("pod-line-" + POD.idx); if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); };

        if (my !== POD.token || !POD.playing) return;
        const line = POD.lines[POD.idx];
        mark();

          if (src === "device") {
            await new Promise((resolve) => {

              const u = new SpeechSynthesisUtterance(speakPrep(line.text));
              const viAll = allDeviceVoices().filter(isViVoice);
              const v = line.who === 1 ? pickViVoice() : (viAll[1] || pickViVoice());

            const blob = await ttsFetchAudio(line.text, line.who === 1 ? 1 : 2, src);
            if (my !== POD.token) return;
            if (POD.url) URL.revokeObjectURL(POD.url);
            POD.url = URL.createObjectURL(blob);
            POD.audio = new Audio(POD.url);
            await new Promise((resolve) => { POD.audio.onended = resolve; POD.audio.onerror = resolve; POD.audio.play().catch(resolve); });
          }
        } catch (e) { /* bỏ qua lượt lỗi, phát tiếp */ }
        POD.idx++;

    /* ai15: tải 1 địa chỉ với MỐC CHỜ RIÊNG ~20 giây (AbortController) — hết giờ coi như
       lần thử đó hỏng, chuyển ngay sang đường dự phòng; không còn lần fetch nào treo
       60–90 giây rồi kết thúc im lặng như ai14. */
    async function fetchBlob20s(u) {
      let ctrl = null, timer = null;
      try {
        ctrl = new AbortController();
        timer = setTimeout(() => { try { ctrl.abort(); } catch (e) {} }, 20000);
        const r = await fetch(u, { signal: ctrl.signal });
        if (!r.ok) return null;
        const b = await r.blob();
        return b && b.size ? b : null;
      } catch (e) { return null; }
      finally { if (timer) clearTimeout(timer); }
    }

        ["health fitness medical medicine nutrition diet wellness", "Sức khỏe"],

        ["fiction literature novel novels poetry drama literary", "Văn học & Tiểu thuyết"],
      ];
      for (const [keys, g] of rules) { if (keys.split(" ").some((k) => t.includes(" " + k) || t.includes(k))) return g; }

    function estReadMinutes(b) {

        const id = shelf.slice(6); const p = pctOf(b);

            const g = genreFromCategories(it.cats);
            if (g) { it.ref.genre = g; aiCacheSet(it.fp, g, { genre: g }); byGoogle++; }
          } catch (e) { /* 1 bản ghi hỏng thì bỏ qua, không giết cả quá trình */ }
        });
        const byTitle = new Map();
        items.forEach((it) => { if (it.ref.genre) byTitle.set(normTitle(it.title), it.ref.genre); });
        items.forEach((it) => {
          try { if (!it.ref.genre) { const g = byTitle.get(normTitle(it.title)); if (g) { it.ref.genre = g; aiCacheSet(it.fp, g, { genre: g }); inherited++; } } } catch (e) {}
        });
        if (cached || byGoogle || inherited) { persist("books"); persist("playBooks"); }
      } catch (e) { stageErrors.push("khâu quét nhanh theo thể loại có sẵn: " + ((e && e.message) || e)); }
      const todo = items.filter((it) => !it.ref.genre);
      /* ai15 BREADCRUMB: báo sau khâu quét nhanh BẤT KỂ còn cuốn chờ AI hay không */
      if (todo.length) upd("⚡ Đã quét nhanh xong — xếp được ngay " + doneCount() + "/" + total + " cuốn, " + todo.length + " cuốn còn lại em nhờ AI phân loại…");
      else upd("⚡ Đã quét nhanh xong — xếp được ngay " + doneCount() + "/" + total + " cuốn, không còn cuốn nào phải nhờ AI phân loại…");
      if (finished) return;
      if (todo.length && !aiHasAnyKey()) {
        finishUp();
        aiThreadUpdate(note.id, { text: "🗂 Đã xếp " + doneCount() + "/" + total + " cuốn · còn " + todo.length + " cuốn chờ khóa AI" });
        pushAiMsg({ text: "Em đã xếp được **" + doneCount() + "/" + total + " cuốn** nhờ thể loại có sẵn từ Google Books và kết quả đã lưu ⚡. Còn **" + todo.length + " cuốn** cần Annie đọc tên sách để phân loại — anh gắn khóa Gemini miễn phí (mục Cài đặt) rồi bảo em “sắp xếp thư viện” tiếp nhé, em làm tiếp phần còn lại chứ không làm lại từ đầu. Các **kệ thông minh** (Đang đọc dở tay · Chưa từng mở · Đọc nhanh dưới 1 giờ · Phủ bụi lâu nhất) thì đã có sẵn trong mục Thư viện rồi ạ." });
        S.aiBusy = false; render(); scrollChatBottom(); return;
      }
      /* (b) Vòng phân loại AI từng đợt — lỗi đợt nào ghi rõ lý do vào broke, dừng vòng nhưng vẫn tổng kết.
         ai14: mỗi đợt bọc thêm mốc chờ riêng 45 giây (Promise.race với withTimeout) — quá giờ
         coi như đợt đó lỗi (broke) rồi đi tiếp tới tổng kết như logic sẵn có; dòng trạng thái
         cập nhật theo từng đợt để thấy rõ đang chờ AI hay đã xong đợt. Cộng với mốc 45 giây
         trong streamProvider/streamRelay, khâu này KHÔNG còn đường nào treo vô hạn. */
      try {
        const CAPRUN = 150;
        const run = todo.slice(0, CAPRUN);
        const batches = Math.max(1, Math.ceil(run.length / 30));
        for (let i = 0; i < run.length; i += 30) {
          if (finished) break; /* watchdog đã chốt xong — không chạy tiếp nữa */
          const slice = run.slice(i, i + 30);
          const batchNo = Math.floor(i / 30) + 1;
          upd("🤖 Đang chờ AI phân loại đợt " + batchNo + "/" + batches + " — đã xếp " + doneCount() + "/" + total + " cuốn…");
          try {
            const raced = await withTimeout(classifyBatchAI(slice.map((it, j) => ({ n: j + 1, title: it.title, author: it.author }))), 45000);
            if (raced && raced.__timeout) { broke = "đợt phân loại " + batchNo + " chờ AI quá 45 giây nên em dừng đợt đó"; break; }
            const map = raced || {};
            slice.forEach((it, j) => { const g = map[j + 1] || "Khác"; it.ref.genre = g; aiCacheSet(it.fp, g, { genre: g }); });
          } catch (e) { broke = (e && e.message) || String(e); break; }
          persist("books"); persist("playBooks");
          upd("🗂 Đã phân loại xong đợt " + batchNo + "/" + batches + " — " + doneCount() + "/" + total + " cuốn…");
        }
        if (broke) stageErrors.push("khâu phân loại bằng AI: " + broke);
      } catch (e) { stageErrors.push("khâu phân loại bằng AI: " + ((e && e.message) || e)); }
      if (finished) return;
      /* ai15 BREADCRUMB: dấu vết ngay trước khâu gộp tác giả */
      upd("✍️ Đã phân loại xong — đang gộp các cách viết tên tác giả trùng người…");
      /* (c) Gộp tên tác giả — ai15: bọc mốc chờ 45 giây như vòng đợt (ai14 khâu này là
         await duy nhất trong organizeAgent chưa có mốc chờ); quá giờ thì ghi vào
         stageErrors rồi đi tiếp tới tổng kết, giống cách xử lý vòng đợt. */
      try {

        if (racedMerge && racedMerge.__timeout) stageErrors.push("khâu gộp tên tác giả: chờ quá 45 giây nên em bỏ qua khâu này");
        else mergedAuthors = racedMerge || 0;
        persist("books"); persist("playBooks");
      }

      if (finished) return;
      finishUp(); /* từ đây chỉ còn khâu tổng kết — hủy watchdog để không chốt chồng */
      /* (d) Tổng kết trung thực — dù khâu nào lỗi vẫn hiện, kèm số cuốn thật + lỗi nguyên văn */
      try {
        const remain = items.filter((it) => !it.ref.genre).length;
        const counts = {};
        items.forEach((it) => { if (it.ref.genre) counts[it.ref.genre] = (counts[it.ref.genre] || 0) + 1; });
        const top = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 6).map(([g, n]) => "• " + g + ": " + n + " cuốn").join("\n");
        aiThreadUpdate(note.id, { text: "✅ Đã phân loại " + doneCount() + "/" + total + " cuốn" + (cached ? " · ⚡ dùng lại kết quả đã lưu cho " + cached + " cuốn" : "") + (byGoogle ? " · " + byGoogle + " cuốn theo thể loại Google Books" : "") + (mergedAuthors ? " · gộp " + mergedAuthors + " cặp tên tác giả trùng người" : "") + (remain > 0 ? " · còn " + remain + " cuốn cho đợt sau" : "") + (stageErrors.length ? " · ⚠ " + stageErrors.length + " khâu gặp lỗi (chi tiết ở tin nhắn dưới)" : "") });
        let msg = "**Thư viện đã gọn hơn rồi anh!** Em đã xếp được **" + doneCount() + "/" + total + " cuốn** và phần đã xếp **đã được lưu** rồi ạ. Các kệ thể loại lớn nhất:\n" + top + "\n\nAnh mở mục **Thư viện** để xem các kệ (hàng chip ở đầu trang) — có cả kệ thông minh tự cập nhật theo dữ liệu đọc thật: Đang đọc dở tay · Chưa từng mở · Đọc nhanh dưới 1 giờ · Phủ bụi lâu nhất. Thể loại lưu theo tài khoản nên mở máy khác cũng thấy y hệt; phần anh xếp tay bằng bộ sưu tập em không đụng vào.";
        if (stageErrors.length) msg += "\n\n⚠ Có khâu chưa chạy trọn: " + stageErrors.join(" · ") + ". Phần đã xếp vẫn được lưu đầy đủ — anh bảo “sắp xếp thư viện” lại là em làm tiếp phần còn thiếu.";
        pushAiMsg({ text: msg, follow: remain > 0 ? "Phân loại tiếp số còn lại" : "Tác giả nào nhiều sách nhất trong thư viện?" });
      } catch (e) {
        aiThreadUpdate(note.id, { text: "🗂 Đã xếp " + doneCount() + "/" + total + " cuốn (đã lưu)" });
        pushAiMsg({ text: "Em đã xếp được **" + doneCount() + "/" + total + " cuốn** và phần đã xếp **đã được lưu** rồi ạ. (Khâu tổng kết gặp lỗi: " + ((e && e.message) || e) + ")" });
      }
      S.aiBusy = false; render(); scrollChatBottom();
    }

    /* ================= KỆ / BỘ SƯU TẬP QUA LỆNH CHAT ================= */
    function findCollectionByName(name) {
      const k = normTitle(name);
      return DB.collections.find((c) => normTitle(c.name) === k) || DB.collections.find((c) => k.length >= 3 && normTitle(c.name).includes(k));

    function cleanShelfName(s) {
      return String(s || "").trim().replace(/[.?!]+$/, "").replace(/\s+(giúp em|giúp tôi|giúp mình|nhé|nha|ạ|đi)$/i, "").replace(/\s+(giúp em|giúp tôi|giúp mình)$/i, "").trim();
    }
    function shelfCommand(q) {
      let m = q.match(/đổi tên kệ\s+(.+?)\s+thành\s+(.+)/i);
      if (m) {
        const c = findCollectionByName(m[1].trim());
        if (c) { const old = c.name; c.name = m[2].trim().replace(/[.?!]+$/, ""); persist("collections"); pushAiMsg({ text: "Đã đổi tên kệ **" + old + "** thành **" + c.name + "** rồi anh." }); }
        else pushAiMsg({ text: "Em chưa tìm thấy kệ “" + m[1].trim() + "” — anh kiểm tra lại tên kệ giúp em nhé." });
        S.aiBusy = false; render(); scrollChatBottom(); return true;
      }
      m = q.match(/tạo kệ\s+(?:của\s+)?tác giả\s+(.+)/i);
      if (m) {
        const g = findAuthorGroup(cleanShelfName(m[1]));
        const colName = "Tác giả " + (g ? g.name : m[1].trim());
        let col = findCollectionByName(colName);
        if (!col) { col = { id: uid(), name: colName }; DB.collections.push(col); persist("collections"); }
        let added = 0;
        if (g) g.books.forEach((b) => { b.collections = b.collections || []; if (!b.collections.includes(col.id)) { b.collections.push(col.id); added++; } });
        if (added) persist("books");
        pushAiMsg({ text: "Đã tạo kệ **" + colName + "** và xếp **" + added + " cuốn** có file trong app của tác giả này vào kệ" + (g && g.playBooks.length ? " (ngoài ra còn " + g.playBooks.length + " cuốn trên Play Sách — lấy file về là em xếp vào tiếp)" : "") + ". Anh xem ở Thư viện → bộ lọc bộ sưu tập nhé." });
        S.aiBusy = false; render(); scrollChatBottom(); return true;
      }
      m = q.match(/tạo kệ\s+(.+)/i) || q.match(/tạo bộ sưu tập\s+(.+)/i);
      if (m) {
        const name = cleanShelfName(m[1]);
        if (findCollectionByName(name)) pushAiMsg({ text: "Kệ **" + name + "** đã có rồi anh — muốn thêm sách vào thì anh cứ nói “cho sách của … vào kệ " + name + "” nhé." });
        else { DB.collections.push({ id: uid(), name }); persist("collections"); pushAiMsg({ text: "Đã tạo kệ **" + name + "** rồi anh 🎉 Anh bảo “cho sách của … vào kệ " + name + "” là em xếp vào ngay; anh xếp tay trong Thư viện thì em luôn tôn trọng, không tự ghi đè.", follow: "Cho sách của Nguyễn Nhật Ánh vào kệ " + name }); }
        S.aiBusy = false; render(); scrollChatBottom(); return true;
      }
      m = q.match(/(?:cho|thêm|đưa|xếp)\s+(.+?)\s+vào kệ\s+(.+)/i);
      if (m) {
        const topic = m[1].trim().replace(/^sách của\s+/i, "").replace(/^sách\s+/i, "");
        let col = findCollectionByName(m[2].trim().replace(/[.?!]+$/, ""));
        if (!col) { col = { id: uid(), name: m[2].trim().replace(/[.?!]+$/, "") }; DB.collections.push(col); persist("collections"); }
        const tk = normTitle(topic);
        const hits = DB.books.filter((b) => (tk && normTitle(b.author || "").includes(tk)) || (tk && normTitle(b.title).includes(tk)));
        let added = 0;
        hits.forEach((b) => { b.collections = b.collections || []; if (!b.collections.includes(col.id)) { b.collections.push(col.id); added++; } });
        if (added) persist("books");
        pushAiMsg({ text: hits.length ? "Đã xếp **" + added + " cuốn** khớp “" + topic + "” vào kệ **" + col.name + "** (tìm thấy " + hits.length + " cuốn). Anh xem ở Thư viện → bộ lọc bộ sưu tập nhé." : "Em chưa tìm thấy cuốn nào khớp “" + topic + "” trong số sách đã có file — sách Play Sách chưa lấy file thì chưa xếp vào kệ được anh nhé." });
        S.aiBusy = false; render(); scrollChatBottom(); return true;

      return false;

    /* ================= THƯ VIỆN THEO TÁC GIẢ ================= */
    function authorNamesOf(raw) { return String(raw || "").split(/,|;|&|\s+và\s+|\s+and\s+/i).map((s) => s.trim()).filter(Boolean); }
    function authorDisplayName(variants) {
      let best = "", bestScore = -1;
      variants.forEach((n, name) => { const score = n * 2 + (/[àáâãèéêìíòóôõùúýăđơưạảấầẩẫậắằẳẵặẹẻẽếềểễệỉịọỏốồổỗộớờởỡợụủứừửữựỳỵỷỹ]/i.test(name) ? 5 : 0) + name.length / 100; if (score > bestScore) { bestScore = score; best = name; } });
      return best;
    }
    function authorGroups() {
      const merges = DB.authorMerges || {};
      const groups = new Map();
      const pushTo = (key, nm, entry) => {
        if (!groups.has(key)) groups.set(key, { key, names: new Map(), books: [], playBooks: [] });
        const g = groups.get(key);
        if (nm) g.names.set(nm, (g.names.get(nm) || 0) + 1);
        if (entry.libId) { if (!g.books.find((b) => b.id === entry.libId)) g.books.push(entry.ref); }
        else if (entry.googleId) { if (!g.playBooks.find((p) => p.googleId === entry.googleId)) g.playBooks.push(entry.ref); }
      };
      const addEntry = (rawAuthor, entry) => {
        const names = authorNamesOf(rawAuthor);
        if (!names.length) { pushTo("__unknown", "", entry); return; }
        names.forEach((nm) => { let key = normTitle(nm); if (merges[key]) key = merges[key]; pushTo(key, nm, entry); });
      };
      DB.books.forEach((b) => addEntry(b.author, { libId: b.id, ref: b }));
      Object.values(DB.playBooks || {}).forEach((pb) => { if (pb.localId) return; addEntry(pb.author, { googleId: pb.googleId, ref: pb }); });
      const pins = DB.authorPins || [];
      const arr = Array.from(groups.values()).map((g) => ({ key: g.key, name: g.key === "__unknown" ? "Chưa rõ tác giả" : authorDisplayName(g.names), n: g.books.length + g.playBooks.length, books: g.books, playBooks: g.playBooks, pinned: pins.includes(g.key) }));
      arr.sort((a, b) => ((b.pinned ? 1 : 0) - (a.pinned ? 1 : 0)) || (a.key === "__unknown" ? 1 : b.key === "__unknown" ? -1 : b.n - a.n));
      return arr;
    }
    function findAuthorGroup(name) {
      const k = normTitle(name);
      const gs = authorGroups();
      return gs.find((g) => g.key === k) || gs.find((g) => normTitle(g.name) === k) || (k.length >= 4 ? gs.find((g) => normTitle(g.name).includes(k) || k.includes(normTitle(g.name))) : null);
    }

        if (g.playBooks.length > 60) h += '<p style="font-size:12.5px;color:var(--dim);margin-top:8px">… và ' + (g.playBooks.length - 60) + " cuốn nữa — xem ở mục Play Sách.</p>";
      }
      if (!g.books.length && !g.playBooks.length) h += '<section class="empty"><h3>Tác giả này chưa có sách nào</h3></section>';
      return h;
    }
    async function aiAuthorMergePass(upd) {
      if (!aiHasAnyKey()) return 0;
      const keys = new Set();

      const pairs = [];

        const a = arr[i], b = arr[j]; const ta = a.split(" "), tb = b.split(" ");
        const subset = ta.every((t) => tb.includes(t)) || tb.every((t) => ta.includes(t));
        const sameEnds = ta[0] === tb[0] && ta[ta.length - 1] === tb[tb.length - 1];
        if ((subset && Math.abs(ta.length - tb.length) <= 1) || (sameEnds && Math.abs(ta.length - tb.length) === 1)) pairs.push([a, b]);
      }
      const fresh = pairs.filter((p) => aiCacheGet("authmerge:" + p[0] + "|" + p[1]) == null).slice(0, 12);
      if (!fresh.length) return 0;
      if (upd) upd("✍️ Đang nhờ AI kiểm tra " + fresh.length + " cặp tên tác giả gần giống nhau…");

        let merged = 0;
        DB.authorMerges = DB.authorMerges || {};
        res.text.split("\n").forEach((line) => { const m = line.match(/(\d+)\s*[|.]\s*(yes|no)/i); if (!m) return; const p = fresh[Number(m[1]) - 1]; if (!p) return; const same = /yes/i.test(m[2]); aiCacheSet("authmerge:" + p[0] + "|" + p[1], same ? "yes" : "no", { same }); if (same) { const canon = p[0].length >= p[1].length ? p[0] : p[1]; const other = canon === p[0] ? p[1] : p[0]; if (!DB.authorMerges[other]) { DB.authorMerges[other] = canon; merged++; } } });
        if (merged) persist("authorMerges");
        return merged;
      } catch (e) { return 0; }

       (a) sách anh TỰ TẢI LÊN — có file thật trong máy, trò chuyện được ngay;
       (b) kệ “Thư viện có sẵn” — cuốn đã tải về máy (bản ghi shelf-* trong DB.books)
           lẫn cuốn còn nằm trong danh mục 642 cuốn (chọn là app tự tải file về
           qua ensureShelfBook rồi mới gán aiBookId, đúng như sách có file khác);
       (c) sách Play Sách chưa có file — giữ nguyên hành vi cũ.
       Sách CÓ FILE (a + b) xếp TRƯỚC, Play Sách chưa có file xuống sau; trong mỗi
       nhóm xếp theo tên. Mỗi mục ghi NHÃN NGUỒN rõ ràng + trạng thái file.
       Trùng lặp được khử: cuốn kệ đã có bản ghi trong app không hiện 2 lần; cuốn
       Play Sách đã có file trong app (localOf) hoặc trùng tên với một cuốn trong
       Thư viện có sẵn (bản có file tốt hơn) cũng chỉ hiện 1 mục có file. */
    function aiBookEntries() {
      const localOf = listenPlayLocalOf();
      const entries = [];
      const shelfCovered = new Set();
      const shelfLocalTitles = new Set();
      DB.books.forEach((b) => {
        if (b.shelf || String(b.id || "").indexOf("shelf-") === 0 || b.shelfId) {
          if (String(b.id || "").indexOf("shelf-") === 0) shelfCovered.add(String(b.id).slice(6));
          if (b.shelfId) shelfCovered.add(b.shelfId);
          const t = normTitle(b.title || ""); if (t) shelfLocalTitles.add(t);
        }
      });
      DB.books.forEach((b) => {
        const fromShelf = b.shelf || String(b.id || "").indexOf("shelf-") === 0 || !!b.shelfId;
        entries.push({ kind: "lib", id: b.id, title: b.title, author: b.author || "", hasFile: true, tag: fromShelf ? "Thư viện có sẵn · đã có file" : "Đã tải lên · đã có file" });
      });
      const catTitles = new Set();
      if (SHELF.status === "ready") {
        SHELF.books.forEach((cat) => {
          const t = normTitle(cat.title || ""); if (t) catTitles.add(t);
          if (shelfCovered.has(cat.id)) return;
          if (t && shelfLocalTitles.has(t)) return;
          entries.push({ kind: "shelf", id: cat.id, title: cat.title, author: cat.author || "", hasFile: true, tag: "Thư viện có sẵn · có file sẵn" });
        });
      }
      Object.values(DB.playBooks || {}).forEach((pb) => {
        if (localOf(pb)) return;
        const t = normTitle(pb.title || ""); if (t && catTitles.has(t)) return;
        entries.push({ kind: "play", id: pb.googleId, title: pb.title, author: pb.author || "", hasFile: false, tag: "Play Sách · chưa có file" });
      });
      entries.sort((a, b) => (a.hasFile === b.hasFile ? a.title.localeCompare(b.title, "vi") : a.hasFile ? -1 : 1));
      return entries;
    }

    }
    document.addEventListener("DOMContentLoaded", init);
    </script>
    <script>
      // PWA: đăng ký service worker + nút cài app lên màn hình chính (độc lập, không đụng logic app)
      (function () {
        try {
          if (location.protocol === "https:" && "serviceWorker" in navigator) {
            navigator.serviceWorker.register("sw.js").catch(function () {});
          }
        } catch (e) {}
        function hpShowInstallHelp() {
          if (document.getElementById("hp-install-help")) return;
          var box = document.createElement("div");
          box.id = "hp-install-help";
          box.setAttribute("style", "position:fixed;inset:0;z-index:99999;background:rgba(34,22,6,.55);display:flex;align-items:center;justify-content:center;padding:20px");
          box.innerHTML =
            '<div style="background:#fffdf7;color:#2c2013;max-width:420px;width:100%;border-radius:14px;padding:20px;box-shadow:0 14px 44px rgba(0,0,0,.32)">' +
            '<div style="font-weight:700;font-size:16px;margin-bottom:8px">📲 Cài đặt ứng dụng</div>' +
            '<p style="margin:0 0 16px;line-height:1.6;font-size:14.5px">Để cài app: Android — mở menu ⋮ của Chrome, chọn \'Cài đặt ứng dụng\' hoặc \'Thêm vào Màn hình chính\'. iPhone — mở app bằng Safari, bấm nút Chia sẻ rồi chọn \'Thêm vào Màn hình chính\'.</p>' +
            '<button type="button" id="hp-install-help-close" style="background:#b96a00;color:#fff8ec;border:0;border-radius:9px;padding:10px 18px;font-size:14.5px;font-weight:600;cursor:pointer;width:100%">Đã hiểu</button></div>';
          document.body.appendChild(box);
          var close = function () { box.remove(); };
          box.querySelector("#hp-install-help-close").addEventListener("click", close);
          box.addEventListener("click", function (ev) { if (ev.target === box) close(); });
        }
        window.hpInstallClick = function () {
          hpShowInstallHelp();
        };
      })();
    </script>
  </body>
</html>
