          --ok: #7fd6a4;
          --shadow: 0 10px 30px -12px rgba(0, 0, 0, 0.6);
          --shadow-sm: 0 4px 14px -6px rgba(0, 0, 0, 0.5);
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        font-family: var(--font-ui);
        color: var(--text);
        background:
          radial-gradient(1100px 480px at 85% -120px, rgba(232, 147, 12, 0.16), rgba(232, 147, 12, 0) 60%),
          radial-gradient(900px 420px at -10% 30%, rgba(160, 74, 40, 0.08), rgba(160, 74, 40, 0) 55%),
          linear-gradient(180deg, var(--bg), var(--bg));
        background-color: var(--bg);
        min-height: 100vh;
        min-height: 100dvh;
      }
      button, [role="button"], select, summary, input:not([type="checkbox"], [type="radio"]), textarea { min-height: 2.25rem; }
      button { font-family: inherit; cursor: pointer; }
      input, select, textarea { font-family: inherit; }
      a { color: var(--accent-strong); }
      .serif { font-family: var(--font-serif); }
      .hidden { display: none !important; }

      /* ---------- Top bar: LUÔN đúng 1 hàng ở mọi bề rộng, không xuống dòng ---------- */
      .topbar {
        position: sticky; top: 0; z-index: 40;
        display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
        height: 58px; padding: 0 12px;
        background: var(--glass);
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border-bottom: 1px solid var(--border);
      }
      .brand { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 17px; letter-spacing: -0.01em; color: var(--text); min-width: 0; flex: 1 1 auto; }
      .brand img { width: 32px; height: 32px; border-radius: 9px; object-fit: cover; flex: none; }
      .brand .brand-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
      .brand .brand-ic { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent-2), var(--accent)); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; flex: none; }
      .top-actions { display: flex; align-items: center; gap: 6px; flex: none; margin-left: auto; }
      /* Chấm cam nhỏ ở góc nút Đồng bộ lại khi phiên Google hết hạn */
      .icon-btn .warn-dot { position: absolute; top: 3px; right: 3px; width: 9px; height: 9px; border-radius: 50%; background: #e8890c; box-shadow: 0 0 0 2px var(--surface); pointer-events: none; }
      .avatar-fallback { width: 34px; height: 34px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-2), #c94f2e); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 15px; flex: none; }
      /* Avatar cuối thanh trên + menu tài khoản đổ xuống ngay dưới avatar */
      .acct { position: relative; flex: none; }
      .avatar-btn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); padding: 0; display: inline-flex; align-items: center; justify-content: center; flex: none; }
      .avatar-btn img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; display: block; }
      .avatar-btn .avatar-fallback { width: 32px; height: 32px; font-size: 14px; }
      .acct-menu {
        position: absolute; top: calc(100% + 8px); right: 0; z-index: 80;
        min-width: 232px; max-width: min(80vw, 284px);
        background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
        box-shadow: var(--shadow); padding: 8px;
      }
      .acct-menu .acct-head { padding: 8px 10px 10px; border-bottom: 1px solid var(--border); margin-bottom: 6px; }
      .acct-menu .acct-head b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .acct-menu .acct-head span { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px; }
      .acct-menu .acct-head span.expired { color: #e8890c; font-weight: 700; }
      .acct-item { display: flex; align-items: center; gap: 9px; width: 100%; border: 0; background: transparent; color: var(--text); font-size: 13.5px; font-weight: 600; padding: 9px 10px; border-radius: 10px; text-align: left; }
      .acct-item:hover { background: var(--surface-2); }
      .acct-item.danger { color: var(--danger); }
      .btn {
        display: inline-flex; align-items: center; justify-content: center; gap: 7px;
        border: 1px solid var(--border); background: var(--surface); color: var(--text);
        border-radius: 999px; padding: 7px 14px; font-size: 13.5px; font-weight: 600;
        transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        text-decoration: none; white-space: nowrap;
      }
      .btn:hover { box-shadow: var(--shadow-sm); }
      .btn:active { transform: scale(0.97); }
      .btn.primary { background: linear-gradient(135deg, var(--accent-2), var(--accent)); border-color: transparent; color: var(--on-accent); }
      .btn.soft { background: var(--accent-soft); color: var(--accent-soft-text); border-color: transparent; }
      .btn.ghost { background: transparent; }
      .btn.danger { color: var(--danger); border-color: var(--danger); background: transparent; }
      .btn.small { padding: 4px 11px; font-size: 12.5px; min-height: 2rem; }
      .btn svg { flex: none; }
      .icon-btn {
        position: relative;
        width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--border);
        background: var(--surface); color: var(--text); display: inline-flex; align-items: center; justify-content: center; flex: none;
      }
      /* Nút đăng nhập GIS chính thức, hiện ngay trong app */
      .gis-signin { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .gis-signin .gis-note { font-size: 11.5px; color: var(--dim); font-weight: 600; }
      .gis-signin.gis-on .gis-fallback, .gis-signin.gis-on .gis-note { display: none; }
      .gis-slot { min-height: 40px; display: inline-flex; align-items: center; }
      .gis-slot:empty { display: none; }
      .empty .row .gis-signin { justify-content: center; }

      /* ---------- Layout / tabs ---------- */
      .wrap { max-width: none; width: 100%; margin: 0; padding: 18px 16px calc(180px + env(safe-area-inset-bottom, 0px)); }
      @media (min-width: 900px) { .wrap { padding-bottom: 40px; padding-left: 28px; padding-right: 28px; } }
      .tabs { display: none; gap: 4px; margin: 14px 0 0; max-width: none; padding: 0 28px; flex-wrap: wrap; }
      @media (min-width: 900px) { .tabs { display: flex; } }
      .tab {
        border: 1px solid transparent; background: transparent; color: var(--dim);
        padding: 8px 15px; border-radius: 999px; font-size: 14px; font-weight: 600;
        display: inline-flex; align-items: center; gap: 7px;
      }
      .tab.active { background: var(--surface); color: var(--accent-strong); border-color: var(--border); box-shadow: var(--shadow-sm); }
      .bottomnav {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
        display: flex; justify-content: space-around;
        background: var(--glass); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid var(--border);
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom, 0px));
        /* Lớp vẽ riêng cho thanh: trình duyệt không phải vẽ lại giữa lúc vuốt,
           thanh bám đáy mượt thay vì trễ nhịp theo trang. */
        transform: translateZ(0); -webkit-transform: translateZ(0);
        will-change: transform;
      }
      @media (min-width: 900px) { .bottomnav { display: none; } }
      .bottomnav button {
        border: 0; background: transparent; color: var(--dim);
        display: flex; flex-direction: column; align-items: center; gap: 2px;
        font-size: 10.5px; font-weight: 600; padding: 5px 8px; border-radius: 12px; flex: 1 1 0; min-width: 0; text-align: center; line-height: 1.3;
      }
      .bottomnav button.active { color: var(--accent-strong); background: var(--accent-soft); }

      /* ---------- Dashboard ---------- */
      .greet { margin: 0 0 16px; }
      .greet h1 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -0.01em; }
      .greet p { margin: 3px 0 0; color: var(--dim); font-size: 13.5px; }
      .stats { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
      @media (min-width: 700px) { .stats { grid-template-columns: repeat(4, 1fr); } }
      .stat {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 13px 15px; box-shadow: var(--shadow-sm);
        display: block; width: 100%; text-align: left; font: inherit; color: var(--text);
        cursor: pointer; -webkit-tap-highlight-color: transparent;
        transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      }
      .stat:hover { border-color: var(--accent); box-shadow: var(--shadow); }
      .stat:active { transform: scale(0.97); }
      .stat:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
      .stat b { font-size: 23px; font-weight: 800; display: block; line-height: 1.1; }
      .stat .stat-label { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--dim); font-weight: 600; }
      .stat .stat-label .stat-txt { flex: 1; min-width: 0; }
      .stat .stat-go { color: var(--accent-strong); display: inline-flex; flex: none; opacity: 0.85; }
      .stat .ic { color: var(--accent); margin-bottom: 5px; display: block; }

      .continue-card {
        display: flex; gap: 16px; align-items: center;
        background: linear-gradient(120deg, var(--surface) 55%, var(--accent-soft));
        border: 1px solid var(--border); border-radius: 26px; padding: 16px;
        box-shadow: var(--shadow); margin-bottom: 20px;
      }
      .continue-card .cov { width: 104px; flex: none; }
      @media (min-width: 700px) { .continue-card .cov { width: 136px; } }
      .continue-card .tag-reading {
        display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800;
        letter-spacing: 0.1em; padding: 3px 10px; border-radius: 99px;
        background: var(--accent); color: var(--on-accent); margin-bottom: 7px;
      }
      .explain-box {
        background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px;
        padding: 12px 14px; font-size: 13.5px; line-height: 1.6; color: var(--text); margin-top: 14px;
      }
      .explain-box b { color: var(--accent-strong); }
      .app-footer {
        margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--border);
        text-align: center; font-size: 12.5px; color: var(--faint); line-height: 1.7;
      }
      .app-footer a { font-weight: 700; }
      .continue-card h2 { margin: 0 0 3px; font-size: 18px; }
      .continue-card .meta { color: var(--dim); font-size: 13px; margin-bottom: 10px; }
      .progress { height: 9px; border-radius: 99px; background: var(--border); overflow: hidden; }
      .progress i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--accent-2), var(--accent)); transition: width 0.4s ease; }
      .continue-card .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
      .continue-card .pct { font-weight: 800; color: var(--accent-strong); font-size: 14px; }

      .quick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
      @media (min-width: 800px) { .quick { grid-template-columns: repeat(4, 1fr); } }
      .quick button {
        border: 0; border-radius: 22px; padding: 16px 14px; text-align: left; color: #fff;
        display: flex; flex-direction: column; gap: 8px; min-height: 104px;
        box-shadow: var(--shadow-sm); transition: transform 0.15s ease;
      }
      .quick button:active { transform: scale(0.97); }
      .quick button b { font-size: 15px; }
      .quick button span { font-size: 12px; opacity: 0.88; line-height: 1.35; }
      .quick .q-add { background: linear-gradient(135deg, #f2ac2e, #dd7f0d); }
      .quick .q-play { background: linear-gradient(135deg, #35a37f, #1e7a5c); }
      .quick .q-ai { background: linear-gradient(135deg, #e0653a, #c2481f); }
      .quick .q-listen { background: linear-gradient(135deg, #a04a5e, #74344a); }

      /* Thẻ lớn “Thư viện có sẵn” ở Trang chủ */
      .shelf-cta { margin-bottom: 20px; }
      .shelf-cta-btn {
        width: 100%; border: 0; border-radius: 22px; padding: 18px 16px;
        display: flex; align-items: center; gap: 14px; text-align: left; color: #fff;
        background: linear-gradient(120deg, #c07f14, #8a4d16);
        box-shadow: var(--shadow-sm); cursor: pointer; font: inherit;
        transition: transform 0.15s ease;
      }
      .shelf-cta-btn:active { transform: scale(0.98); }
      .shelf-cta-btn > svg { flex: none; }
      .shelf-cta-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
      .shelf-cta-txt b { font-size: 16.5px; }
      .shelf-cta-txt span { font-size: 12.5px; opacity: 0.92; line-height: 1.4; }

      .shelf-head { display: flex; align-items: baseline; gap: 10px; margin: 24px 0 4px; }
      .shelf-head h2 { margin: 0; font-size: 18px; font-weight: 800; }
      .shelf-head .count { color: var(--faint); font-size: 13px; font-weight: 600; }
      .shelf-head .more { margin-left: auto; font-size: 13px; font-weight: 700; text-decoration: none; }
      .shelf-row { margin-bottom: 6px; }
      .shelf-covers { position: relative; z-index: 1; display: grid; gap: 12px; }
      .shelf-plank {
        height: 13px; margin-top: -5px; border-radius: 3px;
        background:
          linear-gradient(180deg, rgba(255, 246, 224, 0.8), rgba(255, 246, 224, 0) 3px),
          linear-gradient(180deg, #dfba85 0%, #cfa668 45%, #bd9257 78%, #a87c42 100%);
        box-shadow: inset 0 -3px 0 rgba(122, 84, 32, 0.3), 0 12px 16px -8px rgba(122, 84, 32, 0.4);
      }
      :root[data-theme="dark"] .shelf-plank {
        background:
          linear-gradient(180deg, rgba(255, 228, 175, 0.55), rgba(255, 228, 175, 0) 3px),
          linear-gradient(180deg, #9a683a 0%, #7c4f27 45%, #5d3a1b 78%, #452a12 100%);
        box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.28), 0 12px 16px -8px rgba(43, 26, 8, 0.5);
      }
      .shelf-meta { display: grid; gap: 12px; margin-top: 9px; }
      .book-cell { min-width: 0; }
      .cover {
        position: relative; display: block; width: 100%; aspect-ratio: 3 / 4; border-radius: 10px;
        overflow: hidden; box-shadow: 0 1px 2px rgba(60, 40, 10, 0.2), 0 5px 12px rgba(60, 40, 10, 0.16), 0 20px 34px -14px rgba(43, 26, 8, 0.5);
        background: var(--surface-2); border: 0; padding: 0; text-align: left;
      }
      .cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
      .cover .ph {
        position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between;
        padding: 11px 11px 11px 15px; color: #fff;
      }
      .cover .ph::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: rgba(0, 0, 0, 0.22); }
      .cover .ph .tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.85; }
      .cover .ph .t { font-family: var(--font-serif); font-weight: 700; line-height: 1.3; font-size: 14.5px; letter-spacing: 0.01em; text-shadow: 0 1px 4px rgba(0, 0, 0, 0.28); display: -webkit-box; -webkit-line-clamp: 5; -webkit-box-orient: vertical; overflow: hidden; }
      .cover .ph .a { font-size: 11px; opacity: 0.88; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .cover .fmt {
        position: absolute; top: 7px; right: 7px; z-index: 2;
        background: rgba(20, 12, 4, 0.66); color: #ffe9bd; font-size: 9.5px; font-weight: 700;
        padding: 2.5px 7px; border-radius: 99px; letter-spacing: 0.04em;
      }
      .cover .mini-progress { position: absolute; left: 0; right: 0; bottom: 0; height: 5px; background: rgba(0, 0, 0, 0.35); z-index: 2; }
      .cover .mini-progress i { display: block; height: 100%; background: #ffb63e; }
      .book-title { display: block; font-size: 13.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; min-height: 2.6em; }
      .book-author { display: block; font-size: 12px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .book-sub { display: block; font-size: 11.5px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* list view */
      .book-list { display: flex; flex-direction: column; gap: 10px; }
      .book-row {
        display: flex; gap: 13px; align-items: center; background: var(--surface);
        border: 1px solid var(--border); border-radius: 18px; padding: 10px 12px; box-shadow: var(--shadow-sm);
      }
      .book-row .thumb { width: 46px; height: 62px; border-radius: 6px; overflow: hidden; flex: none; box-shadow: var(--shadow-sm); }
      .book-row .thumb img { width: 100%; height: 100%; object-fit: cover; }
      .book-row .info { flex: 1; min-width: 0; }
      .book-row .info b { display: block; font-size: 14.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .book-row .info span { font-size: 12.5px; color: var(--dim); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

      /* toolbar */
      .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 12px 0 6px; }
      .search-box { flex: 1 1 200px; display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 0 14px; }
      .search-box input { flex: 1; border: 0; background: transparent; color: var(--text); font-size: 14.5px; outline: none; min-height: 2.5rem; }
      .chips { display: flex; gap: 8px; flex-wrap: wrap; max-width: 100%; }
      .chip {
        border: 1px solid var(--border); background: var(--surface); color: var(--dim);
        border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 600;
      }
      .chip.active { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
      select.select {
        border: 1px solid var(--border); background: var(--surface); color: var(--text);
        border-radius: 999px; padding: 6px 12px; font-size: 13.5px; font-weight: 600;
      }

      .empty {
        border: 1.5px dashed var(--border); border-radius: 26px; padding: 30px 20px; text-align: center;
        background: var(--surface-2);
      }
      .empty h3 { margin: 10px 0 6px; font-size: 17px; }
      .empty p { margin: 0 auto 16px; color: var(--dim); font-size: 14px; line-height: 1.55; max-width: 460px; }
      .ghost-covers { display: flex; justify-content: center; gap: 10px; margin-bottom: 6px; }
      .ghost-covers i {
        width: 54px; height: 72px; border-radius: 7px; display: block; opacity: 0.5;
        box-shadow: var(--shadow-sm);
      }
      .empty .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

      .banner {
        border-radius: 16px; padding: 12px 15px; font-size: 13.5px; line-height: 1.5;
        display: flex; gap: 10px; align-items: flex-start; margin-bottom: 14px;
      }
      .banner.warn { background: #fdf0d5; color: #6d4a00; border: 1px solid #ecd28f; }
      .banner.info { background: var(--accent-soft); color: var(--accent-soft-text); border: 1px solid var(--border); }
      :root[data-theme="dark"] .banner.warn { background: #3d2c07; color: #ffd98a; border-color: #6b5312; }
      .banner .btn { margin-left: auto; flex: none; }

      .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow-sm); }
      .card h3 { margin: 0 0 8px; font-size: 15.5px; }
      .card p { color: var(--dim); font-size: 13.5px; line-height: 1.55; }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 5px; }
      .field .hint { font-size: 12px; color: var(--faint); margin-top: 4px; line-height: 1.45; }
      .field input[type="text"], .field input[type="password"], .field textarea {
        width: 100%; border: 1px solid var(--border); border-radius: 13px; background: var(--surface-2);
        color: var(--text); padding: 9px 12px; font-size: 14px; outline: none;
      }
      .field input:focus, .field textarea:focus { border-color: var(--accent); }

      /* AI */
      .ai-answer {
        background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
        padding: 16px 18px; box-shadow: var(--shadow-sm); line-height: 1.65; font-size: 14.5px; white-space: pre-wrap;
      }
      .ai-answer:empty { display: none; }
      .provider-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; background: var(--accent-soft); color: var(--accent-soft-text); }

      /* ===== Annie v2: khung chat 2 chiều ===== */
      .chat-wrap { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
      .chat-row { display: flex; gap: 8px; align-items: flex-end; }
      .chat-row.me { justify-content: flex-end; }
      .chat-ava { width: 30px; height: 30px; border-radius: 50%; flex: none; background: linear-gradient(140deg, #3a2410, #7c4a03); color: #f5d9a8; display: flex; align-items: center; justify-content: center; font-family: var(--font-serif); font-weight: 800; font-size: 12.5px; letter-spacing: .02em; box-shadow: var(--shadow-sm); }
      .bubble { max-width: 86%; padding: 11px 14px; border-radius: 18px; font-size: 14.5px; line-height: 1.62; white-space: pre-wrap; word-break: break-word; box-shadow: var(--shadow-sm); }
      .bubble.ai { background: var(--surface); border: 1px solid var(--border); border-bottom-left-radius: 6px; color: var(--text); }
      .bubble.me { background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 6px; }

       login_hint = email tài khoản Firebase đang đăng nhập. */
    const TOKEN_KEY = "hp-gtoken";
    let gToken = null, gTokenExp = 0, gTokenScopes = [];
    try { const raw = sessionStorage.getItem(TOKEN_KEY); if (raw) { const p = JSON.parse(raw); gToken = p.t || null; gTokenExp = p.exp || 0; gTokenScopes = Array.isArray(p.scopes) ? p.scopes : []; } } catch (e) {}
    function setGToken(t, expiresInSec, scopes) {
      gToken = t; gTokenExp = Date.now() + (expiresInSec ? expiresInSec * 1000 : 3600 * 1000);
      (scopes || []).forEach((sc) => { if (sc && gTokenScopes.indexOf(sc) < 0) gTokenScopes.push(sc); });
      try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: gToken, exp: gTokenExp, scopes: gTokenScopes })); } catch (e) {}
      S.tokenState = "ok";
      S.scopeMissing = [BOOKS_SCOPE, DRIVE_SCOPE].filter((sc) => gTokenScopes.indexOf(sc) < 0)
        .map((sc) => sc === BOOKS_SCOPE ? "quyền đọc Play Sách" : "quyền lưu file trên Drive");
      render();
      // Có token mới → xử lý hàng đợi xoá file Drive còn dang dở (mục 8).
      setTimeout(() => { processPendingDeletes(); }, 800);
    }
    function clearGToken() { gToken = null; gTokenExp = 0; try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {} if (S.user) S.tokenState = "expired"; }
    const tokenValid = () => !!gToken && Date.now() < gTokenExp - 60000;
    const hasScope = (sc) => tokenValid() && gTokenScopes.indexOf(sc) >= 0;
    /* Dòng trấn an hiện TRƯỚC khi bật cửa sổ xin quyền Google (mục 4). */
    const SCOPE_REASSURE = "App chỉ xin quyền xem danh sách Play Sách và tạo 1 ngăn chứa riêng trên Drive — hoàn toàn không đọc hay đụng tới các file cá nhân khác của bạn.";
    function reassureScope() { toast(SCOPE_REASSURE, 6500); }

    /* Xin token bằng GIS token client: cửa sổ nhỏ của Google hiện ngay tại trang app, không điều hướng ra ngoài. */
    function gisRequestToken(scopes, prompt) {
      return new Promise((resolve, reject) => {
        if (!window.google || !google.accounts || !google.accounts.oauth2) return reject(new Error("GIS chưa sẵn sàng"));
        try {
          const hint = (S.user && S.user.email) || undefined;
          const client = google.accounts.oauth2.initTokenClient({
            client_id: WEB_OAUTH_CLIENT_ID, scope: scopes, login_hint: hint,
            callback: (resp) => { if (resp && resp.access_token) resolve(resp); else reject(new Error((resp && resp.error) || "Không lấy được token")); },
            error_callback: (err) => {
              const t = err && err.type;
              if (t === "popup_failed_to_open") reject(new Error("POPUP_BLOCKED"));
              else if (t === "popup_closed") reject(new Error("POPUP_CLOSED"));
              else reject(err || new Error("GIS lỗi"));
            },
          });
          client.requestAccessToken({ prompt: prompt || "", login_hint: hint });
        } catch (e) { reject(e); }
      });
    }
    function scopeErrMsg(e) {
      const m = (e && e.message) || "";
      if (m === "POPUP_BLOCKED") return "Trình duyệt đang chặn cửa sổ xác nhận của Google — anh cho phép cửa sổ bật lên (popup) cho trang này rồi bấm lại nhé. App không chuyển sang trang ngoài đâu ạ.";
      if (m === "POPUP_CLOSED") return "Anh vừa đóng cửa sổ xác nhận của Google nên quyền chưa được cấp — bấm lại và bấm Đồng ý giúp em nhé.";
      return "Chưa lấy được quyền từ Google — anh thử lại giúp em.";
    }
    /* Xin/chỉ làm mới ĐÚNG một scope: thử GIS ngầm trước, cửa sổ nhỏ sau (khi người dùng chủ động bấm). */
    const scopeRequests = {};
    function requestScopes(scopeStr, forcePopup) {
      if (scopeRequests[scopeStr]) return scopeRequests[scopeStr];
      const wanted = scopeStr.split(" ").filter(Boolean);
      const p = (async () => {
        try {
          const r = await gisRequestToken(scopeStr, "");
          setGToken(r.access_token, r.expires_in, wanted); checkScopes(); return gToken;
        } catch (e) { if (!forcePopup) throw e; /* rơi xuống bước 2 khi người dùng chủ động bấm */ }
        const r2 = await gisRequestToken(scopeStr, "consent");
        setGToken(r2.access_token, r2.expires_in, wanted); checkScopes(); return gToken;
      })();
      scopeRequests[scopeStr] = p;
      const done = () => { delete scopeRequests[scopeStr]; };
      p.then(done, done);
      return p;
    }
    async function ensureScope(scope, forcePopup) {
      if (hasScope(scope)) return gToken;
      return requestScopes(scope, forcePopup);
    }
    /* Làm mới các scope còn thiếu — từng scope một, không gộp cửa sổ. */
    async function refreshGToken(forcePopup) {
      const want = [BOOKS_SCOPE, DRIVE_SCOPE].filter((sc) => !hasScope(sc));
      if (!want.length) return gToken;
      let lastErr = null;
      for (const sc of want) {
        try { await requestScopes(sc, forcePopup); }
        catch (e) { lastErr = e; if (forcePopup) throw e; }
      }
      if (!gToken && lastErr) throw lastErr;
      return gToken;
    }
    async function checkScopes() {
      if (!gToken) return;
      try {
        const res = await fetch("https://oauth2.googleapis.com/tokeninfo?access_token=" + encodeURIComponent(gToken));
        if (!res.ok) return;
        const info = await res.json();
        const scopes = String(info.scope || "").split(" ").filter(Boolean);
        if (scopes.length) {
          gTokenScopes = scopes;
          try { sessionStorage.setItem(TOKEN_KEY, JSON.stringify({ t: gToken, exp: gTokenExp, scopes: gTokenScopes })); } catch (e) {}
        }
        const missing = [];
        if (!scopes.includes(BOOKS_SCOPE)) missing.push("quyền đọc Play Sách");
        if (!scopes.includes(DRIVE_SCOPE)) missing.push("quyền lưu file trên Drive");
        S.scopeMissing = missing;
        if (missing.length) S.tokenState = "ok";
        render();
      } catch (e) { /* bỏ qua: không chặn app */ }
    }
    function scopeForUrl(url) {
      if (url.indexOf("books.googleapis.com") >= 0) return BOOKS_SCOPE;
      if (url.indexOf("drive") >= 0) return DRIVE_SCOPE;
      return "";
    }
    /* Mọi lời gọi Books/Drive đều qua hàm này: trước khi gọi, nếu token sắp hết hạn/hết hạn
       hoặc thiếu đúng scope của API đó thì tự xin lại (GIS ngầm trước) rồi mới thực thi;
       gặp 401 cũng tự xin lại token của đúng scope đó và gọi lại — không để lỗi 401 âm thầm. */
    async function gFetch(url, opts, tokenOverride) {
      opts = opts || {};
      const doFetch = (tok) => fetch(url, Object.assign({}, opts, { headers: Object.assign({}, opts.headers || {}, { Authorization: "Bearer " + tok }) }));
      if (tokenOverride) {
        const r = await doFetch(tokenOverride);
        return r;
      }
      const scope = scopeForUrl(url);
      if (!tokenValid() || (scope && gTokenScopes.indexOf(scope) < 0)) {
        if (scope) await requestScopes(scope, false);
        else if (!tokenValid()) throw new Error("Chưa có phiên Google");
      }
      let res = await doFetch(gToken);
      if (res.status === 401) {
        clearGToken();
        if (scope) await requestScopes(scope, false);
        res = await doFetch(gToken);
        if (res.status === 401) { S.tokenState = "expired"; render(); throw new Error("401"); }
      }
      return res;
    }

    /* ================= Google Drive appDataFolder ================= */
    async function driveUpload(name, blob, mime) {
      const meta = { name: name, parents: ["appDataFolder"], mimeType: mime || blob.type || "application/octet-stream" };
      if (blob.size <= RESUMABLE_THRESHOLD) {
        const boundary = "hp" + Date.now().toString(36);
        const head = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" + JSON.stringify(meta) + "\r\n--" + boundary + "\r\nContent-Type: " + meta.mimeType + "\r\n\r\n";
        const body = new Blob([head, blob, "\r\n--" + boundary + "--"], { type: "multipart/related; boundary=" + boundary });
        const res = await gFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name", { method: "POST", headers: { "Content-Type": "multipart/related; boundary=" + boundary }, body });
        if (!res.ok) throw new Error("Drive upload lỗi " + res.status);
        const j = await res.json(); return j.id;
      }
      // File lớn: tải lên tiếp nối được (resumable).
      const init = await gFetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id,name", {
        method: "POST", headers: { "Content-Type": "application/json; charset=UTF-8", "X-Upload-Content-Type": meta.mimeType, "X-Upload-Content-Length": String(blob.size) }, body: JSON.stringify(meta),
      });
      if (!init.ok) throw new Error("Drive resumable lỗi " + init.status);
      const sessionUri = init.headers.get("Location");
      if (!sessionUri) throw new Error("Drive không trả địa chỉ tải lên");
      let lastErr = null;
      for (let attempt = 0; attempt < 3; attempt++) {
        try {
          const up = await fetch(sessionUri, { method: "PUT", headers: { "Content-Type": meta.mimeType }, body: blob });
          if (up.ok) { const j = await up.json(); return j.id; }
          lastErr = new Error("Tải lên lỗi " + up.status);
          if (up.status < 500) break;
        } catch (e) { lastErr = e; }
      }
      throw lastErr || new Error("Tải lên Drive thất bại");
    }
    async function driveDownload(fileId) {
      // Ưu tiên bộ đệm IndexedDB theo driveFileId — không tải lại từ Drive.
      const cached = await idb.get("files", "drive:" + fileId);
      if (cached) return cached;
      const res = await gFetch("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(fileId) + "?alt=media");
      if (!res.ok) throw new Error("Tải file từ Drive lỗi " + res.status);
      const blob = await res.blob();
      idb.put("files", "drive:" + fileId, blob);
      return blob;
    }
    async function driveDelete(fileId) {
      let ok = false;
      try { const res = await gFetch("https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(fileId), { method: "DELETE" }); ok = res.ok || res.status === 404; } catch (e) {}
      if (ok) idb.del("files", "drive:" + fileId);
      return ok;
    }
    /* Hàng đợi xoá bù (mục 8): file Drive chưa xoá được lúc token hết hạn sẽ được
       xoá ở lần có token sau, tránh file mồ côi chiếm dung lượng Drive. */
    async function processPendingDeletes() {
      if (!S.user || !tokenValid() || !DB.pendingDeletes || !DB.pendingDeletes.length) return;
      const rest = [];
      for (const fid of DB.pendingDeletes.slice()) {
        const ok = await driveDelete(fid);
        if (!ok) rest.push(fid);
      }
      if (rest.length !== DB.pendingDeletes.length) { DB.pendingDeletes = rest; persist("pendingDeletes"); }
    }
    async function driveList() {
      const out = []; let pageToken = "";
      do {
        const url = "https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=nextPageToken,files(id,name,mimeType,size)&pageSize=100" + (pageToken ? "&pageToken=" + encodeURIComponent(pageToken) : "");
        const res = await gFetch(url);
        if (!res.ok) break;
        const j = await res.json();
        (j.files || []).forEach((f) => out.push(f));
        pageToken = j.nextPageToken || "";
      } while (pageToken);
      return out;
    }
    /* Gắn lại driveFileId cho sách nào metadata thiếu mà file vẫn còn trên Drive (khớp theo tên file). */
    async function reconcileDriveFiles() {
      if (!S.user || !tokenValid()) return;
      const missing = DB.books.filter((b) => !b.driveFileId);
      if (!missing.length) return;
      try {
        const files = await driveList();
        let changed = false;
        missing.forEach((b) => {
          const hit = files.find((f) => f.name === b.fileName);
          if (hit) { b.driveFileId = hit.id; changed = true; }
        });
        if (changed) persist("books");
      } catch (e) {}
    }

    /* ================= Đăng nhập GIS ngay trong app / đăng xuất ================= */
    let gisInitDone = false, oneTapTried = false;
    function gisIdAvailable() { return !!(window.google && google.accounts && google.accounts.id); }
    function initGisId() {
      if (gisInitDone) return true;
      if (!gisIdAvailable()) return false;
      try {
        google.accounts.id.initialize({ client_id: WEB_OAUTH_CLIENT_ID, callback: onGisCredential, auto_select: false, cancel_on_tap_outside: true, itp_support: true });
        gisInitDone = true;
        return true;
      } catch (e) { return false; }
    }
    function mountGisButtons() {
      if (!initGisId()) return;
      $$("[data-gis-slot]").forEach((el) => {
        if (el.getAttribute("data-gis-done") === "1") return;
        try {
          google.accounts.id.renderButton(el, { theme: "outline", size: "large", shape: "pill", text: "signin_with", locale: "vi", logo_alignment: "left", width: 240 });
          el.setAttribute("data-gis-done", "1");
          const wrap = el.closest ? el.closest(".gis-signin") : null;
          if (wrap) wrap.classList.add("gis-on");
        } catch (e) { /* GIS bị chặn (ví dụ tên miền chưa khai báo): nút dự phòng vẫn còn để bấm */ }
      });
      maybePromptOneTap();
    }
    function maybePromptOneTap() {
      if (S.user || oneTapTried || !gisInitDone) return;
      oneTapTried = true;
      try {
        // Hàm One Tap của GIS: lớp phủ chọn tài khoản do Google vẽ, không phải hộp thoại của trình duyệt.
        const showOneTap = google.accounts.id.prompt.bind(google.accounts.id);
        showOneTap((n) => { if (n && n.isNotDisplayed && n.isNotDisplayed()) S.oneTapBlocked = true; });
      } catch (e) {}
    }
    async function onGisCredential(resp) {
      if (!resp || !resp.credential) return;
      if (!fbAuth) { toast("Đang tải thư viện tài khoản — anh chờ vài giây rồi bấm lại nhé."); return; }
      try {
        const cred = firebase.auth.GoogleAuthProvider.credential(resp.credential);
        await fbAuth.signInWithCredential(cred);
        toast("Đã đăng nhập bằng Google ngay trong app — sách sẽ tự đồng bộ về tài khoản của anh.");
      } catch (e) {
        if (e && e.code === "auth/unauthorized-domain") { toast("Tên miền này chưa được khai báo trong Firebase Auth nên Google chưa cho đăng nhập tại đây.", 5200); return; }
        toast("Đăng nhập chưa thành công: " + ((e && e.message) || e), 4600);
      }
    }
    function gisSigninHTML(fallbackLabel) {
      return '<div class="gis-signin"><div class="gis-slot" data-gis-slot></div><button class="btn primary gis-fallback" data-act="signin">' + googleG(17) + " " + (fallbackLabel || "Đăng nhập bằng Google") + '</button><span class="gis-note">Chọn tài khoản ngay trên app</span></div>';
    }
    async function signInGoogle() {
      if (!fbAuth) { toast("Chưa tải được thư viện đăng nhập Google — anh kiểm tra mạng rồi thử lại nhé."); return; }
      if (!initGisId()) { toast("Nút đăng nhập Google đang tải — anh chờ vài giây rồi bấm lại nhé. App không mở trang ngoài đâu ạ.", 4600); return; }
      mountGisButtons();
      oneTapTried = false;
      try {
        const showOneTap = google.accounts.id.prompt.bind(google.accounts.id);
        showOneTap((n) => {
          if (n && ((n.isNotDisplayed && n.isNotDisplayed()) || (n.isSkippedMoment && n.isSkippedMoment()))) {
            toast("Lớp phủ chọn tài khoản chưa hiện được (trình duyệt có thể đang chặn) — anh bấm nút “Sign in with Google” ngay trên app, và cho phép cửa sổ bật lên (popup) cho trang này nhé.", 5600);
          }
        });
      } catch (e) { toast("Anh bấm nút “Sign in with Google” ngay trên app để chọn tài khoản nhé.", 4600); }
    }
    async function reauthWithConsent() {
      if (!S.user || !fbAuth) return signInGoogle();
      try {
        reassureScope();
        await refreshGToken(true);
        await checkScopes();
        toast(S.scopeMissing.length ? "Vẫn còn thiếu quyền — anh kiểm tra lại giúp em." : "Đã cấp đủ quyền rồi ạ.");
      } catch (e) { toast(scopeErrMsg(e), 5600); }
    }
    async function manualResync() {
      try { reassureScope(); await refreshGToken(true); toast("Đã làm mới phiên đồng bộ."); if (S.view === "play") syncPlayMain(); }
      catch (e) { toast(scopeErrMsg(e), 5600); }
    }
    async function signOutGoogle() {
      stopCloudSync(); clearGToken(); S.tokenState = "none";
      /* Khoá đã nằm an toàn trong tài khoản — xoá bản đệm dùng chung trên máy để đăng xuất là không còn thấy khóa. */
      try { localStorage.removeItem("hp-api-keys"); localStorage.removeItem("hp-tts-keys-v1"); } catch (e) {}
      oneTapTried = true; // vừa đăng xuất: không bật lại lớp phủ One Tap ngay
      try { if (gisIdAvailable()) google.accounts.id.disableAutoSelect(); } catch (e) {}
      try { await fbAuth.signOut(); } catch (e) {}
      S.user = null; await loadLocal(); S.view = "home"; render();
      toast("Đã đăng xuất. Sách khách trên máy này vẫn còn nguyên.");
    }

    /* ================= Bìa sách ================= */
    function coverHTML(book, tag) {
      const fmt = (book.format || "epub").toUpperCase();
      if (book.cover) return '<img src="' + book.cover + '" alt="" loading="lazy" /><span class="fmt">' + fmt + "</span>";
      return '<span class="ph" style="background:' + coverGradient(book.title + book.id) + '"><span class="tag">' + (tag || "Sách của tôi") + '</span><span class="t">' + esc(book.title) + '</span><span class="a">' + esc(book.author || "") + '</span></span><span class="fmt">' + fmt + "</span>";
    }
    function playCoverHTML(b) {
      if (b.coverUrl) return '<img src="' + esc(b.coverUrl) + '" alt="" loading="lazy" referrerpolicy="no-referrer" />';
      return '<span class="ph" style="background:' + coverGradient(b.title + b.googleId) + '"><span class="tag">Play Sách</span><span class="t">' + esc(b.title) + '</span><span class="a">' + esc(b.author || "") + "</span></span>";
    }
    function posOf(bookId) { return DB.positions[bookId] || null; }
    function pctOf(book) { const p = posOf(book.id); return p && typeof p.percent === "number" ? Math.max(0, Math.min(100, Math.round(p.percent * 100))) : 0; }

    /* Kệ gỗ Mẫu 2: bìa đứng thành hàng trên ván kệ, tên sách nằm dưới ván. */
    function shelfHTML(items, columns, coverFn, metaFn) {
      let html = "";
      for (let i = 0; i < items.length; i += columns) {
        const row = items.slice(i, i + columns);
        const cols = "repeat(" + columns + ",minmax(0,1fr))";
        html += '<div class="shelf-row"><div class="shelf-covers" style="grid-template-columns:' + cols + '">' + row.map((it) => '<div class="book-cell">' + coverFn(it) + "</div>").join("") + '</div><div class="shelf-plank"></div><div class="shelf-meta" style="grid-template-columns:' + cols + '">' + row.map((it) => '<div class="book-cell">' + metaFn(it) + "</div>").join("") + "</div></div>";
      }
      return html;
    }
    function shelfColumns(variant) {
      const w = window.innerWidth;
      if (variant === "play") return w >= 1680 ? 9 : w >= 1400 ? 8 : w >= 1150 ? 7 : w >= 1024 ? 6 : w >= 640 ? 4 : 3;
      return w >= 1680 ? 9 : w >= 1400 ? 8 : w >= 1150 ? 7 : w >= 1024 ? 6 : w >= 640 ? 4 : w >= 420 ? 3 : 2;
    }
    function bookCoverBtn(book) {
      const pct = pctOf(book);
      return '<button class="cover" data-open-book="' + book.id + '" aria-label="Đọc sách: ' + esc(book.title) + '">' + coverHTML(book) + (pct > 0 && pct < 100 ? '<span class="mini-progress"><i style="width:' + pct + '%"></i></span>' : "") + "</button>";
    }
    function bookMetaHTML(book, showMenu) {
      const pct = pctOf(book);
      const pos = posOf(book.id) || {};
      const totalPages = pos.totalPages || 0;
      let sub = "";
      if (pct >= 100) sub = "Đã đọc xong";
      else if (pct > 0) {
        let mins = 0;
        if (book.format === "pdf" && totalPages) mins = Math.round(Math.max(0, totalPages - (pos.page || 0)) * 0.75);
        else if (totalPages) mins = Math.round((1 - (pos.percent || 0)) * totalPages * 1024 / (DB.settings.wpm || 820));
        sub = mins >= 1 ? "Còn khoảng " + mins + " phút đọc • Đã đọc " + pct + "%" : "Đã đọc " + pct + "%";
      } else if (totalPages) sub = "Khoảng " + totalPages + " trang";
      return '<span class="book-title">' + esc(book.title) + '</span><span class="book-author">' + esc(book.author || "Chưa rõ tác giả") + "</span>" +
        (sub ? '<span class="book-sub">' + sub + "</span>" : "") +
        (showMenu ? '<div style="margin-top:5px"><button class="btn small ghost" data-book-menu="' + book.id + '">' + icon("dots", 16) + " Thêm</button></div>" : "");
    }

    /* ================= Khung chính ================= */
    const NAV = [
      { id: "home", label: "Trang chủ", ic: "home" },

      { id: "shelf", label: "Thư viện có sẵn", ic: "books" },

      { id: "play", label: "Play Sách", ic: "play" },

      { id: "settings", label: "Cài đặt", ic: "gear" },
    ];
    /* Thanh trên gọn: chỉ nút biểu tượng tròn + avatar 32px ở cuối.
       Bấm avatar mở menu nhỏ (tên + email, Đồng bộ lại, Đăng xuất); bấm ra ngoài thì đóng. */
    let acctMenuOpen = false;
    function closeAcctMenu() {
      if (!acctMenuOpen) return;
      acctMenuOpen = false;
      const m = document.querySelector(".acct-menu");
      if (m) m.remove();
      const b = document.querySelector('[data-act="acct-menu"]');
      if (b) b.setAttribute("aria-expanded", "false");
    }
    document.addEventListener("click", (e) => {
      if (!acctMenuOpen) return;
      const t = e.target;
      if (!t || !t.closest) return;
      if (t.closest('[data-act="acct-menu"]')) return; // nút avatar tự xử lý đóng/mở
      if (!t.closest(".acct")) closeAcctMenu();
    });
    function accountHTML() {
      const themeBtn = '<button class="icon-btn" data-act="theme-toggle" aria-label="Chuyển giao diện sáng / tối" title="Đổi nền sáng / tối">' + icon(uiTheme() === "dark" ? "sun" : "moon", 18) + "</button>";
      const gearBtn = '<button class="icon-btn" data-nav="settings" aria-label="Cài đặt" title="Cài đặt">' + icon("gear", 19) + "</button>";
      if (S.user) {
        const name = S.user.displayName || S.user.email || "Tài khoản Google";
        const email = S.user.email || "";
        const initial = esc((name || "G").trim().charAt(0).toUpperCase() || "G");
        const avatar = S.user.photoURL ? '<img src="' + esc(S.user.photoURL) + '" alt="" referrerpolicy="no-referrer" />' : '<span class="avatar-fallback">' + initial + "</span>";
        const resyncBtn = '<button class="icon-btn" data-act="resync" aria-label="Đồng bộ lại" title="Đồng bộ lại">' + icon("sync", 18) + (S.tokenState === "expired" ? '<span class="warn-dot" aria-hidden="true"></span>' : "") + "</button>";
        const menu = acctMenuOpen ?
          '<div class="acct-menu" role="menu">' +
            '<div class="acct-head"><b>' + esc(name) + "</b>" + (email ? "<span>" + esc(email) + "</span>" : "") +
            (S.tokenState === "expired" ? '<span class="expired">Phiên đồng bộ đã hết hạn</span>' : "") + "</div>" +
            '<button class="acct-item" data-act="resync">' + icon("sync", 16) + " Đồng bộ lại</button>" +
            '<button class="acct-item danger" data-act="signout">' + icon("out", 16) + " Đăng xuất</button>" +
          "</div>" : "";
        return resyncBtn + themeBtn + gearBtn +
          '<div class="acct"><button class="avatar-btn" data-act="acct-menu" aria-label="Tài khoản" aria-haspopup="menu" aria-expanded="' + (acctMenuOpen ? "true" : "false") + '">' + avatar + "</button>" + menu + "</div>";
      }
      const guestMenu = acctMenuOpen ?
        '<div class="acct-menu" role="menu">' +
          '<div class="acct-head"><b>Chế độ khách</b><span>Sách lưu trên máy này</span></div>' +
          gisSigninHTML() +
        "</div>" : "";
      return themeBtn + gearBtn +
        '<div class="acct"><button class="avatar-btn" data-act="acct-menu" aria-label="Tài khoản" aria-haspopup="menu" aria-expanded="' + (acctMenuOpen ? "true" : "false") + '"><span class="avatar-fallback">?</span></button>' + guestMenu + "</div>";
    }
    function render() {
      const app = $("#app");
      if (!app) return;
      if (R.open) { if (S.aiPanel) renderAiPanel(); return; } // đang đọc sách: không vẽ lại khung ngoài, nhưng panel AI vẫn cập nhật
      const tabs = NAV.map((n) => '<button class="tab' + (S.view === n.id ? " active" : "") + '" data-nav="' + n.id + '">' + icon(n.ic, 17) + esc(n.label) + "</button>").join("");
      const bottom = ["home", "library", "shelf", "play", "ai", "listen"].map((id) => { const n = NAV.find((x) => x.id === id); return '<button class="' + (S.view === id ? "active" : "") + '" data-nav="' + id + '">' + icon(n.ic, 21) + esc(n.label) + "</button>"; }).join("");
      let body = "";
      if (S.view === "home") body = viewHome();
      else if (S.view === "library") body = viewLibrary();
      else if (S.view === "shelf") body = viewShelf();
      else if (S.view === "reading") body = viewReading();
      else if (S.view === "play") body = viewPlay();
      else if (S.view === "ai") body = viewAI();

    /* Ghim thanh điều hướng dưới theo đúng phần màn hình nhìn thấy được (visualViewport),
       để trình duyệt nhúng có thanh công cụ nổi của app chứa không che mất chân app.
       QUAN TRỌNG: chỉ tính lại khi viewport ĐỔI KÍCH THƯỚC (xoay máy, bàn phím mở/đóng,
       thanh công cụ trình duyệt ẩn/hiện) — tuyệt đối KHÔNG nghe sự kiện scroll của
       visualViewport: viết lại style giữa lúc người dùng vuốt khiến thanh bị trễ
       khung hình, trông như bị ghim cứng và giật theo trang. Việc cập nhật cũng dồn
       vào requestAnimationFrame và chỉ ghi khi giá trị thật sự thay đổi. */
    let pinNavRaf = 0;
    function pinBottomNav() {
      if (pinNavRaf) return;
      pinNavRaf = requestAnimationFrame(() => {
        pinNavRaf = 0;
        const nav = document.querySelector(".bottomnav");
        if (!nav) return;
        if (!window.visualViewport) { if (nav.style.bottom !== "0px") nav.style.bottom = "0px"; return; }
        const vv = window.visualViewport;
        const off = Math.max(0, Math.round(window.innerHeight - vv.height - vv.offsetTop));
        const val = off + "px";
        if (nav.style.bottom !== val) nav.style.bottom = val;
      });
    }
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", pinBottomNav);
    }
    window.addEventListener("resize", pinBottomNav);
    window.addEventListener("orientationchange", pinBottomNav);

    /* ================= Trang chủ ================= */
    function greeting() {
      const h = new Date().getHours();
      if (h < 5) return "Chúc anh ngủ ngon";
      if (h < 11) return "Chào buổi sáng";
      if (h < 13) return "Chào buổi trưa";
      if (h < 18) return "Chào buổi chiều";
      return "Chào buổi tối";
    }
    function localDayKey(d) { d = d || new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
    function todayMinutes() { const log = (DB.stats && DB.stats.readLog) || {}; return Math.round(log[localDayKey()] || 0); }
    /* Chuỗi ngày đọc liên tục tính tới hôm nay (hôm nay chưa đọc thì tính tới hôm qua). */
    function streakDays() {
      const log = (DB.stats && DB.stats.readLog) || {};
      let streak = 0; const d = new Date();
      if (!((log[localDayKey(d)] || 0) > 0)) d.setDate(d.getDate() - 1);
      while ((log[localDayKey(d)] || 0) > 0) { streak++; d.setDate(d.getDate() - 1); }
      return streak;
    }
    /* Ước tính phút còn lại của chương đang đọc — chỉ khi đã có văn bản chương trong bộ nhớ đệm. */
    function chapterRemainingText(book) {
      const chapters = textCache[book.id];
      if (!chapters || !chapters.length) return "";
      const pos = posOf(book.id) || {};
      const total = chapters.reduce((s, c) => s + c.text.length, 0) || 1;
      let read = (pos.percent || 0) * total;
      for (const c of chapters) {
        if (read < c.text.length) { const mins = Math.max(1, Math.round((c.text.length - read) / (DB.settings.wpm || 820))); return "Còn ~" + mins + " phút chương này"; }
        read -= c.text.length;
      }
      return "";
    }
    function weekMinutes() {
      const log = (DB.stats && DB.stats.readLog) || {};
      const now = new Date(); const monday = new Date(now); monday.setDate(now.getDate() - ((now.getDay() + 6) % 7)); monday.setHours(0, 0, 0, 0);
      let sum = 0;
      Object.keys(log).forEach((k) => { const d = new Date(k + "T00:00:00"); if (d >= monday) sum += Number(log[k]) || 0; });
      return Math.round(sum);
    }
    function inProgressBooks() {
      return DB.books.filter((b) => { const p = posOf(b.id); return p && p.percent > 0.001 && p.percent < 0.999; })

    }

    /* ================= Play Sách ================= */
    function playReaderUrl(b) { return b.readerLink || ("https://play.google.com/books/reader?id=" + encodeURIComponent(b.googleId)); }
    /* Trang THƯ VIỆN Play Sách — nơi duy nhất có menu ⋮ → “Tải xuống EPUB/PDF” cho sách tự tải lên.
       Trang đọc (reader) KHÔNG có nút tải file, nên bước lấy file phải trỏ về đây. */
    function playLibraryUrl() { return "https://play.google.com/books"; }
    let pendingPlayLink = "";
    /* Chuẩn hoá tên sách để khớp giữa Play Sách và thư viện tải lên: bỏ dấu, bỏ đuôi .epub/.pdf, bỏ ký tự lạ. */
    function normTitle(s) {
      return String(s || "").normalize("NFC").toLowerCase()
        .replace(/đ/g, "d")
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/\.(epub|pdf)$/i, "")
        .replace(/[^a-z0-9\s]/g, " ")
        .replace(/\s+/g, " ").trim();
    }
    /* Tìm cuốn tương ứng trong thư viện tải lên của app: ưu tiên liên kết đã ghi nhớ, rồi khớp tên chuẩn hoá. */
    function findLocalForPlay(pb) {
      if (pb.localId) { const linked = findBook(pb.localId); if (linked) return linked; }
      const nt = normTitle(pb.title);
      if (!nt) return null;
      let m = DB.books.find((b) => normTitle(b.title) === nt);
      if (m) return m;
      const stripNum = (t) => t.replace(/^\d+\s+/, "");
      const ntl = stripNum(nt);
      if (ntl.length >= 6) { m = DB.books.find((b) => stripNum(normTitle(b.title)) === ntl); if (m) return m; }
      m = DB.books.find((b) => { const t = normTitle(b.title); return t.length >= 10 && nt.length >= 10 && (t.includes(nt) || nt.includes(t)); });
      return m || null;
    }
    /* Quét toàn bộ Play Sách, tự nối các cuốn đã có file trùng tên trong app; trả về số cuốn mới nối. */
    function linkPlayBooks() {
      const byId = new Map(DB.books.map((b) => [b.id, b]));
      const byNorm = new Map(); const byStrip = new Map();
      DB.books.forEach((b) => {
        const t = normTitle(b.title); if (!t) return;
        if (!byNorm.has(t)) byNorm.set(t, b);
        const s = t.replace(/^\d+\s+/, ""); if (s && !byStrip.has(s)) byStrip.set(s, b);
      });
      let n = 0;
      Object.values(DB.playBooks).forEach((pb) => {
        const nt = normTitle(pb.title);
        const m = (pb.localId && byId.get(pb.localId)) || byNorm.get(nt) || byStrip.get(nt.replace(/^\d+\s+/, "")) || null;
        if (m && pb.localId !== m.id) { pb.localId = m.id; n++; }
      });
      if (n) persist("playBooks");
      return n;
    }
    /* Panel chi tiết sách Play Sách — mở ngay trong app, không tự chuyển ra ngoài. */
    function playDetail(googleId) {
      const pb = DB.playBooks[googleId]; if (!pb) return;
      const local = findLocalForPlay(pb);
      if (local && pb.localId !== local.id) { pb.localId = local.id; persist("playBooks"); }

    /* Lấy TOÀN BỘ sách useruploaded: phân trang 40/cuộn tới khi hết, chốt an toàn 5000. */
    async function fetchAllUploaded(token, email) {
      const volumes = []; const PAGE = 40; const CAP = 5000; let start = 0;
      for (;;) {
        const url = "https://www.googleapis.com/books/v1/volumes/useruploaded?maxResults=" + PAGE + "&startIndex=" + start + "&projection=FULL";
        const res = token ? await gFetch(url, {}, token) : await gFetch(url);
        if (res.status === 401) throw new Error("401");
        if (res.status === 403) throw new Error("Google chưa cấp quyền đọc Play Sách cho phiên này — anh đăng nhập lại và đồng ý quyền sách giúp em.");
        if (!res.ok) throw new Error("Google Books trả lỗi " + res.status);
        const data = await res.json();
        const items = data.items || [];
        volumes.push.apply(volumes, items);
        start += items.length;
        const st = $("#play-status");
        if (st) st.innerHTML = "Đang tải tủ sách từ " + esc(email || "tài khoản Google") + "... (Đã tìm thấy " + volumes.length + ' cuốn)<br/><span style="color:var(--faint)">Dữ liệu gốc trên Google của bạn được giữ nguyên 100%</span>';
        if (items.length < PAGE) break;
        if (volumes.length >= CAP) break;
        const total = data.totalItems || 0;
        if (total > 0 && volumes.length >= total) break;
        await new Promise((r) => setTimeout(r, 150)); // nghỉ ~150ms giữa các trang phân trang
      }
      return volumes;
    }
    function mergePlayVolumes(email, volumes) {
      let added = 0;
      volumes.forEach((v) => {
        if (!v || !v.id) return;
        const info = v.volumeInfo || {};
        const thumb = (info.imageLinks && (info.imageLinks.thumbnail || info.imageLinks.smallThumbnail)) || "";
        const prior = DB.playBooks[v.id];
        const sources = new Set(prior && prior.sources ? prior.sources : []);
        if (email) sources.add(email);
        DB.playBooks[v.id] = {
          googleId: v.id,
          title: (info.title || "").trim() || "Sách không tên",
          author: (info.authors || []).join(", "),
          coverUrl: thumb ? thumb.replace(/^http:\/\//, "https://") : (prior ? prior.coverUrl || "" : ""),
          readerLink: (v.accessInfo && v.accessInfo.webReaderLink) || (prior ? prior.readerLink || "" : ""),
          infoLink: info.infoLink || "",
          description: String(info.description || (prior ? prior.description || "" : "")).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim().slice(0, 900),
          categories: Array.isArray(info.categories) && info.categories.length ? info.categories.slice(0, 4) : (prior && prior.categories ? prior.categories : []),
          genre: prior && prior.genre ? prior.genre : "",
          localId: prior ? prior.localId || "" : "",
          sources: Array.from(sources),
          syncedAt: Date.now(),
        };
        if (!prior) added++;
      });
      return added;
    }

    /* ================= Thêm sách / phân tích metadata ================= */
    async function downscaleCover(blob) {
      try {
        const bmp = await createImageBitmap(blob);
        const maxW = 360; const scale = Math.min(1, maxW / bmp.width);
        const cv = document.createElement("canvas"); cv.width = Math.round(bmp.width * scale); cv.height = Math.round(bmp.height * scale);
        cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
        return cv.toDataURL("image/jpeg", 0.82);
      } catch (e) { return ""; }
    }
    async function blobToDataURL(blob) { return new Promise((res) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => res(""); r.readAsDataURL(blob); }); }
    async function parseEpubMeta(buf, fileName) {
      const meta = { title: "", author: "", cover: "" };
      if (!window.JSZip) return meta;
      try {
        const zip = await JSZip.loadAsync(buf);
        const contFile = zip.file("META-INF/container.xml");
        if (!contFile) return meta;
        const cont = await contFile.async("string");
        const m = cont.match(/full-path="([^"]+)"/);
        const opfPath = m ? m[1] : "OEBPS/content.opf";
        const opfFile = zip.file(opfPath);
        if (!opfFile) return meta;
        const opf = await opfFile.async("string");
        const doc = new DOMParser().parseFromString(opf, "text/xml");
        const pick = (tag) => { const el = doc.getElementsByTagName("dc:" + tag)[0] || doc.getElementsByTagName(tag)[0]; return el ? (el.textContent || "").trim() : ""; };
        meta.title = pick("title"); meta.author = pick("creator");
        const base = opfPath.includes("/") ? opfPath.slice(0, opfPath.lastIndexOf("/") + 1) : "";
        let coverHref = "";
        const items = doc.getElementsByTagName("item");
        for (let i = 0; i < items.length; i++) { const it = items[i]; if ((it.getAttribute("properties") || "").includes("cover-image")) { coverHref = it.getAttribute("href") || ""; break; } }
        if (!coverHref) {
          const metas = doc.getElementsByTagName("meta");
          for (let i = 0; i < metas.length; i++) if (metas[i].getAttribute("name") === "cover") {
            const cid = metas[i].getAttribute("content");
            for (let j = 0; j < items.length; j++) if (items[j].getAttribute("id") === cid) { coverHref = items[j].getAttribute("href") || ""; break; }
          }
        }
        if (coverHref) {
          const cf = zip.file(base + decodeURIComponent(coverHref)) || zip.file(coverHref);
          if (cf) { const blob = await cf.async("blob"); meta.cover = await downscaleCover(blob) || (await blobToDataURL(blob)); }
        }
      } catch (e) { /* dùng tên file làm dự phòng */ }
      return meta;
    }
    async function parsePdfMeta(buf) {
      const meta = { title: "", author: "", cover: "" };
      if (!window.pdfjsLib) return meta;
      try {
        pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
        const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;
        const md = await pdf.getMetadata().catch(() => null);
        if (md && md.info) { meta.title = (md.info.Title || "").trim(); meta.author = (md.info.Author || "").trim(); }
        if (pdf.numPages > 0) {
          const page = await pdf.getPage(1);
          const vp = page.getViewport({ scale: 0.55 });
          const cv = document.createElement("canvas"); cv.width = vp.width; cv.height = vp.height;
          await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
          meta.cover = cv.toDataURL("image/jpeg", 0.82);
        }
        pdf.destroy();
      } catch (e) {}
      return meta;
    }
    /* ---- Metadata + kiểm chứng nhanh cho các định dạng mới ---- */
    const FORMAT_MIME = {
      epub: "application/epub+zip", pdf: "application/pdf", txt: "text/plain",
      docx: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
      fb2: "application/x-fictionbook+xml", cbz: "application/vnd.comicbook+zip",
      md: "text/markdown", html: "text/html",
    };
    function decodeTxtBuffer(buf) {
      const u8 = new Uint8Array(buf);
      if (u8.length >= 2 && u8[0] === 0xff && u8[1] === 0xfe) return new TextDecoder("utf-16le").decode(buf);
      if (u8.length >= 2 && u8[0] === 0xfe && u8[1] === 0xff) return new TextDecoder("utf-16be").decode(buf);
      const t = new TextDecoder("utf-8").decode(buf);
      const bad = (t.match(/�/g) || []).length;
      if (bad > 20 && bad / Math.max(1, t.length) > 0.01) {
        const t2 = new TextDecoder("utf-16le").decode(buf);
        if ((t2.match(/�/g) || []).length < bad) return t2;
      }
      return t;
    }
    function decodeXmlBuffer(buf) {
      const head = new TextDecoder("ascii").decode(new Uint8Array(buf).slice(0, 300));
      const m = head.match(/encoding=["']([^"']+)["']/i);
      const enc = (m && m[1]) || "utf-8";
      try { return new TextDecoder(enc).decode(buf); } catch (e) { return new TextDecoder("utf-8").decode(buf); }
    }
    async function assertZipBuf(buf) {
      if (!window.JSZip) throw new Error("nozip");
      return JSZip.loadAsync(buf.slice(0));
    }
    async function parseDocxMeta(buf) {
      const meta = { title: "", author: "", cover: "" };
      try {
        const zip = await assertZipBuf(buf);
        const f = zip.file("docProps/core.xml");
        if (f) {
          const xml = await f.async("string");
          const doc = new DOMParser().parseFromString(xml, "text/xml");
          const pick = (tag) => { const el = doc.getElementsByTagName("dc:" + tag)[0] || doc.getElementsByTagName(tag)[0]; return el ? (el.textContent || "").trim() : ""; };
          meta.title = pick("title"); meta.author = pick("creator");
        }
      } catch (e) {}
      return meta;
    }
    async function parseFb2Meta(buf) {
      const text = decodeXmlBuffer(buf);
      if (text.indexOf("<FictionBook") < 0) throw new Error("notfb2");
      const doc = new DOMParser().parseFromString(text, "text/xml");
      if (doc.getElementsByTagName("parsererror").length) throw new Error("badfb2");
      const meta = { title: "", author: "", cover: "" };
      const bt = doc.getElementsByTagName("book-title")[0];
      if (bt) meta.title = (bt.textContent || "").trim();
      const authorEl = doc.getElementsByTagName("author")[0];
      if (authorEl) {
        const fn = authorEl.getElementsByTagName("first-name")[0];
        const ln = authorEl.getElementsByTagName("last-name")[0];
        meta.author = ((fn ? fn.textContent : "") + " " + (ln ? ln.textContent : "")).trim();
      }
      return meta;
    }
    /* Thêm sách theo ĐỢT: file khóa DRM / hỏng / ngoài danh sách bị bỏ qua nhẹ nhàng,
       không làm hỏng cả đợt. Thêm 1 file → báo 1 câu ngắn; thêm nhiều file → 1 dòng tổng kết. */
    async function addBookFiles(fileList) {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      const multi = files.length > 1;
      let added = 0, skipped = 0;
      const skip = (msg) => { skipped++; if (!multi) toast(msg, 5600); };
      for (const file of files) {
        const lower = file.name.toLowerCase();
        const extM = lower.match(/\.([a-z0-9]+)$/);
        const ext = extM ? extM[1] : "";
        if (ext === "acsm" || ext === "azw" || ext === "azw4" || ext === "kfx") { skip("“" + file.name + "” bị khóa bản quyền của hãng bán sách nên app bỏ qua nhé."); continue; }
        if (ext === "mobi" || ext === "azw3") { skip("Định dạng này sẽ được hỗ trợ ở bản sau"); continue; }
        const format = ["epub", "pdf", "txt", "docx", "fb2", "cbz", "md", "html"].indexOf(ext === "htm" ? "html" : ext) >= 0 ? (ext === "htm" ? "html" : ext) : "";
        if (!format) { skip("“" + file.name + "” không thuộc định dạng sách được hỗ trợ nên app bỏ qua nhé."); continue; }
        if (file.size > MAX_FILE_BYTES) { skip("File “" + file.name + "” nặng hơn 25 MB nên chưa thêm được."); continue; }
        try {
          const buf = await file.arrayBuffer();
          let meta = { title: "", author: "", cover: "" };
          if (format === "epub") { await assertZipBuf(buf); meta = await parseEpubMeta(buf, file.name); }
          else if (format === "pdf") {
            const h = new TextDecoder("ascii").decode(new Uint8Array(buf).slice(0, 5));
            if (h.indexOf("%PDF") !== 0) throw new Error("notpdf");
            meta = await parsePdfMeta(buf);
          }
          else if (format === "docx") { const zip = await assertZipBuf(buf); if (!zip.file("word/document.xml")) throw new Error("notdocx"); meta = await parseDocxMeta(buf); }
          else if (format === "fb2") { meta = await parseFb2Meta(buf); }
          else if (format === "cbz") {
            const zip = await assertZipBuf(buf);
            let imgs = 0; zip.forEach((p, en) => { if (!en.dir && /\.(jpe?g|png|gif|webp)$/i.test(p)) imgs++; });
            if (!imgs) throw new Error("nocbzimg");
          }
          else if (format === "txt") { decodeTxtBuffer(buf); }
          else if (format === "md") { decodeTxtBuffer(buf); }
          else if (format === "html") { const rawH = decodeTxtBuffer(buf); if (!/<(html|body|p|div|h1|article)[\s>]/i.test(rawH)) throw new Error("nothtml"); const td = new DOMParser().parseFromString(rawH, "text/html"); if (td.title) meta.title = td.title.trim().slice(0, 140); }
          const book = {
            id: uid(), title: meta.title || file.name.replace(/\.(epub|pdf|txt|docx|fb2|cbz)$/i, ""), author: meta.author || "",
            format, size: file.size, fileName: file.name, cover: meta.cover || "",
            driveFileId: "", collections: [], addedAt: Date.now(),
          };
          const blob = new Blob([buf], { type: FORMAT_MIME[format] || "application/octet-stream" });
          if (S.user) {
            // Điểm cần quyền Drive: Thêm sách CHỈ xin scope Drive — không gộp quyền Play Sách.
            if (!hasScope(DRIVE_SCOPE)) { reassureScope(); try { await requestScopes(DRIVE_SCOPE, true); } catch (e) { /* driveUpload sẽ báo lỗi và app lưu tạm trên máy */ } }
            try {
              book.driveFileId = await driveUpload(file.name, blob, blob.type);
              idb.put("files", "drive:" + book.driveFileId, blob);
            } catch (e) {
              await idb.put("files", "book:" + book.id, blob);
              if (!multi) toast("Chưa tải được lên Drive (em đã lưu tạm trên máy này): " + ((e && e.message) || e), 5000);
            }
          } else {
            await idb.put("files", "book:" + book.id, blob);
          }
          DB.books.push(book); persist("books");
          added++;
          if (!multi) toast("Đã thêm sách “" + book.title + "”.");
        } catch (e) { skip("“" + file.name + "” bị hỏng hoặc bị khóa nên app bỏ qua nhé."); }
      }
      if (multi) toast("Đã thêm " + added + " cuốn" + (skipped ? " · Bỏ qua " + skipped + " cuốn bị khóa/không hỗ trợ" : ""), 5600);
      const linkedNow = linkPlayBooks();
      render();
      if (pendingPlayLink) {
        const gid = pendingPlayLink; pendingPlayLink = "";
        const pb = DB.playBooks[gid];
        if (pb && pb.localId) { S.listenBookId = pb.localId; render(); toast("Đã nối “" + pb.title + "” với file trong app — đọc và nghe ngay trong app được rồi anh."); playDetail(gid); }
        else if (pb && added) { toast("Đã thêm file, nhưng tên sách chưa khớp với cuốn Play Sách này nên chưa tự nối được — anh thử đặt lại tên file cho giống tên sách giúp em.", 5600); playDetail(gid); }
      } else if (linkedNow && added) {

    /* ================= Trích xuất chương: TXT / DOCX / FB2 ================= */
    function isTextFormat(f) { return f === "txt" || f === "docx" || f === "fb2" || f === "md" || f === "html"; }
    function htmlToPlain(html) { const d = document.createElement("div"); d.innerHTML = html || ""; return (d.textContent || "").replace(/\s+/g, " ").trim(); }
    function textToHtml(text) {
      return String(text || "").split(/\n{2,}/).map((p) => p.trim()).filter(Boolean)
        .map((p) => "<p>" + esc(p).replace(/\n/g, "<br/>") + "</p>").join("");
    }
    /* Tự động làm sạch định dạng (CHỈ tác động bản hiển thị, không sửa file gốc):
       bỏ số trang đứng riêng + dòng đầu/chân trang lặp (tên sách/tác giả), gộp dòng bị ngắt giữa câu,
       sửa khoảng trắng thừa trước dấu câu. */
    function cleanTextFormat(text, book) {
      const lines = String(text || "").split(/\n/);
      const titleN = normTitle(book ? book.title : ""), authorN = normTitle(book ? (book.author || "") : "");
      const freq = {};
      lines.forEach((ln) => { const t = ln.trim(); if (t && t.length <= 70) freq[t] = (freq[t] || 0) + 1; });
      const kept = [];
      lines.forEach((ln) => {
        const t = ln.trim();
        if (t) {
          if (/^\d{1,4}$/.test(t)) return;
          const tn = normTitle(t);
          if (tn && (tn === titleN || (authorN && tn === authorN))) return;
          if (t.length <= 70 && freq[t] >= 5 && !/[.!?…]$/.test(t)) return;
        }
        kept.push(ln);
      });
      const out = [];
      kept.forEach((ln) => {
        const t = ln.replace(/\s+/g, " ").trim();
        if (!t) { out.push(""); return; }
        const prev = out[out.length - 1];
        if (prev && !/[.!?…:;”"']$/.test(prev) && !/^(chương|chapter|hồi|phần|quyển|tập|mục)\b/i.test(t) && prev.length < 1200) out[out.length - 1] = prev + " " + t;
        else out.push(t);
      });
      return out.join("\n").replace(/[ \t]+([.,;:!?…])/g, "$1").replace(/\n{3,}/g, "\n\n").trim();
    }
    function displayChapterHTML(ch) {
      const st = DB.settings;
      if (st.cleanFormat && isTextFormat(R.mode) && (ch.text || ch.html)) {
        let raw = ch.text || "";
        if (ch.html) {
          const stripped = ch.html.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|h[1-6]|div|li)>/gi, "\n\n").replace(/<[^>]+>/g, "");
          const ta = document.createElement("textarea"); ta.innerHTML = stripped; raw = ta.value;
        }
        const cleaned = cleanTextFormat(raw, R.book);
        return cleaned.split(/\n{2,}/).map((p) => p.trim()).filter(Boolean).map((p) => {
          const one = p.replace(/\n/g, " ");
          if (one.length <= 90 && /^(chương|chapter|hồi|phần|quyển|tập|mục)\b/i.test(one)) return '<h3 style="font-size:1.12em;line-height:1.4;margin:1.1em 0 .5em">' + esc(one.charAt(0).toUpperCase() + one.slice(1)) + "</h3>";
          return "<p>" + esc(one) + "</p>";
        }).join("");
      }
      return ch.html || textToHtml(ch.text);
    }
    /* Chia văn bản dài thành các phần đều nhau ~15.000–20.000 ký tự, cắt ở ranh giới đoạn/câu. */
    function chunkPlainText(text, size) {
      size = size || 17000;
      const paras = String(text || "").split(/\n{2,}/);
      const out = []; let cur = "";
      const push = () => { if (cur.trim()) out.push(cur.trim()); cur = ""; };
      paras.forEach((p) => {
        p = p.trim(); if (!p) return;
        if (cur && cur.length + p.length + 2 > size) push();
        while (p.length > size * 1.4) {
          let cut = p.lastIndexOf(". ", size); if (cut < size * 0.5) cut = p.lastIndexOf(" ", size); if (cut < size * 0.5) cut = size;
          out.push((cur ? cur + "\n\n" : "") + p.slice(0, cut + 1).trim()); cur = ""; p = p.slice(cut + 1).trim();
        }
        cur = cur ? cur + "\n\n" + p : p;
      });
      push();
      return out;
    }
    function chaptersFromText(text, fallbackPrefix) {
      const lines = String(text || "").split(/\r?\n/);
      const headRe = /^(chương|chapter|hồi|phần|quyển|tập|mục)\b/i;
      const heads = [];
      lines.forEach((ln, i) => { const t = ln.trim(); if (t.length >= 3 && t.length <= 90 && headRe.test(t)) heads.push(i); });
      let chapters = [];
      if (heads.length >= 2) {
        const pre = lines.slice(0, heads[0]).join("\n").trim();
        if (pre.length > 300) chapters.push({ title: "Mở đầu", text: pre, html: textToHtml(pre) });
        heads.forEach((hi, k) => {
          const title = lines[hi].trim();
          const body = lines.slice(hi + 1, k + 1 < heads.length ? heads[k + 1] : lines.length).join("\n").trim();
          if (body.length < 30) return;
          if (body.length > 42000) chunkPlainText(body, 19000).forEach((part, j) => chapters.push({ title: title + (j ? " (tiếp " + (j + 1) + ")" : ""), text: part.replace(/\s+/g, " ").trim(), html: textToHtml(part) }));
          else chapters.push({ title, text: body.replace(/\s+/g, " ").trim(), html: textToHtml(body) });
        });
      }
      if (!chapters.length) {
        chapters = chunkPlainText(text, 17000).map((part, i) => ({ title: (fallbackPrefix || "Phần") + " " + (i + 1), text: part.replace(/\s+/g, " ").trim(), html: textToHtml(part) }));
      }
      return chapters.filter((c) => c.text && c.text.length >= 30);
    }
    async function extractTxtChapters(buf) {
      const text = decodeTxtBuffer(buf).replace(/^\uFEFF/, "");
      return chaptersFromText(text, "Phần");
    }
    function docxFallbackHtml(xmlText) {
      const doc = new DOMParser().parseFromString(xmlText, "text/xml");
      const paras = doc.getElementsByTagName("w:p");
      let html = "";
      const runText = (r) => {
        let t = ""; const ts = r.getElementsByTagName("w:t");
        for (let i = 0; i < ts.length; i++) t += ts[i].textContent;
        const rpr = r.getElementsByTagName("w:rPr")[0];
        const isB = rpr && rpr.getElementsByTagName("w:b").length && !/val="false"/.test(new XMLSerializer().serializeToString(rpr.getElementsByTagName("w:b")[0]));
        const isI = rpr && rpr.getElementsByTagName("w:i").length && !/val="false"/.test(new XMLSerializer().serializeToString(rpr.getElementsByTagName("w:i")[0]));
        t = esc(t);
        if (isB) t = "<strong>" + t + "</strong>";
        if (isI) t = "<em>" + t + "</em>";
        return t;
      };
      for (let i = 0; i < paras.length; i++) {
        const p = paras[i];
        let style = "";
        const ps = p.getElementsByTagName("w:pStyle")[0];
        if (ps) style = ps.getAttribute("w:val") || "";
        let inner = ""; const runs = p.getElementsByTagName("w:r");
        for (let j = 0; j < runs.length; j++) inner += runText(runs[j]);
        if (!inner.trim()) continue;
        if (/Heading1|heading 1/i.test(style)) html += "<h1>" + inner + "</h1>";
        else if (/Heading2|heading 2/i.test(style)) html += "<h2>" + inner + "</h2>";
        else html += "<p>" + inner + "</p>";
      }
      return html;
    }
    async function extractDocxChapters(buf) {
      let html = "";
      if (window.mammoth) {
        try { const r = await mammoth.convertToHtml({ arrayBuffer: buf.slice(0) }); html = r.value || ""; } catch (e) { html = ""; }
      }
      if (!html) {
        const zip = await assertZipBuf(buf);
        const f = zip.file("word/document.xml");
        if (!f) throw new Error("notdocx");
        html = docxFallbackHtml(await f.async("string"));
      }
      const holder = document.createElement("div"); holder.innerHTML = html;
      let chapters = []; let cur = { title: "", html: "" };
      const push = () => {
        const t = htmlToPlain(cur.html);
        if (t.length >= 30) chapters.push({ title: cur.title || ("Phần " + (chapters.length + 1)), text: t, html: cur.html });
        cur = { title: "", html: "" };
      };
      Array.from(holder.childNodes).forEach((node) => {
        const tag = node.nodeType === 1 ? node.tagName : "";

    async function extractFb2Chapters(buf) {

    /* Sách từ file Markdown (xuất từ app ghi chú): tách chương theo # / ##, bóc ký hiệu markdown thừa. */
    function mdToSections(md) {
      const lines = String(md || "").replace(/\r\n?/g, "\n").split("\n");

      const push = () => { const t = cur.lines.join("\n").trim(); if (t.length >= 30 || cur.title) sections.push({ title: cur.title || "Mở đầu", text: t }); };
      lines.forEach((ln) => {
        const m = ln.match(/^(#{1,2})\s+(.+)$/);
        if (m) { push(); cur = { title: m[2].replace(/[*_`#]/g, "").trim(), lines: [] }; }
        else cur.lines.push(ln.replace(/^\s*[-*+]\s+/, "• ").replace(/\*\*([^*]+)\*\*/g, "$1").replace(/\*([^*]+)\*/g, "$1").replace(/`([^`]+)`/g, "$1").replace(/\[([^\]]+)\]\([^)]*\)/g, "$1"));

    /* ================= Trích xuất văn bản theo chương ================= */
    const textCache = {};
    async function extractChapters(book) {

      if (book.format === "cbz") {
        throw new Error("Truyện tranh chỉ đọc bằng mắt nhé");

    function updateReaderStatus() {

        s = pageTxt + (R.curChapterLabel ? " · " + esc(R.curChapterLabel) : "") + (R.pageInChapter ? " · " + esc(R.pageInChapter) : "");

        const eta = etaText();

    /* Kindle Time-to-Read: ước tính từ tốc độ đọc thật (ký tự/phút) đã học được. */
    function etaText() {
      const wpm = DB.settings.wpm || 0;
      if (!wpm || !R.book) return "";
      if (R.mode === "epub" && R.eBook && R.eBook.locations && R.eBook.locations.total) {
        const totalChars = R.eBook.locations.total * 1024;
        const remainBook = Math.max(0, (1 - R.curPercent) * totalChars) / wpm;
        const parts = [];
        const disp = R.pageInChapter.match(/Trang (\d+)\/(\d+)/);
        if (disp) { const remainCh = (Number(disp[2]) - Number(disp[1])) * 1024 / wpm; if (remainCh >= 1) parts.push("~" + Math.round(remainCh) + " phút hết chương"); }
        if (remainBook >= 1) parts.push("~" + (remainBook >= 90 ? (remainBook / 60).toFixed(1).replace(".0", "") + " giờ" : Math.round(remainBook) + " phút") + " hết sách");
        return parts.join(" · ");

      if (isTextMode() && R.textTotal) {
        const remain = Math.max(0, (1 - R.curPercent) * R.textTotal) / wpm;
        if (remain >= 1) return "~" + (remain >= 90 ? (remain / 60).toFixed(1).replace(".0", "") + " giờ" : Math.round(remain) + " phút") + " hết sách";
        return "";

      if (R.mode === "pdf" && R.pdfTotal) {
        const remainPages = R.pdfTotal - R.pdfPage;

      pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js";
      const pdf = await pdfjsLib.getDocument({ data: buf.slice(0) }).promise;

      const pos = posOf(R.book.id);

      R.pdfScrollMode = DB.settings.effect === "scroll";

        stage.innerHTML = '<div class="pdf-scroll" id="r-pdf-scroll"></div>';

          const cv = document.createElement("canvas"); cv.dataset.page = p; wrap.appendChild(cv);
          const page = await pdf.getPage(p);

          await page.render({ canvasContext: cv.getContext("2d"), viewport: vp }).promise;
          cv.style.marginBottom = "14px";
        }

          const cvs = $$("canvas", wrap);

          let cur = 1;

          if (cur !== R.pdfPage) { R.pdfPage = cur; R.curPercent = cur / R.pdfTotal; updateReaderStatus(); savePositionDebounced(); }
        }, 120));

    async function renderPdfPage(p) {

    /* ---- Truyện tranh CBZ: từng trang ảnh, sắp theo tên tự nhiên ---- */

    /* ---- Điều hướng chung ---- */
